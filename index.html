      return {
        codigo:(r[m.codigo]||'').trim(),nome:nomeBruto,cpfDig:soDigitos(r[m.documento]),
        plano:(r[m.plano]||'').trim(),valor:parseValorBR(r[m.valor])||0,periodicidade:(r[m.periodicidade]||'').trim(),
        dataInicio:parseDataBR(r[m.dataPrimeira]),status,statusPagamento
      };
    // Linhas de "Total"/"Total Ativos"/"Total Cancelados" são o rodapé do relatório, não clientes —
    // essas nunca devem virar assinante nenhum.
    }).filter(x=>x.nome&&!/^total\b/i.test(x.nome))}},
  transacoes:{titulo:'Transações (Celcoin)',multi:false,
    fields:[['codigo',['codigo']],['cliente',['nome do cliente']],['plano',['plano']],['bandeira',['bandeira do cartao','bandeira']],
      ['vencimento',['vencimento']],['valor',['valor']],['status',['status']],['dataStatus',['data do status atual']],['parcela',['parcela']],['operadora',['operadora']]],
    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>{
      const operadora=(m.operadora!==undefined?(r[m.operadora]||''):'').trim();
      return {codigo:(m.codigo!==undefined?(r[m.codigo]||''):'').trim(),nome:(r[m.cliente]||'').trim(),plano:(r[m.plano]||'').trim(),vencimento:parseDataBR(r[m.vencimento]),
      valor:parseValorBR(r[m.valor]),status:(r[m.status]||'').trim(),dataStatus:parseDataBR(r[m.dataStatus]),
      operadora,canal:classificaCanalTransacao(operadora)};
    }).filter(x=>x.nome)}},
  planosCatalogo:{titulo:'Catálogo de planos/clubes (lista de tipos de plano)',multi:false,
    fields:[['id',['id']],['nome',['nome']],['criadoEm',['criado em']],['atualizadoEm',['atualizado em']]],
    // Esse relatório é o CATÁLOGO de planos (os tipos de clube que existem), não uma lista de clientes.
    // Cada linha vira (ou atualiza) um Plano cadastrado — nunca um cliente.
    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>({
      idExterno:(r[m.id]||'').trim(),nome:(r[m.nome]||'').trim(),
      criadoEm:parseDataBR((r[m.criadoEm]||'').split(' ')[0])
    })).filter(x=>x.nome)}},
  cartaoCB:{titulo:'Assinaturas no cartão (Cash Barber)',multi:false,
    fields:[['cliente',['cliente']],['email',['email']],['telefone',['telefone']],['plano',['plano']],['tipoCobranca',['tipo de cobranca']],['vencimento',['vencimento']],['valor',['valor']],['status',['status']]],
    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>{
      const statusBruto=(r[m.status]||'').trim(),tipoCobranca=(r[m.tipoCobranca]||'').trim();
      return {nome:(r[m.cliente]||'').trim(),email:(r[m.email]||'').trim(),telefone:soDigitos(r[m.telefone]),plano:(r[m.plano]||'').trim(),tipoCobranca,canal:classificaCanalCartao(tipoCobranca),
        vencimento:parseDataBR(r[m.vencimento]),valor:parseValorBR(r[m.valor]),statusBruto,bucket:classificaStatusCartao(statusBruto)};
    }).filter(x=>x.nome)}},
  /* Planilha do valor REAL de cada assinante (exportada do Cash Barber por forma de pagamento): ID, Cliente, Plano, Valor (R$),
     Data de Início, Dia de Cobrança. Cada importação substitui só o canal escolhido (Cash Pag, Manual ou Cartão Celcoin). */
  valoresAss:{titulo:'Valor de cada assinante (planilha)',multi:false,
    fields:[['cid',['id','codigo']],['nome',['cliente','nome']],['plano',['plano']],['valor',['valor (r$)','valor']],['inicio',['data de inicio','inicio']],['dia',['dia de cobranca','dia cobranca']]],
    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>{
      const bruto=String(r[m.dia]==null?'':r[m.dia]).trim(),dia=parseInt(bruto,10);
      return {cid:String(r[m.cid]==null?'':r[m.cid]).trim(),nome:(r[m.nome]||'').trim(),plano:(r[m.plano]||'').trim(),valor:parseValorBR(r[m.valor]),inicio:parseDataBR(r[m.inicio]),dia:(dia>=1&&dia<=31)?dia:0,diaBruto:bruto};
    }).filter(x=>x.nome&&x.valor>0)}},
  catalogo:{titulo:'Catálogo (Produtos/Serviços/Bar-Cozinha)',multi:true,
    fields:[['nome',['nome','item','produto','servico','descricao','nome do item','nome do servico','nome do produto']],['tipo',['tipo','categoria','classe','grupo']],
      ['preco',['preco','preco sugerido','valor sugerido','preco de venda','valor de venda','valor']],['custo',['custo','custo unitario','preco de custo','preco custo']],
      ['status',['status']],['filial',['filial']]],
    parse(headers,rows){const m=mapHeaders(headers,this.fields);
      // "Valor de estoque"/"Potencial de venda" (relatório de estoque) não são preço de venda — a coluna 'preco'
      // só é aceita se o cabeçalho batido não for, na verdade, um desses dois (evita gravar preço R$ 0,00 por engano).
      const precoValido=m.preco!==undefined&&!/estoque|potencial/.test(normHead(headers[m.preco]));
      return rows.map(r=>{
      const tipoRaw=(m.tipo!==undefined?(r[m.tipo]||''):'').trim();
      const statusRaw=m.status!==undefined?String(r[m.status]||'').trim():'';
      const filialRaw=(m.filial!==undefined?(r[m.filial]||''):'').trim();
      const nome=(r[m.nome]||'').trim();
      const tipoFinal=tipoRaw?classificaTipoItem(tipoRaw):sugerirTipoItemPorNome(nome);
      // Coluna de categoria pode já dizer "serviço base"/"avulso" ou "serviço extra": respeita antes de adivinhar pelo nome.
      const subDaColuna=/extra|adicional|complement/.test(normHead(tipoRaw))?'Extra':/base|avulso|principal/.test(normHead(tipoRaw))?'Avulso':'';
      return {nome,tipoRaw,tipo:tipoFinal,
        subtipoServico:tipoFinal==='Serviço'?(subDaColuna||classificaSubtipoServico(nome)):undefined,
        origemTipo:tipoRaw?'coluna':'nome',
        preco:precoValido?parseValorBR(r[m.preco]):'',custo:m.custo!==undefined?parseValorBR(r[m.custo]):'',
        ativo:statusRaw===''?true:(statusRaw==='1'||/^ativ/i.test(statusRaw)),filialRaw};
      // Pedido da Caroline: inativo no Cash Barber nem entra no sistema (não importa como inativo, simplesmente
      // ignora a linha), variação de corte com/sem degradê também não entra (só "Corte de Cabelo" representa o
      // corte avulso), e — relatório de estoque por filial — unidade fechada/em reforma não entra, só a que está
      // funcionando ("ativa").
      }).filter(x=>x.nome&&x.ativo!==false&&!/degrade/.test(normHead(x.nome))&&!/fechad/.test(normHead(x.filialRaw)))}},
  colaboradores:{titulo:'Colaboradores (Cash Barber)',multi:false,
    // % de comissão só entra quando a coluna existe E não vem vazia — assim uma comissão já cadastrada manualmente
    // no app não é zerada por engano por um arquivo que não traz esse dado (mesma cautela usada em preço/custo do
    // catálogo). Hoje o app só guarda 1 percentual "padrão" por colaborador (comissão fixa) — se a Caroline usar
    // comissão por faixa/meta, esta importação só traz o restante do cadastro; a comissão continua manual até essa
    // estrutura existir.
    fields:[['nome',['nome']],['cargo',['funcao','cargo']],['telefone',['telefone','celular','whatsapp']],
      ['email',['email']],['comissao',['comissao','percentual comissao','percentual de comissao']],
      ['status',['status']],['dataAdmissao',['data de admissao','data admissao','data de cadastro']]],
    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>{
      const statusRaw=m.status!==undefined?String(r[m.status]||'').trim():'';
      const comissaoTxt=m.comissao!==undefined?String(r[m.comissao]||'').trim():'';
      const comissaoNum=comissaoTxt?parseMoney(comissaoTxt):NaN;
      return {nome:(r[m.nome]||'').trim(),cargoRaw:(m.cargo!==undefined?(r[m.cargo]||''):'').trim(),
        telefone:soDigitos(r[m.telefone]),email:(m.email!==undefined?(r[m.email]||''):'').trim(),
        comissaoPct:!isNaN(comissaoNum)?round2(clamp(comissaoNum,0,100)):null,
        ativo:statusRaw===''?true:(statusRaw==='1'||/^ativ/i.test(statusRaw)),
        dataAdmissao:m.dataAdmissao!==undefined?parseDataBR(r[m.dataAdmissao]):''};
    }).filter(x=>x.nome)}}
};
/* Planilha de catálogo (pedido da Caroline: subir produtos/serviços avulsos/serviços extras/bar-cozinha de uma vez
   só). Cobre 2 formatos reais: (1) planilha livre com coluna "Categoria/Tipo" já preenchida; (2) export nativo do
   Cash Barber (ID/Nome/Status/Criado em/Atualizado em) — sem categoria nem preço, um arquivo por tipo (um de
   "serviços", outro de "produtos" etc.) e "Status" 1/0 indicando ativo/inativo lá dentro. Quando não vem coluna de
   categoria (tipoRaw vazio), o tipo fica em branco aqui — a Caroline escolhe UMA categoria pra tudo daquele arquivo
   na tela de confirmação (com um palpite automático já vindo marcado, pelo nome dos itens).
   "Serviço avulso" e "serviço extra" caem os dois em TIPOS_ITEM "Serviço" (é como o app já agrupa o ranking de mais
   vendido) — a distinção avulso/extra vira só um sub-rótulo informativo (subtipoServico), calculado pelo nome. */
function classificaTipoItem(s){
  if(!String(s||'').trim())return '';
  const n=normHead(s);
  if(/bar|cozinha|bebida|drink|petisco/.test(n))return 'Bar/Cozinha';
  if(/servi/.test(n))return 'Serviço';
  if(/produto|cosmetic|revenda/.test(n))return 'Produto';
  return 'Produto';
}
/* Palavras-chave por tipo, reaproveitadas tanto pro palpite do arquivo inteiro (sugerirTipoBaseCatalogo, quando o
   arquivo é uma categoria só) quanto pro palpite item a item (sugerirTipoItemPorNome, quando o arquivo mistura
   categorias — ex.: relatório de estoque com bar/cozinha e outras coisas juntas na mesma planilha). */
const KW_TIPO_ITEM={
  // Checado primeiro: mais específico, evita falso positivo (ex.: "Óleo para Epilação" é PRODUTO, mesmo contendo
  // "epila" — se Serviço fosse checado antes, um item desses seria classificado errado).
  'Produto':/tintura|cera|oleo|shampoo|pomada|\bgel\b|creme|\bpo\b|descolorante|adstringente|adestringente|cotonete|papel|saco de lixo|essencia|vaporizador|revenda|vaso sanit|after shave|balm|balsamo|locao|tonico|condicionador|leave-?in|finalizador|perfume|colonia|hidratante|sabonete|navalha|lamina|\bpente\b|escova de|\bkit\b/,
  'Bar/Cozinha':/cerveja|drink|refrigerante|\bagua\b|suco|energetico|petisco|snack|\bbar\b|cozinha|\bcafe\b|espresso|chimarrao|erva[- ]mate|salgadinho|chocolate|\bbala\b|biscoito|achocolatado|refeicao|chop+e?\b|long ?neck|\blata\b|garrafa|heineken|budweiser|brahma|skol|antarctica|stella|corona|amstel|eisenbahn|colorado|coca|pepsi|guarana|fanta|sprite|schweppes|\bh2o\b|\bvinho|whisk?y|vodka|\bgin\b|\brum\b|cachaca|tequila|licor|campari|aperol|caipirinha|\bdose\b|\bshot\b|porcao|batata|hamburguer|sanduiche|\bx-|pastel|coxinha|pizza|torresmo|amendoim|tabua|\bpao\b|sorvete|\bdoce\b|\bcha\b|capuccino|cappuccino|cafezinho|red bull|monster|gatorade|isotonico|\bgelo\b/,
  'Serviço':/corte|barba|cabelo|epila|escova|acabamento|sobrancelha|hidrata|penteado|progressiv|platinad|luzes|relax|limpeza de pele|massagem|pigmenta|depila|design|selagem|botox capilar|reconstru|cauteriza|coloracao|camuflagem|pezinho|nariz|orelha|esfolia|peeling|black mask|barboterapia|toalha quente/};
/* Palpite de categoria para arquivos sem coluna de categoria (export nativo do Cash Barber, uma categoria por
   arquivo): conta quantos nomes batem com cada categoria e sugere a que tiver mais — a Caroline confirma ou troca
   antes de importar, nunca é automático sem ela ver. */
function sugerirTipoBaseCatalogo(nomes){
  const cont={'Serviço':0,'Produto':0,'Bar/Cozinha':0};
  (nomes||[]).forEach(nm=>{const n=normHead(nm);Object.keys(KW_TIPO_ITEM).forEach(k=>{if(KW_TIPO_ITEM[k].test(n))cont[k]++})});
  return Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][1]>0?Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0]:'Produto';
}
/* Palpite item a item (arquivos que misturam categorias na mesma planilha, ex.: relatório de estoque com produto
   de bar/cozinha e produto de estrutura juntos): classifica pelo próprio nome do item, sem precisar de coluna de
   categoria nem de escolher uma categoria única pro arquivo inteiro. */
function sugerirTipoItemPorNome(nome){
  const n=normHead(nome);
  if(/limpeza de pele|barboterapia|toalha quente|corte|sessao|aplicacao|pigmentacao/.test(n)&&!/(kit|pomada|shampoo|oleo|balm|gel|creme)\b/.test(n))return 'Serviço';
  if(KW_TIPO_ITEM['Produto'].test(n))return 'Produto';
  if(KW_TIPO_ITEM['Bar/Cozinha'].test(n))return 'Bar/Cozinha';
  if(KW_TIPO_ITEM['Serviço'].test(n))return 'Serviço';
  return 'Produto';
}
const AVULSO_SERVICO_KEYWORDS=['corte de cabelo','corte infantil','corte todo tesoura','corte todo na maquina','corte todo maquina','corte masculino','desenhar a barba'];
/* Serviço BASE = corte e barba (e combos só desses dois). Tudo que se soma a eles é EXTRA. */
function classificaSubtipoServico(nome){
  const n=normHead(nome);
  if(AVULSO_SERVICO_KEYWORDS.some(k=>n.includes(k)))return 'Avulso';
  const soCorteBarba=n.replace(/\b(de|do|da|e|com|mais|\+|\/|&|cabelo|masculino|feminino|infantil|adulto|social|simples|completo|na|a|o|tesoura|maquina|navalha|degrade)\b/g,' ').replace(/[^a-z]+/g,' ').trim();
  if(soCorteBarba&&/^(corte|barba)( (corte|barba))*$/.test(soCorteBarba))return 'Avulso';
  return 'Extra';
}
/* As 4 pastas que a Caroline enxerga na importação: Serviço base | Serviço extra | Produto | Bar e cozinha.
   Por baixo continuam sendo tipo ('Serviço'|'Produto'|'Bar/Cozinha') + subtipoServico ('Avulso'=base | 'Extra'). */
const CLASSES_CATALOGO=['Serviço base','Serviço extra','Produto','Bar/Cozinha'];
const ROTULO_CLASSE={'Serviço base':'Serviço base','Serviço extra':'Serviços extras','Produto':'Produtos','Bar/Cozinha':'Bar e cozinha'};
function classeDoRegistro(x){
  if(x.tipo==='Serviço')return (x.subtipoServico||classificaSubtipoServico(x.nome))==='Avulso'?'Serviço base':'Serviço extra';
  return x.tipo==='Bar/Cozinha'?'Bar/Cozinha':'Produto';
}
function aplicaClasse(x,classe){
  if(classe==='Serviço base'){x.tipo='Serviço';x.subtipoServico='Avulso';delete x.subtipoProduto}
  else if(classe==='Serviço extra'){x.tipo='Serviço';x.subtipoServico='Extra';delete x.subtipoProduto}
  else if(classe==='Bar/Cozinha'){x.tipo='Bar/Cozinha';delete x.subtipoServico;delete x.subtipoProduto}
  else{x.tipo='Produto';delete x.subtipoServico;x.subtipoProduto=x.subtipoProduto||classificaSubtipoProduto(x.nome)}
  x.classeManual=true;
}
/* Revisão do catálogo: TODOS os itens, agrupados nas 4 pastas, cada um com seletor para trocar de pasta. */
function revisaoCatalogoHTML(regs){
  const idx=regs.map((x,i)=>[x,i]);
  const blocos=CLASSES_CATALOGO.map(c=>{
    const itens=idx.filter(([x])=>classeDoRegistro(x)===c);
    if(!itens.length)return '';
    return `<div class="tag" style="margin:12px 0 4px"><b><span style="display:inline-flex;align-items:center;gap:4px;vertical-align:-3px">${ROTULO_CLASSE_ICO[c]}</span> ${ROTULO_CLASSE[c]}</b> (${itens.length})</div>`+itens.map(([x,i])=>
      `<div class="row" style="cursor:default;gap:8px;padding:6px 8px"><div class="rm" style="min-width:0"><b>${esc(x.nome)}</b>${x.preco?`<small>${brl(x.preco)}</small>`:''}</div>
      <select data-catrev="${i}" style="max-width:130px;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text)">${CLASSES_CATALOGO.map(o=>`<option value="${o}" ${o===c?'selected':''}>${esc(ROTULO_CLASSE[o].replace(/^\S+\s/,''))}</option>`).join('')}</select></div>`).join('');
  }).join('');
  return `<div class="hint" style="margin-top:10px">Confira como o app separou cada item. Se algum caiu na pasta errada, troque no seletor ao lado dele antes de confirmar.</div>${blocos}`;
}
/* Pedido da Caroline: separar Produto em 3 baldes — Revenda (vai pro cliente levar pra casa), Operação (consumido
   na prestação do serviço, ex.: tintura, cera, descolorante) e Insumo de Estrutura (limpeza/administrativo, ex.:
   papel higiênico, saco de lixo). Ela mesma confirmou 3 categorias (não 4) — "operação" e "insumo de operação"
   eram a mesma coisa na cabeça dela. Aplica em produtos já cadastrados (migração) e em toda importação nova. */
const TIPOS_SUBTIPO_PRODUTO=['Revenda','Operação','Insumo de Estrutura'];
function classificaSubtipoProduto(nome){
  const n=normHead(nome);
  if(/papel|saco de lixo|detergente|\balcool\b|desinfetante|sabonete|toalha|\bluva|mascara descart|limpeza|higien|inseticida|desodorizador|vaso sanit/.test(n))return 'Insumo de Estrutura';
  if(/pomada|shampoo|condicionador|revenda|leave-?in|finalizador|perfume|colonia/.test(n))return 'Revenda';
  return 'Operação';
}
/* Palpite de Função para a importação de Colaboradores, a partir do texto livre que o Cash Barber trouxer na
   coluna Cargo/Função (varia de barbearia pra barbearia). Cai em "Outro" quando não reconhece — nunca inventa
   Barbeiro por padrão, pra não classificar errado quem faz recepção/gestão. */
function classificaFuncaoColaborador(cargoRaw){
  const n=normHead(cargoRaw);
  if(!n)return 'Outro';
  if(/barbeir|cabeleir|hair|stylist/.test(n))return 'Barbeiro';
  if(/recep/.test(n))return 'Recepção';
  if(/gerent|gestor|admin|propriet|socio|sócio|dono/.test(n))return 'Gerente';
  return FUNCOES_COLAB.includes(cargoRaw)?cargoRaw:'Outro';
}

/* ============ assinantes: unificação + score de risco ============ */
/* Valor REAL de cada assinante (planilhas importadas). Se o mesmo nome aparece em mais de um canal, vale o do cartão Celcoin
   (a Celcoin ainda cobra o valor antigo), depois o Cash Pag, depois o manual; entre iguais, o do mesmo plano do contrato. */
const PRIO_CANAL={celcoin:0,cashpag:1,manual:2},ROTULO_CANAL={celcoin:'Cartão Celcoin (legado)',cashpag:'Cash Pag',manual:'Manual (boleto, Pix ou dinheiro)'};
function indexValoresAss(){const idx={};(S.imp.valoresAss||[]).forEach(v=>{const k=normNome(v.nome);(idx[k]=idx[k]||[]).push(v)});return idx}
function valorAssinatura(idx,nome,plano){
  const L=idx[normNome(nome)];if(!L||!L.length)return null;
  const pn=normHead(plano||''),mesmo=L.filter(v=>normHead(v.plano)===pn),base=mesmo.length?mesmo:L;
  return base.slice().sort((a,b)=>(PRIO_CANAL[a.canal]!=null?PRIO_CANAL[a.canal]:9)-(PRIO_CANAL[b.canal]!=null?PRIO_CANAL[b.canal]:9))[0];
}
function computeAssinantes(){
  const C=S.imp.clientes,K=S.imp.contratos,F=S.imp.freq,A=S.imp.agend,T=S.imp.transacoes,CD=S.imp.comandas||[];
  const VA=indexValoresAss();
  const porCpf={},porNome={};
  C.forEach(c=>{if(!c.cpfDig)return;const h=hashStr(c.cpfDig);porCpf[h]=porCpf[h]||{cliente:c};porCpf[h].cliente=c;if(c.nome)porNome[normNome(c.nome)]=h});
  K.forEach(k=>{if(!k.cpfDig)return;const h=hashStr(k.cpfDig);porCpf[h]=porCpf[h]||{};if(k.nome)porNome[normNome(k.nome)]=h});
  const naoConciliados=new Set();
  const keyDe=nome=>{const h=porNome[normNome(nome)];return h||null};
  const subs=[];
  const porChave={};
  K.forEach(k=>{
    const h=k.cpfDig?hashStr(k.cpfDig):keyDe(k.nome)||('N_'+hashStr(normNome(k.nome)));
    if(!porChave[h])porChave[h]={chave:h,nome:k.nome,cpfLast4:k.cpfDig?k.cpfDig.slice(-4):'',contratos:[],cliente:null};
    porChave[h].contratos.push(k);
    if(!porChave[h].nome)porChave[h].nome=k.nome;
  });
  C.forEach(c=>{const h=c.cpfDig?hashStr(c.cpfDig):null;if(h&&porChave[h]){porChave[h].cliente=c;if(!porChave[h].cpfLast4)porChave[h].cpfLast4=c.cpfDig.slice(-4)}});
  const hoje=todayISO();
  Object.values(porChave).forEach(P=>{
    const ativos=P.contratos.filter(k=>/ativ/i.test(k.status));
    const cancelados=P.contratos.filter(k=>/cancel/i.test(k.status));
    const contratoRef=ativos[0]||P.contratos[0];
    const per=PERIOD_MESES[normHead(contratoRef.periodicidade)]||1;
    const vaRef=valorAssinatura(VA,P.nome,contratoRef.plano); // planilha do valor real tem prioridade; o Relatório de Assinatura não traz valor
    const mensal=vaRef?vaRef.valor:(per>0?round2(contratoRef.valor/per):contratoRef.valor);
    const nomeN=normNome(P.nome);
    const freqRows=F.filter(f=>normNome(f.nome)===nomeN);
    const agendRows=A.filter(a=>normNome(a.nome)===nomeN);
    const transRows=T.filter(t=>normNome(t.nome)===nomeN);
    const comandaRows=CD.filter(c=>normNome(c.nome)===nomeN);
    const freqPorMes={};freqRows.forEach(f=>{freqPorMes[f.mesRef]=f.qtd});
    const mesesOrd=Object.keys(freqPorMes).sort();
    const mesAtual=hoje.slice(0,7);
    const freqAtual=freqPorMes[mesAtual]||0;
    const histMeses=mesesOrd.filter(m=>m<mesAtual).slice(-3);
    const mediaHist=histMeses.length?histMeses.reduce((s,m)=>s+freqPorMes[m],0)/histMeses.length:null;
    let ultimaVisita=P.cliente?P.cliente.ultimaVisita:'';
    if(!ultimaVisita&&agendRows.length){const comp=agendRows.filter(a=>/finalizad/i.test(a.status)||/chegou/i.test(a.statusCliente));const base=comp.length?comp:agendRows;ultimaVisita=base.map(a=>a.data).filter(Boolean).sort().pop()||'';}
    // Comanda fechada (mesmo com valor R$ 0,00) é evidência direta de atendimento — não vira receita, mas conta
    // como visita para frequência/risco de churn, inclusive quando é mais recente que o relatório de Agendamento.
    if(comandaRows.length){const ultimaComanda=comandaRows.map(c=>c.data).filter(Boolean).sort().pop();if(ultimaComanda&&(!ultimaVisita||ultimaComanda>ultimaVisita))ultimaVisita=ultimaComanda}
    const diasSemVisita=ultimaVisita?Math.round((new Date(hoje+'T00:00:00')-new Date(ultimaVisita+'T00:00:00'))/86400000):null;
    const last90=agendRows.filter(a=>a.data&&a.data>=iso(...(()=>{const d=new Date(hoje+'T00:00:00');d.setDate(d.getDate()-90);return [d.getFullYear(),d.getMonth()+1,d.getDate()]})()));
    const noShow=last90.filter(a=>/faltou/i.test(a.statusCliente));
    const noShowTaxa=last90.length?noShow.length/last90.length:0;
    const agendOrd=agendRows.filter(a=>a.data&&/finalizad/i.test(a.status)).sort((a,b)=>a.data.localeCompare(b.data));
    let trocouBarbeiro=false;
    if(agendOrd.length>=2){
      const ultimoProf=agendOrd[agendOrd.length-1].profissional;
      const cont={};agendOrd.slice(0,-1).forEach(a=>{if(a.profissional)cont[a.profissional]=(cont[a.profissional]||0)+1});
      const habitual=Object.entries(cont).sort((a,b)=>b[1]-a[1])[0];
      if(habitual&&ultimoProf&&habitual[0]!==ultimoProf)trocouBarbeiro=true;
    }
    const statusClienteAgend=agendRows.filter(a=>a.data).sort((a,b)=>a.data.localeCompare(b.data)).map(a=>a.statusCliente).pop()||'';
    // Cliente casado por nome (não só por CPF, que nem sempre vem preenchido) — mesma regra usada para
    // transRows/agendRows/comandaRows acima. Usado abaixo para a régua de atraso e o perfil de pontualidade.
    const clienteNome=S.clientes.find(x=>normNome(x.nome)===nomeN);
    const transAbertas=transRows.filter(t=>!/\bpag[oa]\b|aprovad|liquidad|confirmad|compensad|capturad/i.test(t.status));
    let diasAtraso=0,pagoNoCaixa='',vencimentoAberto='';
    if(transAbertas.length){
      vencimentoAberto=transAbertas.map(t=>t.vencimento).filter(Boolean).sort()[0];
      const venc=vencimentoAberto;
      // Botão "✅ Pago": paga hoje e a régua de atraso reinicia a partir do dia do pagamento, mesmo que o
      // relatório de transações importado ainda não tenha vindo atualizado com o novo vencimento.
      const jaPagoManual=clienteNome&&clienteNome.ultimoPagamento&&venc&&clienteNome.ultimoPagamento>=venc;
      // Mesma lógica, mas lida direto do caixa do dia: se o relatório de comandas já trouxe uma linha
      // "Pagamento de assinatura" desse cliente, datada em cima (ou depois) do vencimento em aberto, o
      // pagamento já aconteceu de verdade — não precisa esperar reimportar o relatório de status pra
      // saber disso, nem duplicar cobrança.
      const pagtoCaixa=comandaRows.filter(c=>classificarTipoComanda(c.tipo)==='Assinaturas (Clube)'&&c.data&&venc&&c.data>=venc).sort((a,b)=>b.data.localeCompare(a.data))[0];
      if(pagtoCaixa)pagoNoCaixa=pagtoCaixa.data;
      // O Cash Barber já bloqueia o cliente no próprio dia do vencimento, não só depois — por isso
      // "atrasado" conta a partir do dia do vencimento (venc<=hoje), com no mínimo 1 dia de atraso
      // nesse caso, pra não ficar com score zerado justo no dia em que ele já está bloqueado.
      if(venc&&venc<=hoje&&!jaPagoManual&&!pagtoCaixa)diasAtraso=Math.max(1,Math.round((new Date(hoje+'T00:00:00')-new Date(venc+'T00:00:00'))/86400000));
    }
    // Forma de pagamento provável: olha a comanda de assinatura mais recente desse cliente com o sinal
    // "Pagamento externo" preenchido. true=fora do cartão nativo (Pix/boleto/manual/CelCash), false=cartão
    // recorrente nativo do Cash Barber. Sem essa comanda no histórico, fica null (não sabe — oferece as opções).
    const comandasAssinaturaComSinal=comandaRows.filter(c=>classificarTipoComanda(c.tipo)==='Assinaturas (Clube)'&&c.pagExterno!=null).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    // O relatório de Transações (Celcoin) já traz a operadora de cada cobrança (Cel Cash = cartão,
    // Boleto/Pix = manual) — é um sinal mais direto que o das comandas, então tem prioridade quando
    // disponível. Cel Cash ainda é cartão (é o cartão cadastrado como backup dentro do Celcoin), só não
    // é o cartão nativo do Cash Barber — pra régua, as duas situações usam a mesma mensagem de cartão.
    // Forma de pagamento, em ordem: (1) planilha de valores (Cash Pag e Cartão Celcoin = cartão recorrente; Manual = boleto/Pix/dinheiro);
    // (2) cobrança em boleto/Pix na Celcoin; (3) comanda de assinatura. "cel_cash" NÃO indica cartão (34 de 37 desses atrasados são manuais).
    const formaPlanilha=vaRef?(vaRef.canal==='manual'?'externo':'cartao'):null;
    const transManual=transRows.filter(t=>/manual|boleto|pix/i.test(t.canal||'')&&!/cel[ _-]?cash/i.test(t.canal||'')).sort((a,b)=>(b.vencimento||'').localeCompare(a.vencimento||''))[0];
    const formaProvavel=formaPlanilha||(transManual?'externo':(comandasAssinaturaComSinal.length?(comandasAssinaturaComSinal[0].pagExterno?'externo':'cartao'):null));
    const sVisita=diasSemVisita==null?0:clamp(diasSemVisita/60,0,1);
    const sFreq=mediaHist===null?0:(mediaHist>0?clamp(1-(freqAtual/mediaHist),0,1):0);
    // Estar vencido já é sinal relevante por si só (o Cash Barber bloqueia o cliente nesse dia) — não
    // deixa o score quase zerado só porque é o primeiro dia; a partir daí sim escala com os dias.
    const atrasadoStatus=!!(clienteNome&&clienteNome.statusAssinatura==='Atrasada');
    const sPag=diasAtraso>0?Math.max(0.35,clamp(diasAtraso/15,0,1)):(atrasadoStatus?0.35:0); // atrasado só no Cash Barber (sem data) também pesa
    const sNoShow=clamp(noShowTaxa/0.5,0,1);
    const sTroca=trocouBarbeiro?1:0;
    const sInativo=/cancelado_whatsapp/i.test(statusClienteAgend)?1:0;
    // Sinal direto do relatório de status de assinaturas (Em dia/pastdue/not_authorized), quando importado —
    // complementa o atraso calculado pelas transações, que pode não estar disponível ou atualizado.
    const statusPagamentoRel=contratoRef.statusPagamento||'';
    const sPagRel=(statusPagamentoRel==='Atrasado'&&!pagoNoCaixa)?1:0;
    const score=Math.round(sVisita*25+sFreq*20+sPag*25+sNoShow*15+sTroca*10+sInativo*5+sPagRel*8);
    const motivos=[];
    if(sVisita>0.4)motivos.push(`${diasSemVisita} dias sem visitar`);
    if(sFreq>0.4)motivos.push('queda de frequência');
    if(diasAtraso>0)motivos.push(diasAtraso<=1?'pagamento em aberto — vence hoje':`pagamento em aberto há ${diasAtraso}d`);
    else if(atrasadoStatus)motivos.push('atrasado no Cash Barber (sem data de vencimento)');
    if(sNoShow>0.4)motivos.push('faltas recentes');
    if(sTroca)motivos.push('trocou de barbeiro');
    if(sInativo)motivos.push('cancelou o último agendamento pelo WhatsApp');
    if(statusPagamentoRel==='Atrasado')motivos.push('relatório de assinaturas mostra pagamento atrasado');
    // Perfil de pontualidade histórico (informativo, não pontua no score — evita pesar duas vezes o mesmo risco de
    // atraso já capturado acima) — ajuda a decidir a abordagem certa na régua de retenção.
    {const perfil=perfilPagamentoCliente(clienteNome);if(perfil&&perfil.tendencia==='Atrasa com frequência'&&perfil.total>=3)motivos.push(`histórico: atrasa com frequência (${perfil.nAtrasado}/${perfil.total} pagamentos)`);}
    const ultimoBarbeiro=agendOrd.length?agendOrd[agendOrd.length-1].profissional:'';
    // Próximo agendamento já marcado (data futura, sem cancelamento) — mesmo em risco, se já tem
    // horário marcado isso muda a leitura da situação.
    const futuros=agendRows.filter(a=>a.data&&a.data>hoje&&!/cancel/i.test(a.status)).sort((a,b)=>a.data.localeCompare(b.data));
    const proximoAgendamento=futuros.length?futuros[0].data:null;
    const proximoBarbeiro=futuros.length?futuros[0].profissional:'';
    subs.push({
      chave:P.chave,nome:P.nome,cpfLast4:P.cpfLast4,telefone:P.cliente?P.cliente.telefone:'',
      plano:contratoRef.plano,valorMensal:mensal,valorFonte:vaRef?'planilha':'contrato',canalPag:vaRef?vaRef.canal:'',periodicidade:contratoRef.periodicidade,
      status:ativos.length?((clienteNome&&clienteNome.canceladoEm)?'Cancelado':'Ativo'):(cancelados.length?'Cancelado':(contratoRef.status||'—')), // canceladoEm = você marcou no app (o relatório ainda pode estar defasado)
      statusCliente:clienteNome?(clienteNome.statusAssinatura||''):'',statusPagRel:statusPagamentoRel,inicioPlanilha:vaRef?(vaRef.inicio||''):'',
      dataInicio:contratoRef.dataInicio,ultimaVisita,diasSemVisita,freqAtual,mediaHist,
      ultimoBarbeiro,totalVisitas:new Set([...agendOrd.map(a=>a.data),...comandaRows.map(c=>c.data)].filter(Boolean)).size,proximoAgendamento,proximoBarbeiro,diasAtraso,pagoNoCaixa,vencimentoAberto,formaProvavel,
      tipoCliente:'Assinante',
      score,motivos,risco:score>=60?'alto':score>=30?'medio':'baixo'
    });
  });
  // "Lead de assinatura" e "Anônimo Turista" são nomes genéricos que o próprio sistema usa quando não
  // identifica a pessoa — não são clientes de verdade, então ficam de fora de tudo (nem fila, nem registro).
  // Qualquer outro nome de pessoa real sem assinatura formal ENTRA na fila — é pra lembrar de estimular
  // ela a marcar serviço, mesmo não sendo assinante.
  const ehNomeGenerico=nome=>/^lead\b.*assinatura|^assinatura\b.*lead|^an[oô]nimo\b.*turista|^turista\b.*an[oô]nimo/i.test(normHead(nome));
  const todosNomes=[...F,...A,...T,...CD];
  const nomesConhecidos=new Set(Object.values(porChave).map(p=>normNome(p.nome)));
  const nomesAvulsos=new Set();
  todosNomes.forEach(r=>{if(r.nome&&!ehNomeGenerico(r.nome)&&!nomesConhecidos.has(normNome(r.nome)))nomesAvulsos.add(normNome(r.nome))});
  nomesAvulsos.forEach(nomeN=>{
    const nomeOriginal=(todosNomes.find(r=>normNome(r.nome)===nomeN)||{}).nome||nomeN;
    naoConciliados.add(nomeOriginal);
    const agendRows=A.filter(a=>normNome(a.nome)===nomeN);
    const comandaRows=CD.filter(c=>normNome(c.nome)===nomeN);
    const agendOrd=agendRows.filter(a=>a.data&&/finalizad/i.test(a.status)).sort((a,b)=>a.data.localeCompare(b.data));
    const totalVisitas=agendOrd.length||comandaRows.length;
    let ultimaVisita='';
    {const comp=agendRows.filter(a=>/finalizad/i.test(a.status)||/chegou/i.test(a.statusCliente));const base=comp.length?comp:agendRows;ultimaVisita=base.map(a=>a.data).filter(Boolean).sort().pop()||'';}
    if(comandaRows.length){const uc=comandaRows.map(c=>c.data).filter(Boolean).sort().pop();if(uc&&(!ultimaVisita||uc>ultimaVisita))ultimaVisita=uc}
    const diasSemVisita=ultimaVisita?Math.round((new Date(hoje+'T00:00:00')-new Date(ultimaVisita+'T00:00:00'))/86400000):null;
    const freqRows=F.filter(f=>normNome(f.nome)===nomeN);
    const mesesFreq={};freqRows.forEach(f=>{mesesFreq[f.mesRef]=(mesesFreq[f.mesRef]||0)+(f.qtd||1)});
    const mesAtualR=hoje.slice(0,7);
    const freqAtual=mesesFreq[mesAtualR]||0;
    const histMeses=Object.keys(mesesFreq).filter(mr=>mr<mesAtualR);
    const mediaHist=histMeses.length?histMeses.reduce((s,mr)=>s+mesesFreq[mr],0)/histMeses.length:null;
    const last90=agendRows.filter(a=>a.data&&a.data>=iso(...(()=>{const d=new Date(hoje+'T00:00:00');d.setDate(d.getDate()-90);return [d.getFullYear(),d.getMonth()+1,d.getDate()]})()));
    const noShow=last90.filter(a=>/faltou/i.test(a.statusCliente));
    const noShowTaxa=last90.length?noShow.length/last90.length:0;
    const ultimoBarbeiro=agendOrd.length?agendOrd[agendOrd.length-1].profissional:'';
    const futuros=agendRows.filter(a=>a.data&&a.data>hoje&&!/cancel/i.test(a.status)).sort((a,b)=>a.data.localeCompare(b.data));
    const proximoAgendamento=futuros.length?futuros[0].data:null;
    const proximoBarbeiro=futuros.length?futuros[0].profissional:'';
    let trocouBarbeiro=false;
    if(agendOrd.length>=2){
      const ultimoProf=agendOrd[agendOrd.length-1].profissional;
      const cont={};agendOrd.slice(0,-1).forEach(a=>{if(a.profissional)cont[a.profissional]=(cont[a.profissional]||0)+1});
      const habitual=Object.entries(cont).sort((a,b)=>b[1]-a[1])[0];
      if(habitual&&ultimoProf&&habitual[0]!==ultimoProf)trocouBarbeiro=true;
    }
    const sVisita=diasSemVisita==null?0:clamp(diasSemVisita/60,0,1);
    const sFreq=mediaHist===null?0:(mediaHist>0?clamp(1-(freqAtual/mediaHist),0,1):0);
    const sNoShow=clamp(noShowTaxa/0.5,0,1);
    const sTroca=trocouBarbeiro?1:0;
    const score=Math.round(sVisita*30+sFreq*30+sNoShow*25+sTroca*15);
    const motivos=[];
    if(sVisita>0.4)motivos.push(`${diasSemVisita} dias sem visitar`);
    if(sFreq>0.4)motivos.push('queda de frequência');
    if(sNoShow>0.4)motivos.push('faltas recentes');
    if(sTroca)motivos.push('trocou de barbeiro');
    if(!diasSemVisita&&totalVisitas<=1)motivos.push('ainda não marcou retorno');
    subs.push({
      chave:'AV_'+hashStr(nomeN),nome:nomeOriginal,cpfLast4:'',telefone:'',
      plano:'',valorMensal:0,periodicidade:'',
      status:'Ativo',tipoCliente:'Sem assinatura',
      dataInicio:'',ultimaVisita,diasSemVisita,freqAtual,mediaHist,
      ultimoBarbeiro,totalVisitas,proximoAgendamento,proximoBarbeiro,
      score,motivos,risco:score>=60?'alto':score>=30?'medio':'baixo'
    });
  });
  return {subs,naoConciliados:[...naoConciliados]};
}
/* Contratos de um assinante pelo nome — usado pra editar o valor. Prioriza os contratos com status
   "ativo" (é o que aparece como valor mensal na tela); se nenhum estiver marcado ativo, edita todos
   os que casam pelo nome, pra nunca deixar o pedido "sem efeito" por acaso de rotulagem do relatório. */
function contratosDoAssinante(nome){
  const nomeN=normNome(nome);
  const todos=S.imp.contratos.filter(k=>normNome(k.nome)===nomeN);
  const ativos=todos.filter(k=>/ativ/i.test(k.status));
  return ativos.length?ativos:todos;
}
function abrirEditarValorAssinante(nome){
  const ks=contratosDoAssinante(nome);
  const atual=ks.length?ks[0].valor:0;
  openModal(`<h2>Valor do plano</h2><div class="sub">${esc(nome)}</div>
  ${F('Novo valor mensal (R$)',`<input id="f_valorassinante" inputmode="decimal" data-money value="${moneyMask(atual)}">`)}
  <div class="hint">Atualiza o contrato ativo dessa pessoa. Se ela tiver mais de um plano/contrato ativo, todos recebem o mesmo valor novo.</div>
  <div class="err" id="f_err"></div>
  <div class="acts"><button class="btn ok" data-act="salvarvalorassinante" data-nome="${esc(nome)}">Salvar</button><button class="btn warn" data-act="fechar">Cancelar</button></div>`);
}
function salvarValorAssinante(nome){
  const novo=parseMoney(val('f_valorassinante'));
  if(!(novo>=0))return setErr('Informe um valor válido.');
  snap();
  const ks=contratosDoAssinante(nome);
  ks.forEach(k=>k.valor=round2(novo));
  save();closeModal();render();
  toast(`Valor atualizado${ks.length>1?` (${ks.length} contratos)`:''}`);
}
/* Tela de reajuste em massa: lista todo assinante ativo com checkbox, filtro rápido por plano, e aplica um
   valor fixo novo OU um aumento/redução percentual sobre o valor atual de cada um selecionado. */
function vReajusteValores(){
  const {subs}=computeAssinantes();
  const ativos=subs.filter(s=>s.status==='Ativo').sort((a,b)=>(a.plano||'').localeCompare(b.plano||'')||a.nome.localeCompare(b.nome));
  const planosUnicos=[...new Set(ativos.map(s=>s.plano).filter(Boolean))].sort();
  const sel=REAJUSTE_SEL||new Set();
  return `<h2>Reajustar valores em massa</h2><div class="sub">${ativos.length} assinante(s) ativo(s)</div>
  <div class="two">
    <select id="f_reaj_plano" data-act="reajfiltroplano"><option value="">Filtrar por plano (todos)</option>${planosUnicos.map(p=>`<option value="${esc(p)}" ${REAJUSTE_FILTRO_PLANO===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <button type="button" class="btn sm sec" data-act="reajmarcartodos">${sel.size? 'Desmarcar todos':'Marcar todos (filtrados)'}</button>
  </div>
  <div class="tag" style="margin:8px 0">${sel.size} selecionado(s)</div>
  <div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:6px;margin-bottom:10px">
  ${ativos.filter(s=>!REAJUSTE_FILTRO_PLANO||s.plano===REAJUSTE_FILTRO_PLANO).map(s=>`<label class="chk" style="display:flex;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)">
    <input type="checkbox" data-act="reajtoggle" data-nome="${esc(s.nome)}" ${sel.has(s.nome)?'checked':''}>
    <span style="flex:1"><b>${esc(s.nome)}</b><br><small class="tag">${esc(s.plano||'—')} · ${brl(s.valorMensal)}/mês</small></span>
  </label>`).join('')||'<div class="tag" style="padding:8px">Nenhum assinante com esse filtro.</div>'}
  </div>
  <div class="two">
    <select id="f_reaj_modo">
      <option value="fixo" ${REAJUSTE_MODO==='percentual'?'':'selected'}>Definir valor fixo</option>
      <option value="percentual" ${REAJUSTE_MODO==='percentual'?'selected':''}>Aumentar/reduzir por %</option>
      <option value="tabela" ${REAJUSTE_MODO==='tabela'?'selected':''}>Levar ao preço da tabela do plano</option>
    </select>
    ${REAJUSTE_MODO==='tabela'?'<div class="hint">Cada um vai para o preço sugerido do próprio plano (aba Planos).</div>':REAJUSTE_MODO==='percentual'
      ?F('Percentual (ex.: 10 para +10%, -5 para -5%)',`<input id="f_reaj_valor" inputmode="decimal" placeholder="10">`)
      :F('Novo valor fixo (R$)',`<input id="f_reaj_valor" inputmode="decimal" data-money placeholder="0,00">`)}
  </div>
  <div class="err" id="f_err"></div>
  <div class="acts"><button class="btn ok" data-act="aplicarreajuste" ${sel.size?'':'disabled'}>Aplicar a ${sel.size} assinante(s)</button><button class="btn warn" data-act="fechar">Fechar</button></div>`;
}
let REAJUSTE_SEL=null,REAJUSTE_FILTRO_PLANO='',REAJUSTE_MODO='fixo';
function abrirReajusteValores(){
  REAJUSTE_SEL=new Set();REAJUSTE_FILTRO_PLANO='';REAJUSTE_MODO='fixo';
  openModal(vReajusteValores());
}
function reRenderReajuste(){const sheet=document.querySelector('.sheet');if(sheet)sheet.innerHTML=vReajusteValores()}
function aplicarReajusteValores(){
  const modo=val('f_reaj_modo')||'fixo';
  const vtxt=val('f_reaj_valor');
  const vnum=modo==='tabela'?0:modo==='percentual'?Number(String(vtxt).replace(',','.')):parseMoney(vtxt);
  if(vnum==null||isNaN(vnum))return setErr('Informe um valor.');
  if(!REAJUSTE_SEL||!REAJUSTE_SEL.size)return setErr('Selecione ao menos um assinante.');
  snap();
  let qtdContratos=0;
  REAJUSTE_SEL.forEach(nome=>{
    const ks=contratosDoAssinante(nome);
    ks.forEach(k=>{
      if(modo==='tabela'){const pl=planoPorNomeAss(k.plano);if(!(pl&&Number(pl.precoSugerido)>0))return;k.valor=round2(Number(pl.precoSugerido));qtdContratos++;return}
      k.valor=modo==='percentual'?round2(k.valor*(1+vnum/100)):round2(vnum);
      qtdContratos++;
    });
  });
  save();closeModal();render();
  toast(`${REAJUSTE_SEL.size} assinante(s) atualizados (${qtdContratos} contrato(s))`);
}
function kpisAssinantes(subs){
  // Leads recorrentes (sem assinatura formal, valorMensal sempre 0) não entram nos números financeiros —
  // senão diluiriam o ticket médio e o MRR com gente que nunca pagou mensalidade nenhuma.
  const ativos=subs.filter(s=>s.status==='Ativo'&&s.tipoCliente!=='Sem assinatura'),cancelados=subs.filter(s=>s.status==='Cancelado'&&s.tipoCliente!=='Sem assinatura');
  const mrr=round2(sum(ativos.map(s=>({valor:s.valorMensal}))));
  const ticket=ativos.length?round2(mrr/ativos.length):0;
  const denom=ativos.length+cancelados.length;
  const cancelAcum=denom?cancelados.length/denom:0;
  const ltv=cancelAcum>0?round2(ticket/cancelAcum):null;
  const {y,m}=(()=>({y:V.year,m:V.month==='all'?null:V.month}))();
  const novos=ativos.filter(s=>{if(!s.dataInicio)return false;return inP(s.dataInicio.slice(0,7))});
  const gastoMkt=sum(desP().filter(d=>d.categoria==='Marketing'));
  const cac=novos.length?round2(gastoMkt/novos.length):null;
  const payback=cac&&ticket>0?round2(cac/ticket):null;
  return {mrr,ticket,ativos:ativos.length,cancelados:cancelados.length,cancelAcum,ltv,cac,payback,novos:novos.length,gastoMkt};
}
function conciliacaoCartao(){
  const CB=S.imp.cartaoCB;
  if(!CB.length)return null;
  const ativos=CB.filter(c=>c.bucket!=='Cancelada');
  const cashpag=ativos.filter(c=>c.canal==='CashPag');
  const legado=CB.filter(c=>c.canal==='Legado Celcoin');
  const manual=ativos.filter(c=>c.canal==='Manual');
  const nomesCelcoinAtivos=new Set(S.imp.contratos.filter(k=>/ativ/i.test(k.status)).map(k=>normNome(k.nome)));
  const nomesCartaoAtivos=new Set(ativos.map(c=>normNome(c.nome)));
  const cashpagTambemCelcoin=cashpag.filter(c=>nomesCelcoinAtivos.has(normNome(c.nome)));
  const manualSemCelcoin=manual.filter(c=>!nomesCelcoinAtivos.has(normNome(c.nome)));
  const soCelcoin=S.imp.contratos.filter(k=>/ativ/i.test(k.status)&&!nomesCartaoAtivos.has(normNome(k.nome)));
  const porBucket={'Em dia':[],'Atrasada':[],'Pendente':[],'Cancelada':[],'Outro':[]};
  CB.forEach(c=>porBucket[c.bucket].push(c));
  return {porBucket,cashpag,legado,manual,cashpagTambemCelcoin,manualSemCelcoin,soCelcoin,
    valorCashPag:round2(sum(cashpag)),valorManualSemCelcoin:round2(sum(manualSemCelcoin)),
    valorCartaoEmDia:round2(sum(porBucket['Em dia'])),valorCartaoAtrasado:round2(sum(porBucket['Atrasada']))};
}
/* Relatório de Transações (Celcoin): cel_cash (cartão) + boleto/Pix (manual) são dois módulos do MESMO processador,
   por isso somados como um total único de em-dia/atrasado — nunca separados por canal na tela (pedido explícito da
   Caroline). O "canal" de cada linha só existe para diagnóstico interno (ex.: no card de detalhe de cada atrasado). */
function conciliacaoTransacoes(){
  const T=S.imp.transacoes;
  if(!T.length)return null;
  const hoje=todayISO();
  const rows=T.map(t=>Object.assign({},t,{bucket:bucketTransacao(t,hoje)}));
  const atrasadas=rows.filter(t=>t.bucket==='Atrasada').sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||''));
  const pendentes=rows.filter(t=>t.bucket==='Pendente');
  const pagas=rows.filter(t=>t.bucket==='Paga');
  const canceladas=rows.filter(t=>t.bucket==='Cancelada');
  const diasAtraso=t=>t.vencimento&&t.vencimento<hoje?Math.round((new Date(hoje+'T00:00:00')-new Date(t.vencimento+'T00:00:00'))/86400000):0;
  return {rows,atrasadas,pendentes,pagas,canceladas,
    valorAtrasado:round2(sum(atrasadas)),valorPendente:round2(sum(pendentes)),valorPago:round2(sum(pagas)),
    diasAtraso};
}
/* Conciliação combinada — Cash Barber (cartão CashPag/Manual) + Celcoin (Transações: cel_cash/Boleto-Pix).
   Confirmado pela Caroline: é a MESMA base de clientes nos dois sistemas (cada assinatura é cobrada por um dos
   dois), por isso os totais de "em dia" e "atrasado" agora são UM total único, sem separar por canal/fonte.
   Proteção contra duplicidade: um cliente que aparece em mais de uma fonte conta só UMA vez (por nome); quando
   os valores das fontes não batem, fica o maior (mais conservador para não subestimar o risco), nunca a soma —
   somar arriscaria contar a mesma cobrança duas vezes. */
function conciliacaoCombinada(){
  const CB=conciliacaoCartao(),T=conciliacaoTransacoes();
  if(!CB&&!T)return null;
  const atrasadosPorNome={};
  if(CB)CB.porBucket['Atrasada'].forEach(c=>{const k=normNome(c.nome);atrasadosPorNome[k]={nome:c.nome,valor:c.valor,telefone:c.telefone||''}});
  if(T)T.atrasadas.forEach(t=>{const k=normNome(t.nome);if(!atrasadosPorNome[k])atrasadosPorNome[k]={nome:t.nome,valor:0,telefone:''};atrasadosPorNome[k].valor=Math.max(atrasadosPorNome[k].valor,t.valor)});
  const atrasados=Object.values(atrasadosPorNome).sort((a,b)=>b.valor-a.valor);
  const emDiaPorNome={};
  if(CB)CB.porBucket['Em dia'].forEach(c=>{const k=normNome(c.nome);if(!atrasadosPorNome[k])emDiaPorNome[k]={nome:c.nome,valor:c.valor}});
  if(T)T.pagas.forEach(t=>{const k=normNome(t.nome);if(!atrasadosPorNome[k]&&!emDiaPorNome[k])emDiaPorNome[k]={nome:t.nome,valor:t.valor}});
  const emDia=Object.values(emDiaPorNome);
  const pendentesPorNome={};
  if(CB)CB.porBucket['Pendente'].forEach(c=>{const k=normNome(c.nome);if(!atrasadosPorNome[k])pendentesPorNome[k]={nome:c.nome,valor:c.valor}});
  if(T)T.pendentes.forEach(t=>{const k=normNome(t.nome);if(!atrasadosPorNome[k]&&!pendentesPorNome[k])pendentesPorNome[k]={nome:t.nome,valor:t.valor}});
  const pendentes=Object.values(pendentesPorNome);
  return {atrasados,emDia,pendentes,
    valorAtrasado:round2(sum(atrasados)),valorEmDia:round2(sum(emDia)),valorPendente:round2(sum(pendentes))};
}

/* ---------- faixa de data fixa: fica visível enquanto se rola a página ---------- */
const TABS_COM_PERIODO=new Set(['painel','entradas','despesas','cartoes','dre','indicadores','saude','colaboradores','servicobase','servicosextras','produtos','barcozinha']);
function mesCurto(r){const {y,m}=ym(r);return `${MESES[m-1]}/${y}`}
function rotuloPeriodoCurto(){
  if(V.range){
    const {de,ate}=V.range,a=ym(de),b=ym(ate);
    if(de===ate)return mesCurto(de);
    if(a.y===b.y&&a.m===1&&b.m===12)return `Ano ${a.y}`;
    if(a.y===b.y&&a.m===1&&b.m===6)return `1º sem ${a.y}`;
    if(a.y===b.y&&a.m===7&&b.m===12)return `2º sem ${a.y}`;
    if(a.y===b.y&&a.m%3===1&&b.m===a.m+2)return `${(a.m-1)/3+1}º tri ${a.y}`;
    return `${mesCurto(de)} → ${mesCurto(ate)}`;
  }
  return V.month==='all'?`Ano ${V.year}`:mesCurto(`${V.year}-${pad(V.month)}`);
}
function atualizarFaixaData(){
  const el=document.getElementById('datebar');if(!el)return;
  const h=todayISO().split('-'),hoje=`${h[2]}/${h[1]}/${h[0]}`;
  let per='';

  else if(TABS_COM_PERIODO.has(V.tab))per=rotuloPeriodoCurto();
  const setas=(per&&(V.tab==='fluxocaixa'||TABS_COM_PERIODO.has(V.tab)));
  const ac=V.tab==='fluxocaixa'?'dbano':'pstep';
  el.innerHTML=(per?(setas?`<button class="dbn" data-act="${ac}" data-v="-1" aria-label="Período anterior">‹</button>`:'')+`<span class="dbp">${esc(per)}</span>`+(setas?`<button class="dbn" data-act="${ac}" data-v="1" aria-label="Próximo período">›</button>`:'')+`<span class="dbs">·</span>`:'')+`<span class="dbh">hoje ${hoje}</span>`;

}

function metaHTML(m){
  const tipo=m.tipo||'economia';
  let atual=m.atual,alvoLabel='Alvo',atualLabel='Atual',invertido=false;
  if(tipo==='faturamento'){atual=sum(entP())}

  const p=m.alvo>0?clamp(atual/m.alvo*100,0,100):0;
  const estourou=invertido&&atual>m.alvo;
  const corBarra=invertido?(estourou?'var(--red)':'var(--green)'):'var(--pri)';
  let extra='';
  if(tipo==='economia'&&m.prazo){const hoje=new Date(),pz=new Date(m.prazo+'T00:00:00');const meses=Math.max(1,(pz.getFullYear()-hoje.getFullYear())*12+pz.getMonth()-hoje.getMonth());const falta=Math.max(0,m.alvo-atual);extra=`<div class="tag">Faltam ${brl(falta)} · ≈ ${brl(falta/meses)}/mês até ${fmtDate(m.prazo)}</div>`}
  else if(tipo==='faturamento')extra=`<div class="tag">${atual>=m.alvo?'Meta batida neste período':'Faltam '+brl(m.alvo-atual)+' para bater a meta do período.'}</div>`;
  else if(tipo==='reducao')extra=`<div class="tag ${estourou?'neg':'pos'}">${estourou?'Passou do teto em '+brl(atual-m.alvo):'Dentro do teto — sobra '+brl(m.alvo-atual)} no período.</div>`;

function faturaCartao(c,y,m){return S.despesas.filter(r=>r.ativo&&r.forma==='Crédito'&&r.cartao===c.apelido&&r.mesRef===`${y}-${pad(m)}`)}
function mediaDespesasUltimosMeses(n){
  const hoje=new Date();let total=0,meses=0;
  for(let i=1;i<=n;i++){
    const d=new Date(hoje);d.setMonth(d.getMonth()-i);
    const ref=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const v=sum(S.despesas.filter(r=>r.ativo&&r.status==='Pago'&&r.mesRef===ref));
    if(v>0){total+=v;meses++}
  }
  return meses?total/meses:0;
}
function compararMeses(){
  const hoje=new Date(),refAtual=`${hoje.getFullYear()}-${pad(hoje.getMonth()+1)}`;
  const dAnt=new Date(hoje);dAnt.setMonth(dAnt.getMonth()-1);
  const refAnt=`${dAnt.getFullYear()}-${pad(dAnt.getMonth()+1)}`;
  const recAtual=sum(S.entradas.filter(r=>r.ativo&&r.mesRef===refAtual)),recAnt=sum(S.entradas.filter(r=>r.ativo&&r.mesRef===refAnt));
  const despAtual=sum(S.despesas.filter(r=>r.ativo&&r.status==='Pago'&&r.mesRef===refAtual)),despAnt=sum(S.despesas.filter(r=>r.ativo&&r.status==='Pago'&&r.mesRef===refAnt));
  return {refAtual,refAnt,recAtual,recAnt,despAtual,despAnt,lucroAtual:round2(recAtual-despAtual),lucroAnt:round2(recAnt-despAnt)};
}
function custosPorCategoriaComparados(){
  const {refAtual,refAnt}=compararMeses();
  const porCat=ref=>{const m={};S.despesas.forEach(r=>{if(r.ativo&&r.status==='Pago'&&r.mesRef===ref)m[r.categoria]=(m[r.categoria]||0)+r.valor});return m};
  const atualMap=porCat(refAtual),antMap=porCat(refAnt);
  const nomes=new Set([...Object.keys(atualMap),...Object.keys(antMap)]);
  return [...nomes].map(nome=>{const atual=atualMap[nome]||0,ant=antMap[nome]||0,delta=round2(atual-ant);return {nome,atual,ant,delta,pct:ant>0?round2(delta/ant*100):(atual>0?100:0)}}).sort((a,b)=>b.delta-a.delta);
}

  ${melhorouHTML}

function vColaboradores(){
  const D=desP();
  const CM=calcComissoes();
  return `<div class="bar-actions"><button class="btn" data-act="new" data-v="colaborador">+ Novo colaborador</button>${botoesExport('comissoes')}</div>
  ${cbCardHTML()}
  ${vVinculoProfissionais()}
  ${S.colaboradores.length?S.colaboradores.map(c=>{
    const doColab=D.filter(r=>r.colaborador===c.nome);
    const comissoes=sum(doColab.filter(r=>r.categoria==='Pessoal'&&r.subcategoria==='Comissões'));
    const vales=sum(doColab.filter(r=>r.categoria==='Pessoal'&&r.subcategoria==='Vale/Adiantamento'));

function itemMesAtualEAnterior(nome){
  if(V.range&&V.range.de!==V.range.ate){
    const refs=refsDoPeriodo(),n=refs.length,[y0,m0]=[ym(refs[0]).y,ym(refs[0]).m];
    const ant=new Set();for(let k=1;k<=n;k++){const [yy,mm]=addMonths(y0,m0,-k);ant.add(`${yy}-${pad(mm)}`)}
    const atual=sum(S.entradas.filter(r=>r.ativo&&r.item===nome&&refs.includes(r.mesRef)));
    const anterior=sum(S.entradas.filter(r=>r.ativo&&r.item===nome&&ant.has(r.mesRef)));
    return {atual,anterior};
  }
  if(V.range){const {y,m}=ym(V.range.de);const [yp,mp]=addMonths(y,m,-1);
    const atual=sum(S.entradas.filter(r=>r.ativo&&r.item===nome&&r.mesRef===V.range.de));
    const anterior=sum(S.entradas.filter(r=>r.ativo&&r.item===nome&&r.mesRef===`${yp}-${pad(mp)}`));
    return {atual,anterior};
  }
  if(V.month==='all')return null;
  const mesAtualRef=`${V.year}-${pad(V.month)}`;
  const [yPrev,mPrev]=addMonths(V.year,V.month,-1);
  const mesAntRef=`${yPrev}-${pad(mPrev)}`;
  const atual=sum(S.entradas.filter(r=>r.ativo&&r.item===nome&&r.mesRef===mesAtualRef));
  const anterior=sum(S.entradas.filter(r=>r.ativo&&r.item===nome&&r.mesRef===mesAntRef));
  return {atual,anterior};
}

function singleLineChart(valores,cor){
  const W=360,H=170,L=42,B=20,T=8,R=8;
  const mn=Math.min(0,...valores),mx=Math.max(...valores,1),range=(mx-mn)||1;
  const x=i=>L+i*(W-L-R)/11,y=v=>T+(H-T-B)*(1-(v-mn)/range);
  let g='';for(let i=0;i<=3;i++){const v=mn+range*i/3,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-width="1"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${brlC(v)}</text>`}
  const zeroY=y(0),path=valores.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=path+` L${x(11)} ${zeroY} L${x(0)} ${zeroY} Z`;
  let xl='';MESES.forEach((m,i)=>{xl+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${m.toLowerCase()}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${xl}<path d="${area}" fill="${cor}" opacity=".12"/><path d="${path}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}

function salvarContasEmMassa(){
  const texto=val('f_contasmassa'),dataRef=val('f_datacontasmassa')||todayISO();
  if(!texto.trim())return setErr('Cole ao menos uma linha.');
  const linhas=texto.split('\n').map(l=>l.trim()).filter(Boolean);
  const criadas=[],puladas=[],semValor=[];
  linhas.forEach(l=>{
    const partes=l.split(/;|\t/);
    let nome,valorTxt;
    if(partes.length>=2){nome=partes[0].trim();valorTxt=partes[partes.length-1].trim()}
    else{const m=l.match(/^(.*?)([\-−]?\s*[\d.,]+)\s*$/);if(!m){semValor.push(l);return}nome=m[1].trim();valorTxt=m[2].trim()}
    const valor=parseMoney(valorTxt);
    if(!nome||isNaN(valor)){semValor.push(l);return}
    if(S.contas.some(c=>c.nome.toLowerCase()===nome.toLowerCase())){puladas.push(nome);return}
    const tipo=classificarTipoConta(nome);
    S.contas.push({id:nextId('CTA'),nome,tipo,icone:'',saldoInicial:round2(valor),dataSaldoInicial:dataRef});
    criadas.push(nome);
  });
  if(!criadas.length&&!puladas.length){setErr('Não consegui entender nenhuma linha. Use o formato Nome; Saldo.');return}
  save();
  const box=document.getElementById('contasmassa_resultado');
  if(box)box.innerHTML=`<div class="card" style="margin-top:10px">${criadas.length?`<b>Adicionadas (${criadas.length}):</b> ${criadas.map(esc).join(', ')}`:''}${puladas.length?`<div class="tag" style="margin-top:6px">Já existiam, não dupliquei: ${puladas.map(esc).join(', ')}</div>`:''}${semValor.length?`<div class="tag" style="margin-top:6px">Não entendi (confira o formato): ${semValor.map(esc).join('; ')}</div>`:''}</div>`;
  toast(criadas.length?`${criadas.length} conta(s) adicionada(s)`:'Nenhuma conta nova');
  render();
}

/* Quanto o sistema CALCULA que uma conta tem, somando toda entrada ativa e toda despesa paga lançada
   com essa conta até uma data — não é o saldo real do banco, é só o que os lançamentos dizem. */
function saldoCalculadoConta(nomeConta,ateData){
  const c=S.contas.find(x=>x.nome===nomeConta);
  if(c&&contaTemExtrato(nomeConta))return saldoDoExtrato(c,ateData);
  const desde=c?(c.dataSaldoInicial||'0000-01-01'):'0000-01-01';
  const inicial=c?(c.saldoInicial||0):0;
  const e=sum(S.entradas.filter(r=>r.ativo&&r.conta===nomeConta&&r.data>=desde&&r.data<=ateData));
  const d=sum(S.despesas.filter(r=>r.ativo&&r.status==='Pago'&&r.conta===nomeConta&&r.data>=desde&&r.data<=ateData));
  const tIn=sum(S.transferencias.filter(t=>t.ativo&&t.contaDestino===nomeConta&&t.data>=desde&&t.data<=ateData));
  const tOut=sum(S.transferencias.filter(t=>t.ativo&&t.contaOrigem===nomeConta&&t.data>=desde&&t.data<=ateData));
  return round2(inicial+e-d+tIn-tOut);
}
/* Extrato da própria conta: todo lançamento (entrada ou despesa paga) que já foi vinculado a ela, com um

/* Extrato da conta quando ela é alimentada por extrato importado: mostra o que o banco/maquininha mostrou,

   receita/despesa na conferência mês a mês). × tira a linha do livro-caixa. */
function abrirExtratoContaLivro(nomeConta){
  const c=S.contas.find(x=>x.nome===nomeConta);
  const mv=(S.movContas||[]).filter(x=>x.conta===nomeConta).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.id>a.id?1:-1));

  const taxas=round2(mv.reduce((a,x)=>a+(x.taxa||0),0));
  const manuais=S.entradas.filter(e=>e.ativo&&e.conta===nomeConta).length+S.despesas.filter(d=>d.ativo&&d.conta===nomeConta).length;
  const saldo=c?saldoConta(c):round2(ent-sai);
  openModal(`<h2>${esc(nomeConta)}</h2><div class="sub">Extrato importado · ${mv.length} movimento(s)</div>
  <div class="tag" style="margin-bottom:6px">Entrou: <b class="pos">${brl(ent)}</b> · Saiu: <b class="neg">${brl(sai)}</b> · Saldo: <b class="${saldo<0?'neg':'pos'}">${brl(saldo)}</b></div>
  ${c&&limiteConta(c)>0?`<div class="tag" style="margin-bottom:6px">${textoLimiteConta(c,saldo)}</div>`:''}
  ${aLiquidarConta(nomeConta)>0?`<div class="tag" style="margin-bottom:6px">Previsto a entrar (já vendido, ainda não caiu na conta): <b>${brl(aLiquidarConta(nomeConta))}</b>${proximasEntradasTxt(nomeConta,'ledger')}</div>`:''}
  ${recebiveisPainelHTML(nomeConta)}
  ${taxas>0.004?`<div class="tag" style="margin-bottom:6px">Taxas retidas pela maquininha (já descontadas do que entrou): <b>${brl(taxas)}</b></div>`:''}
  ${manuais?`<div class="hint" style="margin-bottom:6px">${manuais} lançamento(s) manual(is) de Entrada/Despesa ligados a essa conta não entram no saldo, porque o saldo dela vem do extrato.</div>`:''}
  ${mv.map(x=>`<div class="row" style="cursor:default;gap:6px;flex-wrap:wrap">
    <div class="rm" style="min-width:150px"><b>${esc(x.descricao)}</b><small>${fmtDate(x.data)} · ${x.valor>=0?'Entrou':'Saiu'}${x.interno?' · entre minhas contas':''}${x.taxa>0.004?` · bruto ${brl(x.bruto)} − taxa ${brl(x.taxa)}`:''}</small></div>
    <div class="rv"><b class="${x.valor>=0?'pos':'neg'}">${x.valor<0?'-':''}${brl(Math.abs(x.valor))}</b></div>
    <button class="btn sm sec" data-act="movinterno" data-id="${x.id}" title="Transferência entre minhas contas: não conta como receita/despesa na conferência">${x.interno?'✓ entre minhas contas':'entre minhas contas'}</button>
    <button class="btn sm warn" data-act="movdel" data-id="${x.id}" title="Tirar esta linha do extrato da conta">${ICO.x_lixeira}</button>
  </div>`).join('')}
  <div class="acts" style="margin-top:10px"><button class="btn warn" data-act="fechar">Fechar</button></div>`);
  CONTA_EXTRATO_ABERTA=nomeConta;
}

/* Conferência mês a mês: o que foi LANÇADO (comandas/assinaturas em Entradas, despesas pagas) contra o que
   ENTROU/SAIU DE VERDADE nas contas (extratos importados, em valor bruto — a taxa da maquininha aparece à
   parte). Em vez de revisar linha por linha todo dia, olha o mês: se a diferença for grande, é nele que se
   procura. Dinheiro em espécie, assinatura cobrada por gateway sem extrato importado e dia de extrato faltando
   explicam a maior parte das diferenças. */
function conferenciaMes(ym){
  const mv=(S.movContas||[]).filter(x=>(x.mesRef||(x.data||'').slice(0,7))===ym&&!x.interno);
  const recebido=round2(mv.filter(x=>x.valor>0).reduce((a,x)=>a+(x.bruto!=null?x.bruto:x.valor),0));
  const taxas=round2(mv.filter(x=>x.valor>0).reduce((a,x)=>a+(x.taxa||0),0));
  const saiu=round2(-mv.filter(x=>x.valor<0).reduce((a,x)=>a+x.valor,0));
  const entLanc=round2(S.entradas.filter(e=>e.ativo&&e.mesRef===ym).reduce((a,e)=>a+e.valor,0));
  const despLanc=round2(S.despesas.filter(d=>d.ativo&&d.status==='Pago'&&d.mesRef===ym).reduce((a,d)=>a+d.valor,0));
  // prazo do cartão: assinatura entra como venda no dia da cobrança, mas o dinheiro cai ~31 dias depois
  const R=S.recebiveis||[],mesDe=d=>(d||'').slice(0,7);
  const cartAReceber=round2(R.filter(r=>!r.confirmado&&mesDe(r.venda)===ym).reduce((a,r)=>a+r.bruto,0));
  const cartDeAntes=round2(R.filter(r=>r.confirmado&&mesDe(r.liquidacao)===ym&&mesDe(r.venda)&&mesDe(r.venda)<ym).reduce((a,r)=>a+r.bruto,0));
  return {ym,recebido,taxas,saiu,entLanc,despLanc,cartAReceber,cartDeAntes,dEnt:round2(entLanc-recebido),dDes:round2(despLanc-saiu),temMov:(S.movContas||[]).some(x=>(x.mesRef||(x.data||'').slice(0,7))===ym)};
}
function conferenciaMensalHTML(y){
  const tem=(S.movContas||[]).length>0;
  if(!tem)return `<h3 style="margin:16px 0 8px">Conferência mês a mês</h3><div class="tag">Importe o extrato de cada conta (botão <b>Importar extrato</b> em cada conta, lá em cima). Aí o app compara, mês a mês, o que foi lançado pelas comandas com o que realmente entrou nas contas — sem você revisar nada linha por linha.</div>`;
  const linhas=[];
  for(let i=1;i<=12;i++){
    const ym=`${y}-${String(i).padStart(2,'0')}`,c=conferenciaMes(ym);
    if(!c.temMov)continue;
    const bate=Math.abs(c.dEnt)<1;
    linhas.push(`<div class="row" data-act="confmes" data-v="${ym}"><div class="rm"><b>${MESES[i-1]}/${y}</b>
      <small>Entradas lançadas ${brl(c.entLanc)} · Entrou nas contas ${brl(c.recebido)}</small>
      <small>Despesas pagas lançadas ${brl(c.despLanc)} · Saiu das contas ${brl(c.saiu)}</small></div>
      <div class="rv"><b class="${bate?'pos':'neg'}">${brl(c.dEnt)}</b><span class="tag">${bate?'entradas bateram ✓':'diferença nas entradas'}</span></div></div>`);
  }
  return `<h3 style="margin:16px 0 8px">Conferência mês a mês</h3>
  <div class="tag" style="margin-bottom:8px">Entradas lançadas (comandas) × o que entrou nas contas pelos extratos, em valor bruto. Toque no mês pra ver por conta.</div>
  ${linhas.length?linhas.join(''):`<div class="tag">Nenhum extrato importado em ${y}.</div>`}`;
}

  <div class="tag" style="margin-bottom:4px">Entradas lançadas: <b>${brl(c.entLanc)}</b> · Entrou nas contas (bruto): <b>${brl(c.recebido)}</b> · Diferença: <b class="${Math.abs(c.dEnt)<1?'pos':'neg'}">${brl(c.dEnt)}</b></div>

  <div class="tag" style="margin-bottom:8px">Despesas pagas lançadas: <b>${brl(c.despLanc)}</b> · Saiu das contas: <b>${brl(c.saiu)}</b> · Diferença: <b class="${Math.abs(c.dDes)<1?'pos':'neg'}">${brl(c.dDes)}</b>${c.taxas>0.004?` · taxas das maquininhas no mês: ${brl(c.taxas)}`:''}</div>
  ${porConta}
  <div class="hint">Se as entradas lançadas forem <b>maiores</b> que o que entrou: costuma ser dinheiro em espécie, assinatura cobrada em conta/gateway cujo extrato ainda não foi importado, ou dia de extrato que falta. Se forem <b>menores</b>: Pix recebido que não passou por comanda, ou transferência entre suas contas (marque "entre minhas contas" no extrato da conta pra tirar da conta).</div>
  <div class="acts" style="margin-top:10px"><button class="btn warn" data-act="fechar">Fechar</button></div>`);

/* Fundo de caixa: dinheiro que entrou/saiu de verdade (visto no extrato do banco ou da maquininha) mas

function fundoDeCaixaHTML(){

    ...S.entradas.filter(e=>e.ativo&&e.revisar).map(e=>({tipo:'entrada',id:e.id,descricao:e.descricao,valor:e.valor,data:e.data})),

  ].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!pendentes.length)return '';
  return `<h3 style="margin:16px 0 8px">Fundo de caixa — ${pendentes.length} pendente(s)</h3>
  <div class="tag" style="margin-bottom:8px">Dinheiro visto no extrato/maquininha que não bateu com nada conhecido (comanda, assinatura, despesa combinada). Fica aqui até você revisar — não precisa ser agora, pode deixar pra fechar no fim do mês.</div>

/* ===== Taxas de cartão / maquininha — calculadas sozinhas, sem lançar nada à mão =====
   De onde vem cada taxa (sem contar a mesma duas vezes):
   1) Agenda de recebíveis (Celcoin): MDR de cada cartão, no mês da VENDA (competência).
   2) Extrato/relatório da conta (Cash Pag, PagBank…): o campo "taxa" de cada recebimento, no mês da venda.
      O recebimento que a agenda já cobre é pulado.
   3) Linhas "Tarifa…" que saem de conta de maquininha/gateway (boleto, saque, cartão). A "Tarifa Cartão de Crédito"
      que é o MDR de um cartão já contado pela agenda (mesmo dia e valor) é pulada.
   4) Maquininha que credita o cartão já líquido sem mostrar a taxa (Stone: "Recebível de Cartão"): estimada pela
      taxa de crédito cadastrada na conta, e marcada como "estimada". */
function taxasCartao(inRef){
  const tipoDe=n=>((S.contas||[]).find(c=>c.nome===n)||{}).tipo||'';
  const contaDe=n=>(S.contas||[]).find(c=>c.nome===n)||{};
  const ehMaq=n=>tipoDe(n)==='Maquininha / Adquirente'||tipoDe(n)==='Carteira Digital';
  const R=S.recebiveis||[],cobertos=new Set(R.filter(r=>r.movId).map(r=>r.movId));
  const recs=[],porConta={},meses=new Set();
  const add=(conta,data,descricao,bruto,taxa,origem,id,ehTarifa)=>{
    const ymS=(data||'').slice(0,7);if(!ymS||!inRef(ymS)||!(taxa>0.004))return;
    taxa=round2(taxa);meses.add(ymS);
    recs.push({id,conta,data,descricao,bruto:round2(bruto||0),valor:taxa,origem});
    const p=porConta[conta]=porConta[conta]||{bruto:0,taxaVendas:0,n:0,tarifas:0,nTarifas:0,estimada:false};
    if(ehTarifa){p.tarifas=round2(p.tarifas+taxa);p.nTarifas++}
    else{p.bruto=round2(p.bruto+(bruto||0));p.taxaVendas=round2(p.taxaVendas+taxa);p.n++}
    if(origem==='estimada')p.estimada=true;
  };
  (S.movContas||[]).forEach(m=>{
    if(m.interno)return;
    const desc=normHead(m.descricao);
    if(m.valor>0){
      if(cobertos.has(m.id))return;
      let taxa=+m.taxa||0,bruto=m.bruto!=null?+m.bruto:m.valor,origem=m.dataVenda?'relatório':'taxa cadastrada';
      if(!(taxa>0)&&ehMaq(m.conta)&&/recebivel de cartao/.test(desc)){
        const pct=+contaDe(m.conta).taxaCredito||0;
        if(pct>0&&pct<100){bruto=round2(m.valor/(1-pct/100));taxa=round2(bruto-m.valor);origem='estimada'}
      }
      if(taxa>0)add(m.conta,m.dataVenda||m.data,m.descricao,bruto,taxa,origem,m.id,false);
    }else if(m.valor<0&&ehMaq(m.conta)&&/^tarifa/.test(desc)){
      if(/cartao/.test(desc)){
        const conf=R.filter(r=>r.conta===m.conta&&r.confirmado&&r.liquidacao===m.data);
        if(conf.length&&Math.abs(conf.reduce((a,r)=>a+(+r.mdr||0),0)+m.valor)<0.02)return; // já contada pela agenda
      }
      add(m.conta,m.data,m.descricao,0,-m.valor,'extrato',m.id,true);
    }
  });
  R.forEach(r=>{
    if(!(r.mdr>0))return;
    add(r.conta,r.venda||r.liquidacao,`Cartão ${r.bandeira||''} — cai em ${fmtDate(r.liquidacao)}${r.confirmado?' ✓':''}`.replace(/\s+/g,' '),r.bruto,r.mdr,'agenda',r.id,false);
  });
  recs.sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  return {total:round2(sum(recs)),recs,porConta,meses};
}
function taxasResumoHTML(T){
  if(!T||!Object.keys(T.porConta).length)return '';
  const linhas=Object.entries(T.porConta).sort((a,b)=>(b[1].taxaVendas+b[1].tarifas)-(a[1].taxaVendas+a[1].tarifas)).map(([nome,p])=>{
    const ef=p.bruto>0?(p.taxaVendas/p.bruto*100):null;
    return `<tr><td>${esc(nome)}${p.estimada?' <span class="pill prev">estimada</span>':''}${p.tarifas>0?`<br><small class="tag">+ tarifas avulsas ${brl(p.tarifas)} (${p.nTarifas})</small>`:''}</td><td>${p.n}</td><td>${p.bruto>0?brl(p.bruto):'—'}</td><td>${p.taxaVendas>0?brl(p.taxaVendas):'—'}</td><td><b>${ef!=null?ef.toFixed(2).replace('.',',')+'%':'—'}</b></td></tr>`;
  }).join('');

  <div class="formula">Calculado sozinho a partir dos extratos, relatórios e da agenda de recebíveis importados — não precisa lançar. <b>% efetiva</b> = taxa ÷ valor bruto das vendas. <b>Tarifas avulsas</b> = boleto, saque etc. cobrados à parte. "Estimada" = a maquininha credita o cartão já líquido sem mostrar a taxa (ex.: Stone); usa a taxa de crédito cadastrada na conta. Contas sem extrato importado no mês não aparecem.</div>`;

function calcDRE(ano,mes){
  const per=(ano==null&&mes==null)?(r=>inP(r.mesRef)):(r=>{const {y,m}=ym(r.mesRef);return y===(ano!=null?ano:V.year)&&((mes!=null?mes:V.month)==='all'||m===(mes!=null?mes:V.month))});
  const T=taxasCartao(ymS=>per({mesRef:ymS}));
  // Mês com taxa automática: a despesa manual "Maquininha / taxas" desse mês sai do DRE (senão contaria duas vezes)
  const ehTaxaManual=r=>normHead(r.subcategoria)==='maquininha / taxas'&&T.meses.has(r.mesRef);
  const E=S.entradas.filter(r=>r.ativo&&per(r)),D=S.despesas.filter(r=>r.ativo&&per(r)&&!ehTaxaManual(r)),receita=sum(E);
  const taxas=T.total,taxasManuaisSubstituidas=round2(sum(S.despesas.filter(r=>r.ativo&&per(r)&&ehTaxaManual(r))));
  // Cada linha guarda os PRÓPRIOS lançamentos (det) e o valor é a soma deles — o detalhamento na tela
  // usa exatamente esses arrays, então sempre fecha com o total da linha.
  const doCat=c=>D.filter(r=>normHead(r.categoria)===normHead(c));
  const ehComissao=r=>normHead(r.subcategoria).startsWith('comiss');
  const ehPessoal=r=>normHead(r.categoria)==='pessoal';
  const ehBonificacao=r=>normHead(r.subcategoria).startsWith('bonific');
  const nomesB=nomesBarbeiros(),ehDeBarbeiro=r=>!!r.colaborador&&nomesB.has(r.colaborador); // vale, adiantamento etc. de barbeiro contam como comissão
  const rCom=D.filter(r=>ehPessoal(r)&&!ehBonificacao(r)&&(ehComissao(r)||ehDeBarbeiro(r))),rBon=D.filter(r=>ehPessoal(r)&&ehBonificacao(r)),rIns=doCat('Insumos'),rPes=D.filter(r=>ehPessoal(r)&&!ehComissao(r)&&!ehBonificacao(r)&&!ehDeBarbeiro(r));
  const rFin=doCat('Financeiro'),rImp=doCat('Impostos'),rPro=doCat('Pró-labore'),rGP=doCat('Gastos Pessoais (Sócios)');
  const comissoes=sum(rCom),bonificacoes=sum(rBon);
  const insumos=sum(rIns),custosVariaveis=round2(comissoes+bonificacoes+insumos+taxas);
  const margemContribuicao=round2(receita-custosVariaveis);
  const pessoalFixo=sum(rPes);
  const financeiro=sum(rFin),impostos=sum(rImp),prolabore=sum(rPro);
  const gastosPessoais=sum(rGP);
  // Nenhuma categoria fica de fora: tudo que não é comissão/insumo/financeiro/imposto/pró-labore/gastos
  // pessoais dos sócios é despesa operacional, e cada categoria aparece com o PRÓPRIO nome — nunca
  // um balaio genérico "outras". Isso vale pra categoria nova que for criada no futuro também.
  // Variações de grafia (maiúscula/acento) da mesma categoria viram UMA linha (sem contar duas vezes).
  const catsEspeciais=new Set(['Insumos','Financeiro','Impostos','Pró-labore','Gastos Pessoais (Sócios)','Pessoal'].map(normHead));
  const opMap=new Map();D.forEach(r=>{const k=normHead(r.categoria);if(catsEspeciais.has(k))return;if(!opMap.has(k))opMap.set(k,{nome:r.categoria,recs:[]});opMap.get(k).recs.push(r)});
  const operacionais=[...opMap.values()].map(o=>({nome:o.nome,valor:sum(o.recs),key:'op:'+normHead(o.nome),recs:o.recs})).sort((a,b)=>b.valor-a.valor);
  const despesasOperacionais=round2(pessoalFixo+sum(operacionais));
  const resultadoOperacional=round2(margemContribuicao-despesasOperacionais);
  const lucroLiquido=round2(resultadoOperacional-financeiro-impostos-prolabore);
  const pct=v=>receita>0?v/receita*100:0;
  const det={receita:{recs:E,tipo:'entrada',grupo:'fonte'},comissoes:{recs:rCom,tipo:'despesa',grupo:'colaborador'},bonificacoes:{recs:rBon,tipo:'despesa',grupo:'colaborador'},insumos:{recs:rIns,tipo:'despesa',grupo:'subcategoria'},
    pessoalFixo:{recs:rPes,tipo:'despesa',grupo:'subcategoria'},financeiro:{recs:rFin,tipo:'despesa',grupo:'subcategoria'},impostos:{recs:rImp,tipo:'despesa',grupo:'subcategoria'},
    prolabore:{recs:rPro,tipo:'despesa',grupo:'subcategoria'},gastosPessoais:{recs:rGP,tipo:'despesa',grupo:'subcategoria'}};
  operacionais.forEach(o=>{det[o.key]={recs:o.recs,tipo:'despesa',grupo:'subcategoria'}});
  det.taxas={recs:T.recs,tipo:'taxa',grupo:'conta'};
  return {receita,comissoes,bonificacoes,insumos,taxas,taxasInfo:T,taxasManuaisSubstituidas,custosVariaveis,margemContribuicao,pessoalFixo,operacionais,despesasOperacionais,resultadoOperacional,financeiro,impostos,prolabore,lucroLiquido,gastosPessoais,pct,det};
}
function rotuloMesRef(r){const {y,m}=ym(r);return `${MESES[m-1]}/${y}`}
function tituloPeriodoDRE(){
  if(V.range){
    const {de,ate}=V.range;
    if(de===ate)return rotuloMesRef(de);
    const a=ym(de),b=ym(ate);
    if(a.y===b.y&&a.m===1&&b.m===12)return `Ano ${a.y}`;
    if(a.y===b.y&&a.m===1&&b.m===6)return `1º semestre ${a.y}`;
    if(a.y===b.y&&a.m===7&&b.m===12)return `2º semestre ${a.y}`;
    if(a.y===b.y&&a.m%3===1&&b.m===a.m+2)return `${(a.m-1)/3+1}º trimestre ${a.y}`;
    return `${rotuloMesRef(de)} a ${rotuloMesRef(ate)}`;
  }

/* Aplica um preset de período sobre V.year. Mantém V.month coerente (mês inicial) para as telas que ainda o leem. */
function aplicarPreset(pre,arg){
  const y=V.year,mk=(a,b)=>({de:`${y}-${pad(a)}`,ate:`${y}-${pad(b)}`});
  V.preset=pre;
  if(pre==='mes'){V.range=null;V.month=arg||(V.month==='all'?(new Date().getFullYear()===y?new Date().getMonth()+1:1):V.month)}
  else if(pre==='ano'){V.range=null;V.month='all'}
  else if(pre==='tri'){const q=Number(arg)||1;V.range=mk((q-1)*3+1,q*3);V.month=(q-1)*3+1}
  else if(pre==='sem'){const h=Number(arg)||1;V.range=h===1?mk(1,6):mk(7,12);V.month=h===1?1:7}
  else if(pre==='pers'){
    if(!V.range){const m=V.month==='all'?1:V.month;V.range={de:`${y}-${pad(m)}`,ate:`${y}-${pad(m)}`}}
    V.month=ym(V.range.de).m;
  }
}
/* Andar no tempo mantendo o "tamanho" do período: mês±1, trimestre±3, semestre±6, ano±12, personalizado±(n meses). */
function passoPeriodo(dir){
  const pre=V.preset||'mes';
  if(pre==='mes'&&!V.range){
    if(V.month==='all'){V.year+=dir;return}
    const [ny,nm]=addMonths(V.year,V.month,dir);V.year=ny;V.month=nm;return;
  }
  if(pre==='ano'){V.year+=dir;return}
  const r=V.range||{de:`${V.year}-01`,ate:`${V.year}-12`};
  const a=ym(r.de),b=ym(r.ate),n=(b.y*12+b.m)-(a.y*12+a.m)+1;
  const [y1,m1]=addMonths(a.y,a.m,dir*n),[y2,m2]=addMonths(b.y,b.m,dir*n);
  V.range={de:`${y1}-${pad(m1)}`,ate:`${y2}-${pad(m2)}`};V.year=y1;V.month=m1;
}

function desempenhoPorPlano(subs){
  const map={};
  subs.forEach(s=>{
    const k=s.plano||'Sem plano';
    if(!map[k])map[k]={receita:0,ativos:0,cancelados:0};
    if(s.status==='Ativo'){map[k].receita+=s.valorMensal;map[k].ativos++}
    else if(s.status==='Cancelado')map[k].cancelados++;
  });
  return Object.entries(map).map(([nome,v])=>({nome,...v,taxa:(v.ativos+v.cancelados)?v.cancelados/(v.ativos+v.cancelados):0})).sort((a,b)=>b.receita-a.receita);
}

/* ---------- Valor do assinante x tabela do plano ----------
   Cada assinante pode pagar: o preço de tabela do plano, um preço ANTIGO (ainda não reajustado), ou um valor com
   DESCONTO (ex.: indicação de outro cliente). O app compara o valor de cada um com o preço sugerido do plano e separa. */
const precosAntigosDoPlano=p=>Array.isArray(p&&p.precosAntigos)?p.precosAntigos:((p&&p.nome==='Club Corte ILIMITADO')?[104.99]:[]);
const planoPorNomeAss=nome=>{const n=normNome(nome||'');return S.planos.find(p=>normNome(p.nome)===n)||null};
function classificarValorAssinante(s){
  const pl=planoPorNomeAss(s.plano),tab=pl&&Number(pl.precoSugerido)>0?Number(pl.precoSugerido):0,v=Number(s.valorMensal)||0;
  const marc=(S.config.descIndic||{})[normNome(s.nome)];
  if(!tab||!(v>0))return {tipo:'semref',tab,v};
  const dif=round2(v-tab);
  if(Math.abs(dif)<0.011)return {tipo:'tabela',tab,v,dif:0};
  if(precosAntigosDoPlano(pl).some(a=>Math.abs(a-v)<0.011))return {tipo:'antigo',tab,v,dif};
  if(marc)return {tipo:'indicacao',tab,v,dif};
  return dif<0?{tipo:'desconto',tab,v,dif}:{tipo:'acima',tab,v,dif};
}

/* Cabeçalho da Conciliação: total ÚNICO de em-dia/atrasado/pendente, somando Cash Barber (CashPag/Manual) e
   Celcoin (Transações: Cel Cash/Boleto-Pix) — confirmado pela Caroline que é a mesma base de clientes nos dois
   sistemas, então NÃO se mostra mais separado por canal/fonte aqui. O detalhamento por fonte abaixo é só para
   investigar um número específico (ex.: conferir de onde veio a cobrança de um cliente), nunca outro "total". */
function vConciliacao(){
  const Comb=conciliacaoCombinada();
  if(!Comb)return '';
  const li=c=>`${esc(c.nome)} · ${brl(c.valor)} ${waLink(c.telefone||'')}`;
  return `<h3 style="margin:16px 0 8px">Conciliação de cobrança — Cash Barber + Celcoin (total único)</h3>
  <div class="tag" style="margin-bottom:8px">Mesma base de clientes nos dois sistemas — cartão, manual e Cel Cash somados num único total de em dia/atrasado/pendente, sem separar por canal.</div>
  <div class="grid">
    <div class="card"><div class="lbl">Em dia</div><div class="big pos">${Comb.emDia.length}</div><div class="tag">${brl(Comb.valorEmDia)}</div></div>
    <div class="card"><div class="lbl">Atrasados</div><div class="big neg">${Comb.atrasados.length}</div><div class="tag">${brl(Comb.valorAtrasado)}</div></div>
    <div class="card"><div class="lbl">Pendentes</div><div class="big amb">${Comb.pendentes.length}</div><div class="tag">${brl(Comb.valorPendente)}</div></div>
  </div>
  ${Comb.atrasados.length?`<h3 style="margin:16px 0 6px">Atrasados (${Comb.atrasados.length})</h3><div class="card">${Comb.atrasados.slice(0,40).map(li).join('<br>')}${Comb.atrasados.length>40?'…':''}</div>`:'<div class="aviso green">Nenhum cliente atrasado no momento.</div>'}
  ${vConciliacaoDetalhePorFonte()}`;
}
/* Detalhamento por fonte — só para investigar um número (ex.: "de onde veio a cobrança desse cliente?"), nunca
   para ler como um total à parte: os totais que valem são os do cabeçalho acima. */
function vConciliacaoDetalhePorFonte(){
  const C=conciliacaoCartao(),T=conciliacaoTransacoes();
  if(!C&&!T)return '';
  const li=c=>`${esc(c.nome)} · ${brl(c.valor)} ${waLink(c.telefone)}`;
  const liT=t=>`${esc(t.nome)} · ${brl(t.valor)} · venceu há ${T.diasAtraso(t)}d`;
  let html=`<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Detalhamento por fonte (só para investigar um número específico)</summary><div style="margin-top:10px">`;
  if(C){
    const b=C.porBucket;
    html+=`<h3 style="margin:8px 0 6px">Cash Barber (cartão)</h3>
    <div class="tag" style="margin-bottom:6px">${b['Em dia'].length} em dia · ${b['Atrasada'].length} atrasada(s) · ${b['Pendente'].length} pendente(s) · ${b['Cancelada'].length} cancelada(s)</div>
    <div class="aviso ${C.cashpag.length?'red':'green'}">${C.cashpag.length?`${C.cashpag.length} assinante(s) cobrados via CashPag, somando ${brl(C.valorCashPag)}. Essa receita não passa pela Celcoin.`:'Nenhum assinante cobrado via CashPag no momento.'}</div>
    ${C.cashpagTambemCelcoin.length?`<div class="tag" style="margin-top:4px">${C.cashpagTambemCelcoin.length} desses também têm contrato ativo na Celcoin — confira se não é cobrança duplicada do mesmo cliente.</div>`:''}
    ${C.manualSemCelcoin.length?`<div class="aviso amb" style="margin-top:6px">${C.manualSemCelcoin.length} contrato(s) "Manual" sem par na Celcoin, somando ${brl(C.valorManualSemCelcoin)}.</div>`:''}
    ${C.legado.length?`<div class="tag" style="margin-top:10px">${C.legado.length} cadastro(s) "Legado Celcoin" — resíduo de uma integração antiga que não está mais ativa. Considere limpar esses cadastros no Cash Barber.</div>`:''}
    ${C.soCelcoin.length?`<div class="tag" style="margin-top:10px">${C.soCelcoin.length} contrato(s) ativo(s) só na Celcoin, sem linha correspondente no cartão do Cash Barber.</div>`:''}`;
  }
  if(T){
    html+=`<h3 style="margin:14px 0 6px">Celcoin — Transações (Cel Cash + Boleto/Pix)</h3>
    <div class="tag" style="margin-bottom:6px">${T.atrasadas.length} atrasada(s) · ${T.pendentes.length} pendente(s) · ${T.pagas.length} paga(s) · ${T.canceladas.length} cancelada(s)</div>
    ${T.atrasadas.length?`<div class="card" style="margin:8px 0">${T.atrasadas.slice(0,30).map(liT).join('<br>')}${T.atrasadas.length>30?'…':''}</div>`:''}`;
  }
  return html+`</div></details>`;
}
