function taxaNumerica(rows,i){const a=rows.slice(0,25).map(r=>String(r[i]||'').trim()).filter(Boolean);if(!a.length)return 0;return a.filter(v=>!isNaN(parseMoney(v))&&/\d/.test(v)).length/a.length}
function palpiteMapeamento(headers,rows){
  const m=mapHeaders(headers,ALIASES_MAPA);
  // Relatório de maquininha (PagBank e parecidos): toda linha é uma venda recebida — "Tipo evento" diz
  // só "Pagamento" sempre (não serve pra separar entrada/despesa, e o palpite genérico ia interpretar
  // "pagamento" como despesa, o que é o oposto do que significa aqui). "Estabelecimento" normalmente vem
  // vazio nesse relatório — "Forma de pagamento" (ex.: "Mastercard Crédito") é a descrição que importa.
  const Hn=headers.map(normHead);
  const ehMaquininha=Hn.some(h=>h.includes('data da liberacao'))&&Hn.some(h=>h.includes('valor liquido'))&&Hn.some(h=>h.includes('forma de pagamento'))&&Hn.some(h=>h.includes('tipo evento'));
  if(ehMaquininha){
    delete m.tipoMov;
    const iForma=Hn.findIndex(h=>h.includes('forma de pagamento'));
    if(iForma>=0)m.descricao=iForma;
    m.ehMaquininha=true;
  }
  // Extrato Stone: "Movimentação" (Débito/Crédito) = sentido; "Tipo" (Pix, Transação, Recebível de Cartão, Transferência entre
  // contas Stone) = o que é a linha; "Destino"/"Origem" = com quem; "Saldo antes/depois" = saldo da conta em cada linha. A coluna
  // "Descrição" vem em branco — o palpite genérico ficava sem descrição e comparava o Valor com "Saldo antes".
  const iMovSt=Hn.findIndex(h=>h==='movimentacao'),iTipoSt=Hn.findIndex(h=>h==='tipo'),iDepSt=Hn.findIndex(h=>h==='saldo depois'),iAntSt=Hn.findIndex(h=>h==='saldo antes'),iValSt=Hn.findIndex(h=>h==='valor'),iDtSt=Hn.findIndex(h=>h==='data');
  if(iMovSt>=0&&iTipoSt>=0&&iDepSt>=0&&iAntSt>=0&&iValSt>=0&&iDtSt>=0){
    m.tipoMov=iMovSt;m.descricao=iTipoSt;m.valor=iValSt;m.data=iDtSt;delete m.tipo;
    const iDest=Hn.findIndex(h=>h==='destino'),iOri=Hn.findIndex(h=>h==='origem');
    if(iDest>=0)m.destino=iDest;if(iOri>=0)m.origem=iOri;
    m.saldoAntes=iAntSt;m.saldoDepois=iDepSt;
  }
  // Extrato Celcoin / Galax Pay: "Transação" = Entrada/Saída (sentido), "Tipo da Transação" = descrição (ex.: Boleto Recebido,
  // Tarifa de boleto). O palpite genérico lia "Tipo da Transação" como sentido e ficava sem descrição.
  const iTr=Hn.findIndex(h=>h==='transacao'),iTipoTr=Hn.findIndex(h=>h==='tipo da transacao'),iValTr=Hn.findIndex(h=>h==='valor da transacao'),iDtTr=Hn.findIndex(h=>h==='data da transacao');
  if(iTr>=0&&iTipoTr>=0&&iValTr>=0&&iDtTr>=0){m.tipoMov=iTr;m.descricao=iTipoTr;m.valor=iValTr;m.data=iDtTr;delete m.tipo}
  // Relatório de transações de gateway/carteira (ex.: Cash Pag): cada linha é um RECEBIMENTO com valor bruto, líquido e
  // descontos (taxa), data da transação e data de LIQUIDAÇÃO (quando cai na carteira). "Tipo de movimentação" = Débito/
  // Crédito é a FORMA DE PAGAMENTO do cliente, não o sentido do dinheiro (antes lia "Débito" como saída).
  const iBruto=Hn.findIndex(h=>h==='valor bruto'),iLiq=Hn.findIndex(h=>h==='valor liquido');
  if(iBruto>=0&&iLiq>=0){
    delete m.tipoMov;
    m.valor=iLiq;m.valorBruto=iBruto;
    const iDesc=Hn.findIndex(h=>h==='descontos'||h==='desconto'||h==='taxa'||h==='taxas');if(iDesc>=0)m.desconto=iDesc;
    const iLiquidacao=Hn.findIndex(h=>h.includes('data de liquidacao')||h.includes('data liquidacao')),iTransacao=Hn.findIndex(h=>h.includes('data da transacao')||h.includes('data transacao'));
    if(iLiquidacao>=0){m.data=iLiquidacao;if(iTransacao>=0)m.dataVenda=iTransacao}
    const iCli=Hn.findIndex(h=>h==='cliente'||h==='nome do cliente'||h==='pagador');if(iCli>=0)m.cliente=iCli;
    m.ehTransacoesGateway=true;
  }
  // colunas de débito/crédito que na verdade trazem texto ("Entrada"/"Saída") viram coluna de tipo
  ['debito','credito'].forEach(k=>{if(m[k]!==undefined&&taxaNumerica(rows,m[k])<0.5){if(m.tipoMov===undefined)m.tipoMov=m[k];delete m[k]}});
  if(m.valor!==undefined&&(m.debito!==undefined||m.credito!==undefined))delete m.valor;
  if(m.valor!==undefined&&taxaNumerica(rows,m.valor)<0.5)delete m.valor;
  return m;
}

function acharCabecalho(t){
  const todas=[t.headers].concat(t.rows);
  const vocab=COLUNAS_AMPLAS.concat(['cliente','profissional','nome do cliente','tipo de cobranca','historico']);
  const hits=r=>r.map(normHead).filter(c=>c&&vocab.some(k=>c===k||c.includes(k))).length;

async function pdfTextoPrimeiraPagina(file){
  if(typeof pdfjsLib==='undefined')throw erroArq('sem-pdf');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const c=await (await doc.getPage(1)).getTextContent();
  return c.items.map(it=>String(it.str||'').trim()).filter(Boolean);
}

   no saldo: o dinheiro só vira saldo quando aparece no extrato. Enquanto a data não chega fica em "Previsto a entrar"; chegou
   o dia, passa sozinho pra "chegou na data, falta conferir no extrato"; quando o extrato mostra o recebimento (mesmo dia e
   valor), é dado como confirmado. Cada nova agenda atualiza a anterior (casa pelo TID) — não precisa dar baixa à mão. */
function parseAgendaRecebiveis(headers,rows){
  const H=headers.map(normHead),ix=n=>H.findIndex(h=>h===n);
  const c={liq:ix('a receber'),venda:ix('data da venda'),parcela:ix('parcela'),trans:ix('transacao'),tid:ix('tid'),band:ix('bandeira'),bruto:ix('valor bruto'),mdr:ix('mdr'),liquido:ix('valor'),status:ix('status da transacao')};

  const itens=[];let semData=0,incons=0;
  rows.forEach(r=>{
    const bruto=c.bruto>=0?Math.abs(parseValorBR(r[c.bruto])):0;
    if(!(bruto>0))return;
    const liq=c.liq>=0?parseDataBR(r[c.liq]):'';

    const mdr=c.mdr>=0?Math.abs(parseValorBR(r[c.mdr])):0;
    let liquido=c.liquido>=0?parseValorBR(r[c.liquido]):0;

/* Casa o recebimento que aparece no EXTRATO ("Recebimento Cartão de Crédito - N") com os cartões da agenda: mesmo dia e a soma
   do valor bruto dos cartões fecha o valor do recebimento. Confirmados saem de "previsto/falta conferir". */
function conciliarRecebiveis(conta){
  const pend=(S.recebiveis||[]).filter(r=>r.conta===conta&&!r.confirmado);
  if(!pend.length)return 0;
  const usados=new Set((S.recebiveis||[]).filter(r=>r.conta===conta&&r.movId).map(r=>r.movId));
  let n=0;
  (S.movContas||[]).filter(m=>m.conta===conta&&m.valor>0&&!usados.has(m.id)&&/cartao|credito/.test(normHead(m.descricao))).forEach(m=>{
    const cand=pend.filter(r=>!r.confirmado&&r.liquidacao===m.data);
    if(!cand.length||cand.length>14)return;
    const N=parseInt((String(m.descricao).match(/-\s*(\d+)\s*$/)||[])[1]||0);
    let achou=null;
    if(Math.abs(round2(cand.reduce((a,r)=>a+r.bruto,0))-m.valor)<0.02)achou=cand;
    else for(let mask=1;mask<(1<<cand.length)&&!achou;mask++){
      const sub=cand.filter((_,i)=>mask&(1<<i));
      if(N&&sub.length!==N)continue;
      if(Math.abs(round2(sub.reduce((a,r)=>a+r.bruto,0))-m.valor)<0.02)achou=sub;
    }
    if(achou)achou.forEach(r=>{r.confirmado=true;r.movId=m.id;r.confirmadoEm=todayISO();n++});
  });
  return n;
}
/* Saque/transferência da Celcoin pro CNPJ da própria empresa ("PIX enviado para: BARBER SHOP BARBAROSSA LTDA") não é despesa nem
   receita: marca como "entre minhas contas" e, quando o recebimento da mesma quantia (±1 dia) aparece em OUTRA conta, marca o
   outro lado também — senão a conferência contaria o mesmo dinheiro duas vezes. A tarifa do saque continua sendo custo. */
function parearTransferenciasProprias(){
  let n=0;
  const L=S.movContas||[];
  L.filter(m=>m.paraProprio&&!m.parId).forEach(out=>{
    const par=L.find(x=>x.id!==out.id&&x.conta!==out.conta&&!x.parId&&Math.abs(x.valor+out.valor)<0.005&&Math.abs((new Date(x.data)-new Date(out.data))/86400000)<=1);
    if(par){par.interno=true;par.parId=out.id;out.parId=par.id;n++}
  });
  return n;
}

function linhaTemValorExtrato(r,m){

/* Saldos que o PRÓPRIO arquivo informa (Celcoin: "Saldo Inicial/Final" no topo; Cash Pag: "Saldo disponível / em processamento"

function acharSaldosNoDocumento(t){

  const temNum=v=>String(v==null?'':v).trim()!==''&&/\d/.test(String(v))&&!isNaN(parseMoney(v));
  linhas.forEach((r,li)=>{
    (r||[]).forEach((c,ci)=>{
      const n=normHead(c);if(!/^(saldo (inicial|final|disponivel|em processamento)|data (inicial|final)|total de (creditos|debitos))$/.test(n))return;

        return null;

      else if(n==='saldo final')out.saldoFinal=parseMoney(v);
      else if(n==='saldo disponivel')out.disponivel=parseMoney(v);
      else if(n==='saldo em processamento')out.processamento=parseMoney(v);
      else if(n==='total de creditos')out.totalCreditos=parseMoney(v);
      else if(n==='total de debitos')out.totalDebitos=parseMoney(v);
      else if(n==='data inicial')out.dataInicial=parseDataBR(v);
      else if(n==='data final')out.dataFinal=parseDataBR(v);
    });

  // depois da mais nova são o saldo inicial e final do período.

function somaFuturaExtrato(rows,m,hoje){

function previaExtrato(rows,m,modo){
  const temDebCred=m.debito!==undefined||m.credito!==undefined;
  const P={desp:{n:0,v:0},ent:{n:0,v:0},semValor:0,semData:0,amostra:[]};
  const reg=(ehD,v,r)=>{const k=ehD?'desp':'ent';P[k].n++;P[k].v=round2(P[k].v+v);if(P.amostra.length<4)P.amostra.push([m.data!==undefined?fmtDate(parseDataBR(r[m.data]))||String(r[m.data]||'—'):'—',m.descricao!==undefined?r[m.descricao]:'',ehD?'Saiu':'Entrou',brl(v)])};
  rows.forEach(r=>{
    if(m.data!==undefined&&linhaTemValorExtrato(r,m)&&!parseDataBR(r[m.data]))P.semData++;

      if(Math.abs(vC)>0){reg(false,Math.abs(vC),r);alg=true}

function catalogoPorIntencaoCols(headers,rows){
  const H=headers.map(normHead);
  const pessoa=/telefone|celular|whatsapp|e-?mail|endereco|nascimento|aniversario|cpf|cnpj|cargo|funcao|comissao|admissao|cliente|colaborador|barbeiro|debito|credito|saldo|vencimento|comanda|profissional/;
  if(H.some(h=>pessoa.test(h))||H.some(h=>h==='data'||h.startsWith('data ')))return null;
  const nomeIdx=H.findIndex(h=>/^(nome|item|produto|servico|descricao|nome do item|nome do servico|nome do produto|produtos|servicos)$/.test(h));
  if(nomeIdx<0)return null;
  const precoIdx=H.findIndex((h,i)=>i!==nomeIdx&&/^(preco|valor|preco de venda|valor de venda|valor sugerido|preco sugerido|preco \(r\$\)|valor \(r\$\))$/.test(h)&&taxaNumerica(rows,i)>=0.6);
  if(precoIdx<0)return null;
  return {nome:nomeIdx,preco:precoIdx};
}
function docEscolherTipo(tipo,m,forcarCols){
  const t=DOC.tabela;DOC.tipo=tipo;DOC.etapa='confirmar';DOC.registros=[];DOC.ignoradas=0;
  if(TIPOS_IMPORTER.includes(tipo)){
    const semNome=t.rows.filter(r=>r.every(c=>String(c).trim()==='')).length;
    let hdrs=adaptarCabecalhos(tipo,t.headers);
    // Colunas escolhidas pela intenção: renomeia só o cabeçalho de nome e o de preço para os que o parse conhece.
    if(tipo==='catalogo'&&forcarCols){hdrs=hdrs.slice();hdrs[forcarCols.nome]='Nome';hdrs[forcarCols.preco]='Preço'}
    DOC.registros=IMPORTERS[tipo].parse(hdrs,t.rows);
    if(tipo!=='freq')DOC.ignoradas=Math.max(0,t.rows.length-DOC.registros.length-semNome);
  }else if(tipo==='extrato'){
    DOC.m=m||DOC.m||palpiteMapeamento(t.headers,t.rows);
    if(DOC.m.ehMaquininha&&!DOC.modo)DOC.modo='entrada';
    DOC.linhasExtrato=t.rows.filter(r=>r.some(c=>String(c).trim()!==''));
    const antes=DOC.linhasExtrato.length;DOC.linhasExtrato=DOC.linhasExtrato.filter(r=>!linhaSaldoOuTotal(r,DOC.m));
    DOC.ignoradas=antes-DOC.linhasExtrato.length;
    DOC.meta=acharSaldosNoDocumento(t);
    if(!DOC.contaExtrato&&t.contaHint){const cc=S.contas.find(x=>x.nome.toLowerCase().includes(t.contaHint));if(cc)DOC.contaExtrato=cc.nome}
  }else if(tipo==='comandas'){
    DOC.m=mapComandas(t.headers);
  }else if(tipo==='agendarec'){
    DOC.agenda=parseAgendaRecebiveis(t.headers,t.rows);
    if(!DOC.contaExtrato){const cc=S.contas.find(x=>/celcoin|galax/i.test(x.nome));if(cc)DOC.contaExtrato=cc.nome}
  }else if(tipo==='catmix'){
    DOC.m=mapCategorias(t.headers);
    if(!DOC.periodoDe){const hoje=todayISO();DOC.periodoDe=hoje.slice(0,8)+'01';DOC.periodoAte=hoje}
  }
  docRender();
}

function handleLogoFile(file){
  if(!file)return;
  snap();
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const max=160;let w2=img.width,h2=img.height;
        if(w2>=h2){if(w2>max){h2=Math.round(h2*max/w2);w2=max}}else{if(h2>max){w2=Math.round(w2*max/h2);h2=max}}
        const cv=document.createElement('canvas');cv.width=w2;cv.height=h2;
        cv.getContext('2d').drawImage(img,0,0,w2,h2);
        S.config.logoDataUrl=cv.toDataURL('image/png');
        save();render();atualizarIconePWA();toast('Logo atualizada');
      }catch(e){toast('Não foi possível processar essa imagem')}
    };
    img.onerror=()=>toast('Arquivo de imagem inválido');
    img.src=rd.result;
  };
  rd.onerror=()=>toast('Não foi possível ler o arquivo');
  rd.readAsDataURL(file);
}

function guessDateFromFilename(name){
  const n=String(name||'').toLowerCase();
  let m=n.match(/(20\d{2})[-_](\d{1,2})[-_](\d{1,2})(?!\d)/);
  if(m&&+m[2]>=1&&+m[2]<=12)return iso(+m[1],+m[2],+m[3]);
  m=n.match(/(\d{1,2})[-_](\d{1,2})[-_](20\d{2})/);
  if(m&&+m[2]>=1&&+m[2]<=12)return iso(+m[3],+m[2],+m[1]);
  m=n.match(/(?:^|[^\d])(\d{1,2})[-_](20\d{2})(?!\d)/);
  if(m&&+m[1]>=1&&+m[1]<=12)return iso(+m[2],+m[1],1);
  m=n.match(/(20\d{2})[-_](\d{1,2})(?!\d)/);
  if(m&&+m[2]>=1&&+m[2]<=12)return iso(+m[1],+m[2],1);
  const MESES_MAP={janeiro:1,fevereiro:2,marco:3,'março':3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
  for(const nome in MESES_MAP){
    if(n.includes(nome)){
      const y=n.match(/20\d{2}/);
      if(y)return iso(+y[0],MESES_MAP[nome],1);
    }
  }
  return '';
}
let EXTRATO_REVISAR=[],EXTRATO_PARSED=null,EXTRATO_ARQUIVO=null;
/* Coluna "Tipo"/"D/C"/"Entrada/Saída" escolhida no mapeamento → true = despesa, false = entrada, null = não sei */
function sentidoPorTipo(v){
  const n=normHead(v);if(!n)return null;
  if(/^(d|deb|debito|s|saida|saidas|despesa|pagamento|pago|retirada|compra)$|debito|saida|despesa/.test(n))return true;
  if(/^(c|cred|credito|e|entrada|entradas|receita|recebimento|recebido|deposito)$|credito|entrada|receita|recebimento/.test(n))return false;
  return null;
}
/* Coluna de categoria mapeada: usa se bater com uma categoria do app ou com o mapa do Relatório; senão classifica pela descrição */
function categoriaDeColuna(txt,descricao){
  const n=normHead(txt);
  const c=S.config.catList.find(x=>normHead(x.nome)===n);if(c)return {categoria:c.nome,subcategoria:''};
  const mp=MAPA_CATEGORIA_RELATORIO[n];if(mp&&mp.tipo==='despesa'){const cm=canonNome('cat',mp.categoria);return {categoria:cm,subcategoria:canonNome('sub',mp.subcategoria||'',cm)}}
  const rr=resolverNome(txt,poolNomes('cat'));if(rr.como==='exato'||rr.como==='plural'||rr.como==='parecido')return {categoria:rr.nome,subcategoria:''};
  const r=classificarDespesa(descricao);if(r.categoria)return r;
  return classificarDespesa(txt);
}
function fonteDeColuna(txt,descricao){
  const n=normHead(txt);
  const f=S.config.fontesList.find(x=>normHead(x.nome)===n);if(f)return f.nome;
  const mp=MAPA_CATEGORIA_RELATORIO[n];if(mp&&mp.tipo==='entrada')return canonNome('fonte',mp.fonte);
  const rr=resolverNome(txt,poolNomes('fonte'));if(rr.como==='exato'||rr.como==='plural'||rr.como==='parecido')return rr.nome;
  return classificarEntrada(descricao)||classificarEntrada(txt);
}

     extrato vem líquido (taxa já descontada); com as taxas cadastradas guarda também o bruto e a taxa, só pra
     informação e pra conferência. */
  const contaObjExtrato=S.contas.find(c=>c.nome===contaExtrato);
  const usaTaxaMaquininha=contaObjExtrato&&(contaObjExtrato.tipo==='Maquininha / Adquirente'||contaObjExtrato.tipo==='Carteira Digital')&&temTaxasCadastradas(contaObjExtrato);
  const tarifasNoArquivo=EXTRATO_PARSED.m.descricao!==undefined&&EXTRATO_PARSED.rows.some(r=>/tarifa/.test(normHead(r[EXTRATO_PARSED.m.descricao])));
  const taxaPorDescricao=desc=>{
    const zero={pct:0,fixa:0};
    if(!usaTaxaMaquininha||tarifasNoArquivo)return zero; // se o extrato já lista as tarifas, não desconta de novo
    const n=normHead(desc),c=contaObjExtrato,P=k=>+c[k]||0;
    if(/boleto/.test(n))return {pct:P('taxaBoleto'),fixa:P('taxaBoletoFixa')};
    if(/pix/.test(n))return {pct:P('taxaPix'),fixa:P('taxaPixFixa')};
    if(/debito/.test(n))return {pct:P('taxaDebito'),fixa:P('taxaDebitoFixa')};
    if(/credito/.test(n)){
      if(/amex|elo/.test(n)&&P('taxaAmex'))return {pct:P('taxaAmex'),fixa:P('taxaCreditoFixa')};
      return {pct:P('taxaCredito'),fixa:P('taxaCreditoFixa')};
    }
    return zero;
  };
  const {rows,m}=EXTRATO_PARSED;
  const temDebCred=m.debito!==undefined||m.credito!==undefined;
  const hoje=todayISO();
  EXTRATO_REVISAR=[];SOCIO_LINHAS=[];
  if(!Array.isArray(S.movContas))S.movContas=[];
  let novos=0,totalE=0,totalS=0,totalTaxa=0,semData=0,duplicados=0,menorData='',maiorData='',anteriores=0,proprios=0;
  // O saldo inicial da conta já inclui TUDO o que aconteceu antes da data dele: linha anterior a essa data não entra (nem no
  // extrato da conta, nem na conferência) — senão um extrato que começa no mês passado traria o mês passado junto.
  const corte=(contaObjExtrato&&contaObjExtrato.dataSaldoInicial)||'';
  const fpsMov=new Set(S.movContas.map(x=>x.fp));
  // Duas linhas IGUAIS no mesmo dia (ex.: dois Pix de R$ 15,00 na maquininha) têm a mesma impressão digital:
  // conta a ocorrência dentro do arquivo (a 1ª mantém a digital, a 2ª vira "#2"...). Reimportar o mesmo
  // arquivo, ou um extrato acumulado, continua sem duplicar nada.
  const ocorrFp={};
  const fpUnico=base=>{ocorrFp[base]=(ocorrFp[base]||0)+1;return ocorrFp[base]>1?base+'#'+ocorrFp[base]:base};
  const registrar=(ehSaida,valorAbs,descricaoBase,dataStr,extra)=>{
    if(!(valorAbs>0))return;
    if(corte&&dataStr<corte){anteriores++;return}
    const valor=round2(valorAbs);
    if(contaObjExtrato&&contaObjExtrato.socio)SOCIO_LINHAS.push({data:dataStr,desc:descricaoBase,valor:ehSaida?-valor:valor});
    const fp=fpUnico(fpLancamento(dataStr,descricaoBase,valor,(ehSaida?'S|':'E|')+contaExtrato));
    if(fpsMov.has(fp)){duplicados++;return}
    let bruto=ehSaida?-valor:valor,taxa=0;
    if(!ehSaida){
      if(extra&&extra.bruto>0){bruto=round2(extra.bruto);taxa=round2(extra.taxa>0?extra.taxa:bruto-valor)} // relatório já traz bruto e desconto
      else{const tx=taxaPorDescricao(descricaoBase);if(tx.pct>0||tx.fixa>0){bruto=round2((valor+tx.fixa)/(1-tx.pct/100));taxa=round2(bruto-valor)}}
    }
    const mov={id:nextId('MOV'),conta:contaExtrato,data:dataStr,mesRef:dataStr.slice(0,7),descricao:descricaoBase,valor:ehSaida?-valor:valor,bruto,taxa,interno:false,fp,importadoEm:hoje};
    if(extra&&extra.dataVenda)mov.dataVenda=extra.dataVenda;
    if(/barbaros/.test(normHead(descricaoBase))){mov.interno=true;mov.paraProprio=true;proprios++} // saque/transferência de/pra própria empresa (nome pode vir cortado: "BARBAROS")
    S.movContas.push(mov);
    fpsMov.add(fp);novos++;
    if(ehSaida)totalS+=valor;else{totalE+=valor;totalTaxa+=taxa}
    if(!menorData||dataStr<menorData)menorData=dataStr;
    if(!maiorData||dataStr>maiorData)maiorData=dataStr;
    return mov;
  };
  /* Stone: regras "guardar X% dos recebimentos" (Limite guardado 1% · PJ Plus 1% + 2%) saem da conta no MESMO instante de cada
     recebimento, como débito "Transação" com destino "Desconhecido" e valor = 1% ou 2% da entrada. Não são despesa: são aplicação
     em CDB da própria empresa. Viram transferência interna para a conta de investimento (o saldo continua contado). */
  const HD=EXTRATO_PARSED.headers.map(h=>normHead(h)),iDt=HD.indexOf('data'),iTp=HD.indexOf('tipo'),iDs=HD.indexOf('destino'),iMv=HD.findIndex(h=>h.startsWith('movimenta'));
  const credPorData=new Map(),usoReg=new Map();
  if(iDt>=0&&iTp>=0&&iDs>=0&&iMv>=0&&m.valor!==undefined)rows.forEach(r=>{
    if(!/^credito/.test(normHead(r[iMv]||'')))return;
    const v=parseValorBR(r[m.valor]);if(!(v>0))return;
    const k=String(r[iDt]||'').trim();if(!credPorData.has(k))credPorData.set(k,[]);credPorData.get(k).push(v);
  });
  const CONTA_PJPLUS='Stone PJ Plus (CDB 107% CDI)',CONTA_LIMITE='Stone Limite guardado (CDB 100% CDI)';
  let aplicados=0,totalAplic=0;
  const regraInvest=r=>{
    if(!credPorData.size||!/^debito/.test(normHead(r[iMv]||''))||normHead(r[iTp]||'')!=='transacao'||normHead(r[iDs]||'')!=='desconhecido')return null;
    const v=Math.abs(parseValorBR(r[m.valor])),k=String(r[iDt]||'').trim();
    for(const cr of (credPorData.get(k)||[])){
      for(const pct of [1,2]){
        if(Math.abs(v-cr*pct/100)>0.011)continue;
        let conta=CONTA_PJPLUS;
        if(pct===1){const kk=k+'|'+cr,n=(usoReg.get(kk)||0)+1;usoReg.set(kk,n);if(n===1)conta=CONTA_LIMITE}
        return {pct,conta};
      }
    }
    return null;
  };
  const garantirContaInvest=nome=>{
    if(!S.contas.some(c=>c.nome===nome))S.contas.push({id:nextId('CTA'),nome,tipo:'Investimento (CDB)',icone:'',saldoInicial:0,dataSaldoInicial:'2026-10-05'});
  };
  rows.forEach((r,idx)=>{
    if(!linhaTemValorExtrato(r,m))return; // rodapé de saldo / linha em branco: não é movimento
    let descBruta=m.descricao!==undefined?(r[m.descricao]||'').trim():'';
    if(!descBruta){
      const usadas=new Set([m.data,m.descricao,m.tipo,m.valor,m.debito,m.credito,m.categoria,m.tipoMov,m.valorBruto,m.desconto,m.dataVenda,m.cliente].filter(x=>x!==undefined));
      const partes=r.map((v,i)=>!usadas.has(i)?String(v||'').trim():'').filter(Boolean);
      descBruta=partes.length?partes.join(' '):`Lançamento importado ${idx+1}`;
    }
    const tipoTxt=m.tipo!==undefined?(r[m.tipo]||'').trim():'';
    let descricao=tipoTxt?`${tipoTxt} ${descBruta}`:descBruta;
    if(m.destino!==undefined||m.origem!==undefined){
      const sd=m.tipoMov!==undefined?sentidoPorTipo(r[m.tipoMov]):(m.valor!==undefined?parseValorBR(r[m.valor])<0:null);
      const col=sd===true?m.destino:sd===false?m.origem:undefined,cp=col!==undefined?String(r[col]||'').trim():'';
      if(cp&&!/^desconhecido$/i.test(cp)&&!descricao.includes(cp))descricao+=' — '+cp;
    }
    if(m.cliente!==undefined){const cli=String(r[m.cliente]||'').trim();if(cli&&!descricao.includes(cli))descricao+=' — '+cli}
    const extra={};
    if(m.valorBruto!==undefined){const bb=Math.abs(parseValorBR(r[m.valorBruto]));if(bb>0){extra.bruto=bb;if(m.desconto!==undefined)extra.taxa=Math.abs(parseValorBR(r[m.desconto]))}}
    if(m.dataVenda!==undefined){const dv=parseDataBR(r[m.dataVenda]);if(dv)extra.dataVenda=dv}
    const dataParseada=m.data!==undefined?parseDataBR(r[m.data]):'';
    if(!dataParseada)semData++;
    const dataStr=dataParseada||dataRefFallback||hoje;
    const inv=regraInvest(r);
    if(inv){
      const vI=round2(Math.abs(parseValorBR(r[m.valor])));
      const mv=registrar(true,vI,`Aplicação automática ${inv.pct}% dos recebimentos → ${inv.conta}`,dataStr);
      if(mv){
        garantirContaInvest(inv.conta);
        mv.interno=true;mv.paraProprio=true;mv.investimento=inv.conta;
        const cr={id:nextId('MOV'),conta:inv.conta,data:dataStr,mesRef:dataStr.slice(0,7),descricao:`Aplicação automática ${inv.pct}% dos recebimentos — de ${contaExtrato}`,valor:vI,bruto:vI,taxa:0,interno:true,parId:mv.id,fp:'INV|'+mv.fp,importadoEm:hoje};
        mv.parId=cr.id;S.movContas.push(cr);fpsMov.add(cr.fp);aplicados++;totalAplic+=vI;
        totalS-=vI; // não é saída da empresa
      }
      return;
    }
    if(temDebCred){
      const vD=m.debito!==undefined?parseValorBR(r[m.debito]):NaN;
      const vC=m.credito!==undefined?parseValorBR(r[m.credito]):NaN;
      if(!isNaN(vD)&&Math.abs(vD)>0)registrar(true,Math.abs(vD),descricao,dataStr);
      if(!isNaN(vC)&&Math.abs(vC)>0)registrar(false,Math.abs(vC),descricao,dataStr,extra);
    }else{
      const valorBruto=parseValorBR(r[m.valor]);if(isNaN(valorBruto))return;
      const sentido=m.tipoMov!==undefined?sentidoPorTipo(r[m.tipoMov]):null;
      let ehSaida;
      if(sentido!==null)ehSaida=sentido;
      else if(modo==='despesa')ehSaida=true;else if(modo==='entrada')ehSaida=false;else ehSaida=valorBruto<0;
      registrar(ehSaida,Math.abs(valorBruto),descricao,dataStr,extra);
    }
  });
  const confirmadosAgenda=conciliarRecebiveis(contaExtrato),pareados=parearTransferenciasProprias();
  save();
  render();
  const box=document.getElementById('extrato_resumo');
  if(box)box.innerHTML=`<div class="card" style="margin-top:10px"><b>Guardado na conta ${esc(contaExtrato)}</b>
    <div class="tag">${novos} movimento(s) novo(s)${menorData?` · de ${fmtDate(menorData)} a ${fmtDate(maiorData)}`:''} · entrou ${brl(totalE)} · saiu ${brl(totalS)}${totalTaxa>0.004?` · taxas retidas pela maquininha ${brl(totalTaxa)}`:''}</div>
    ${duplicados?`<div class="tag">${duplicados} linha(s) já tinham sido lidas antes — ignoradas pra não duplicar.</div>`:''}
    ${semData?`<div class="tag">${semData} linha(s) sem data própria (usaram ${dataRefFallback?fmtDate(dataRefFallback):'hoje'}).</div>`:''}
    ${anteriores?`<div class="tag">${anteriores} linha(s) anteriores a ${fmtDate(corte)} (data do saldo inicial da conta) foram ignoradas — o saldo inicial já inclui tudo o que aconteceu antes.</div>`:''}
    ${aplicados?`<div class="tag">${aplicados} aplicação(ões) automática(s) da Stone (regras de 1% + 1% + 2% dos recebimentos) = <b>${brl(round2(totalAplic))}</b>: foram para as contas de investimento (PJ Plus e Limite guardado) como transferência interna — não são despesa.</div>`:''}
    ${proprios?`<div class="tag">${proprios} saque(s)/transferência(s) pra própria empresa marcado(s) como "entre minhas contas"${pareados?` (${pareados} já pareado(s) com o recebimento na outra conta)`:''}. A tarifa de cada saque continua como custo.</div>`:(pareados?`<div class="tag">${pareados} transferência(s) entre contas pareada(s) e marcada(s) como "entre minhas contas".</div>`:'')}
    ${confirmadosAgenda?`<div class="tag">✓ ${confirmadosAgenda} cartão(ões) da agenda de recebíveis confirmado(s) por este extrato.</div>`:''}
    ${(()=>{const mt=(DOC&&DOC.meta)||{},cO=S.contas.find(c=>c.nome===contaExtrato);if(!cO)return `<div class="aviso amb" style="margin-top:6px">"${esc(contaExtrato)}" não está cadastrada em Suas contas — cadastre pra ter saldo.</div>`;let h='';
      if(mt.saldoInicial!=null&&mt.dataInicial&&cO.dataSaldoInicial===mt.dataInicial&&Math.abs((cO.saldoInicial||0)-mt.saldoInicial)>=0.01)h+=`<div class="aviso amb" style="margin-top:6px">O extrato diz que a conta começou em ${fmtDate(mt.dataInicial)} com <b>${brl(mt.saldoInicial)}</b>, mas o saldo inicial cadastrado é <b>${brl(cO.saldoInicial||0)}</b> (diferença ${brl(round2((cO.saldoInicial||0)-mt.saldoInicial))}). <button class="btn sm" style="margin-top:6px" data-act="ajustarsaldoini" data-conta="${esc(contaExtrato)}" data-v="${mt.saldoInicial}">Corrigir saldo inicial para ${brl(mt.saldoInicial)}</button></div>`;
      if(mt.saldoFinal!=null&&mt.dataFinal&&cO.dataSaldoInicial&&mt.dataFinal<cO.dataSaldoInicial){
        const ig=Math.abs((cO.saldoInicial||0)-mt.saldoFinal)<0.011;
        h+=ig?`<div class="aviso green" style="margin-top:6px">✓ O extrato termina em ${fmtDate(mt.dataFinal)} com ${brl(mt.saldoFinal)} — igual ao saldo inicial cadastrado (${brl(cO.saldoInicial||0)} em ${fmtDate(cO.dataSaldoInicial)}).</div>`:`<div class="aviso amb" style="margin-top:6px">O extrato termina em ${fmtDate(mt.dataFinal)} com <b>${brl(mt.saldoFinal)}</b>, mas o saldo inicial cadastrado (${fmtDate(cO.dataSaldoInicial)}) é <b>${brl(cO.saldoInicial||0)}</b> (diferença ${brl(round2((cO.saldoInicial||0)-mt.saldoFinal))}). Se não houve movimento entre as duas datas, o saldo inicial deveria ser ${brl(mt.saldoFinal)}. Se houve, exporte o extrato até hoje. <button class="btn sm" style="margin-top:6px" data-act="ajustarsaldoini" data-conta="${esc(contaExtrato)}" data-v="${mt.saldoFinal}">Corrigir saldo inicial para ${brl(mt.saldoFinal)}</button></div>`;
      }else if(mt.saldoFinal!=null&&mt.dataFinal){const calc=saldoCalculadoConta(contaExtrato,mt.dataFinal);h+=Math.abs(calc-mt.saldoFinal)<0.011?`<div class="aviso green" style="margin-top:6px">✓ Saldo da conta em ${fmtDate(mt.dataFinal)}: ${brl(calc)} — igual ao saldo final do extrato.</div>`:`<div class="aviso amb" style="margin-top:6px">Saldo da conta em ${fmtDate(mt.dataFinal)} no app: ${brl(calc)}; o extrato diz ${brl(mt.saldoFinal)} (diferença ${brl(round2(calc-mt.saldoFinal))}).</div>`}
      if(mt.disponivel!=null){const calc=saldoConta(cO);h+=Math.abs(calc-mt.disponivel)<0.011?`<div class="aviso green" style="margin-top:6px">✓ Saldo da conta hoje: ${brl(calc)} — igual ao "Saldo disponível" do relatório.</div>`:`<div class="aviso amb" style="margin-top:6px">Saldo da conta hoje no app: ${brl(calc)}; o relatório diz saldo disponível ${brl(mt.disponivel)} (diferença ${brl(round2(calc-mt.disponivel))}).</div>`}
      return h})()}
    ${SOCIO_LINHAS.some(l=>l.valor<0)?`<div class="aviso green" style="margin-top:8px">Esta é uma conta pessoal do sócio: dá para transformar as saídas em <b>Gastos Pessoais</b> (você confere antes de gravar).<br><button class="btn ok sm" style="margin-top:6px" data-act="sociolancar">Lançar gastos deste extrato</button></div>`:''}
    <div class="hint" style="margin-top:6px">Nada disso virou Entrada ou Despesa — a receita continua vindo só das comandas. Compare mês a mês em <b>Fluxo de Caixa → Conferência</b>.</div></div>
  <button class="btn warn sm" style="margin-top:8px" data-act="undo">${ICO.undo} Desfazer esta importação</button>`;

/* ============ Extrato da conta do sócio → Gastos Pessoais ============ */
let SOCIO_LINHAS=[],SOCIO_PREVIA=[];
const SOCIO_SUBS=['Pessoal/Família','Pensão','Financiamento Carro','Internet/Telefone','Pedágio','Cartão pessoal','Alimentação pessoal'];
function socioClassificar(desc,valor){
  const n=normHead(desc);
  if(/barber shop barbaros|barbershop barbaros|barbaros/.test(n))return {skip:'Transferência da/para a empresa (já está no livro-caixa)'};
  if(/caroline zanchi|giordan de mel|giordan de melo/.test(n))return {skip:'Transferência entre contas da família'};
  if(/johann/.test(n))return {skip:'Comissão do Johann paga pelo PF — fica só no extrato/fluxo de caixa, não entra em Comissões'};
  if(/remuneracao aplicacao/.test(n))return {skip:'Rendimento'};
  if(/hilario weber/.test(n))return {sub:'Pessoal/Família',desc:'Aluguel apartamento'};
  if(/carine alves/.test(n)){if(Math.abs((valor||0)-500)<0.01)return {sub:'Pensão',desc:'Pensão (parcela 7 de 37)',parc:[7,37]};return {sub:'Pensão',desc:'Pensão'}}
  if(/vivo/.test(n))return {sub:'Internet/Telefone',desc:'Vivo (conta celular/internet)'};
  if(/sem parar/.test(n))return {sub:'Pedágio',desc:'Sem Parar'};
  if(/pagamento de boleto/.test(n)&&/c6/.test(n))return {sub:'Financiamento Carro',desc:'Parcela do carro (com juros)'};
  if(/rge sul/.test(n))return {sub:'Pessoal/Família',desc:'Conta de luz da casa (RGE Sul)'};
  if(/rek parking/.test(n))return {sub:'Pessoal/Família',desc:'Estacionamento'};
  if(/shpp|shopee/.test(n))return {sub:'Pessoal/Família',desc:'Compra Shopee'};
  if(/roxana/.test(n))return {sub:'Pessoal/Família',desc:'Terapia da família (Roxana)'};
  if(/^iof|juros saldo|tarifa/.test(n))return {sub:'Pessoal/Família',desc:'IOF / juros da conta PF'};
  return {sub:classificarSubGastosPessoais(desc),desc:desc.replace(/^PIX ENVIADO\s*/i,'').slice(0,60)};
}
function abrirLancarSocio(conta){
  const saidas=SOCIO_LINHAS.filter(l=>l.valor<0).sort((a,b)=>a.data.localeCompare(b.data));
  const usados=new Set(),jaFp=new Set(S.despesas.map(d=>d.fpExtrato).filter(Boolean));
  SOCIO_PREVIA=saidas.map((l,i)=>{
    const c=socioClassificar(l.desc,-l.valor),v=-l.valor,fp='SOC|'+conta+'|'+l.data+'|'+v.toFixed(2)+'|'+normHead(l.desc).slice(0,30);
    let cont=0;const fpU=()=>{cont++;return cont>1?fp+'#'+cont:fp};
    const r={i,data:l.data,desc:l.desc,v,c,fp:null,ja:false,casar:null};
    r.fp=fp;
    // repetições do mesmo fp no arquivo
    const rep=SOCIO_PREVIA.filter(x=>x.fp===fp||x.fp0===fp).length;r.fp0=fp;if(rep)r.fp=fp+'#'+(rep+1);
    if(jaFp.has(r.fp))r.ja=true;
    return r;
  });
  SOCIO_PREVIA.forEach(r=>{
    if(r.ja||r.c.skip)return;
    const ym=r.data.slice(0,7);
    let best=null;
    S.despesas.forEach(d=>{
      if(usados.has(d.id)||d.ativo===false||d.fpExtrato)return;
      if(d.mesRef!==ym&&d.data.slice(0,7)!==ym)return;
      const ehSocio=d.categoria==='Gastos Pessoais (Sócios)'||d.categoria==='Investimentos';
      if(!ehSocio)return;
      const mesmaSub=d.subcategoria===r.c.sub;
      const dif=Math.abs(d.valor-r.v)/Math.max(r.v,1);
      if(!mesmaSub||dif>0.2)return;
      const sc=dif+(mesmaSub?0:1);if(!best||sc<best.sc)best={d,sc};
    });
    if(best){r.casar=best.d;usados.add(best.d.id)}
  });
  const entradas=SOCIO_LINHAS.filter(l=>l.valor>0);
  const opt=(r)=>{
    let h='';
    if(r.ja)return `<option value="skip" selected>Já lançado antes</option>`;
    if(r.casar)h+=`<option value="upd:${r.casar.id}" selected>Atualizar ${esc(r.casar.id)} (${esc(r.casar.descricao.slice(0,28))} · ${brl(r.casar.valor)})</option>`;
    SOCIO_SUBS.forEach(sb=>h+=`<option value="new:${esc(sb)}"${!r.casar&&!r.c.skip&&r.c.sub===sb?' selected':''}>Novo · ${esc(sb)}</option>`);
    h+=`<option value="skip"${r.c.skip&&!r.casar?' selected':''}>Não lançar${r.c.skip?' — '+esc(r.c.skip):''}</option>`;
    return h;
  };
  const linhas=SOCIO_PREVIA.map(r=>`<tr><td style="white-space:nowrap">${fmtDate(r.data)}</td><td>${esc(r.desc.replace(/^PIX ENVIADO\s*/i,'PIX → '))}</td><td style="text-align:right;white-space:nowrap"><b>${brl(r.v)}</b></td><td><select data-socio="${r.i}" style="max-width:260px">${opt(r)}</select></td></tr>`).join('');
  openModal(`<h2>Lançar gastos do extrato — ${esc(conta)}</h2><div class="sub">${saidas.length} saída(s) · ${entradas.length} entrada(s) (entradas não viram lançamento)</div>
  <div class="hint">Sugestões feitas pelo nome de quem recebeu. Onde já existe um lançamento parecido no mês, o app atualiza valor, data e conta para o que realmente saiu (e marca Pago) em vez de duplicar. Ajuste o que quiser antes de gravar.</div>
  <div style="overflow:auto;max-height:55vh"><table class="tbl" style="width:100%"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>O que fazer</th></tr></thead><tbody>${linhas}</tbody></table></div>
  <div class="acts"><button class="btn ok" data-act="sociogravar" data-conta="${esc(conta)}">Gravar lançamentos</button><button class="btn sec" data-act="fechar">Cancelar</button></div>`);
}
function gravarLancarSocio(conta){
  snap();let novos=0,atual=0;
  document.querySelectorAll('select[data-socio]').forEach(sel=>{
    const r=SOCIO_PREVIA[+sel.dataset.socio];if(!r||r.ja)return;
    const v=sel.value;
    if(v.startsWith('upd:')){
      const d=S.despesas.find(x=>x.id===v.slice(4));if(!d)return;
      d.valor=round2(r.v);d.data=r.data;d.vencimento=r.data;d.status='Pago';d.conta=conta;d.fpExtrato=r.fp;atual++;
    }else if(v.startsWith('new:')){
      const sub=v.slice(4),c=r.c.sub===sub&&r.c.desc?r.c.desc:r.desc.replace(/^PIX ENVIADO\s*/i,'').slice(0,60);
      S.despesas.push({id:nextId('DES'),data:r.data,mesRef:r.data.slice(0,7),categoria:canonNome('cat','Gastos Pessoais (Sócios)'),subcategoria:canonNome('sub',sub,'Gastos Pessoais (Sócios)'),valor:round2(r.v),forma:'',conta,cartao:'',descricao:c,recorrente:!!(r.c.parc&&r.c.sub===sub),grupo:(r.c.parc&&r.c.sub===sub)?'PENSAO-500':'',status:'Pago',vencimento:(r.c.parc&&r.c.sub===sub)?r.data.slice(0,8)+'20':r.data,parcelaAtual:(r.c.parc&&r.c.sub===sub)?r.c.parc[0]:0,parcelasTotal:(r.c.parc&&r.c.sub===sub)?r.c.parc[1]:0,ativo:true,fpExtrato:r.fp});novos++;
      if(r.c.parc&&r.c.sub===sub){ // parcelas seguintes, sempre dia 20, em aberto
        let [y,m]=r.data.slice(0,7).split('-').map(Number);
        for(let p=r.c.parc[0]+1;p<=r.c.parc[1];p++){
          m++;if(m>12){m=1;y++}
          const ym=y+'-'+pad(m);
          if(S.despesas.some(d=>d.grupo==='PENSAO-500'&&d.parcelaAtual===p))continue;
          S.despesas.push({id:nextId('DES'),grupo:'PENSAO-500',data:ym+'-20',mesRef:ym,categoria:canonNome('cat','Gastos Pessoais (Sócios)'),subcategoria:canonNome('sub',sub,'Gastos Pessoais (Sócios)'),valor:round2(r.v),forma:'',conta,cartao:'',descricao:'Pensão (parcela '+p+' de '+r.c.parc[1]+')',recorrente:true,status:'Previsto',vencimento:ym+'-20',parcelaAtual:p,parcelasTotal:r.c.parc[1],ativo:true});novos++;
        }
      }
    }
  });
  save();render();closeModal();
  toast(`${novos} lançamento(s) novo(s) · ${atual} atualizado(s) com o valor real do extrato`);
}

function classificarSubOcupacao(descricao){
  const n=normHead(descricao);
  if(/alvara/.test(n))return 'Alvarás';
  if(/condomin/.test(n))return 'Condomínio';
  if(/iptu/.test(n))return 'IPTU';
  return 'Aluguel';
}
function classificarSubGastosPessoais(descricao){
  const n=normHead(descricao);
  if(/pens\w{0,2}ao/.test(n))return 'Pensão';
  if(/financiamento|parc\.?\s*carro|\bcarro\b/.test(n))return 'Financiamento Carro';
  if(/internet|\bvivo\b|telefone|\bcel\.|iptv/.test(n))return 'Internet/Telefone';
  if(/sem parar|pedagio/.test(n))return 'Pedágio';
  if(/cartao/.test(n))return 'Cartão pessoal';
  if(/almoco|\bcafe\b/.test(n))return 'Alimentação pessoal';
  return 'Pessoal/Família';
}

let RELATORIO_PARSED=null;
async function prepararRelatorio(file){
  let headers,rows;try{({headers,rows}=await parseArquivoTabular(file))}catch(e){toast(msgErroArquivo(e));return}
  return prepararRelatorioTabela(headers,rows,file.name);

async function prepararRelatorioTabela(headers,rows,nomeArquivo){
  const m=mapHeaders(headers,[
    ['tipo',['tipo']],['dataCaixa',['data caixa']],['dataCompetencia',['data competencia']],
    ['categoria',['categoria']],['descricao',['descricao']],['valor',['valor r$','valor']],
    ['conta',['conta']],['status',['status']],['clienteFornecedor',['cliente / fornecedor','cliente fornecedor']],['observacao',['observacao']]
  ]);
  if(m.valor===undefined){toast('Não encontrei a coluna de Valor nesse arquivo.');return}
  RELATORIO_PARSED={headers,rows,m};
  const colData=m.dataCaixa!==undefined?m.dataCaixa:m.dataCompetencia;
  let amostraTotal=0,amostraOk=0;
  if(colData!==undefined)rows.slice(0,20).forEach(r=>{amostraTotal++;if(parseDataBR(r[colData]))amostraOk++});
  const dataConfiavel=colData!==undefined&&amostraTotal>0&&(amostraOk/amostraTotal)>=0.8;
  const box=document.getElementById('relatorio_dataref_box');
  if(dataConfiavel){if(box)box.innerHTML='';await executarImportacaoRelatorio(null)}
  else{
    const chute=guessDateFromFilename(nomeArquivo);
    if(box)box.innerHTML=`<div class="aviso amb">Não achei data confiável em cada linha — não vou usar a data de hoje por padrão. Confirme o mês de referência.</div>
    ${F('Mês de referência',`<input type="month" id="f_relatorio_ref" value="${chute?chute.slice(0,7):''}">`)}
    <button class="btn ok sm" data-act="relatorioconfirmarref">Confirmar e importar</button>`;
  }
}
async function executarImportacaoRelatorio(dataRefFallback){
  snap();
  const {rows,m}=RELATORIO_PARSED,hoje=todayISO();
  const colData=m.dataCaixa!==undefined?m.dataCaixa:m.dataCompetencia;
  const resumo={};EXTRATO_REVISAR=[];let totalD=0,totalE=0,lidas=0,puladasTransf=0,puladasSaldo=0,valorTransfPessoalIgnorada=0,qtdTransfPessoalIgnorada=0,duplicados=0,semData=0;
  const fpsDespesas=new Set(S.despesas.filter(d=>d.origemExtrato&&d.fpImport).map(d=>d.fpImport));
  const fpsEntradas=new Set(S.entradas.filter(e=>e.origemExtrato&&e.fpImport).map(e=>e.fpImport));
  rows.forEach((r,idx)=>{
    const tipoRaw=m.tipo!==undefined?(r[m.tipo]||'').trim():'';
    const tipoNorm=normHead(tipoRaw);
    let descBase=m.descricao!==undefined?(r[m.descricao]||'').trim():'';
    const cf=m.clienteFornecedor!==undefined?(r[m.clienteFornecedor]||'').trim():'';
    if(cf)descBase=descBase?`${descBase} — ${cf}`:cf;
    if(/saldo inicial/i.test(descBase)){puladasSaldo++;return}
    const obsRaw=m.observacao!==undefined?normHead(r[m.observacao]):'';
    const ehRecorrente=obsRaw==='recorrente';
    const contaLinha=m.conta!==undefined?(r[m.conta]||'').trim():'';
    if(/transfer/i.test(tipoNorm)){
      const valorTransf=parseValorBR(r[m.valor]);
      const ehPessoalRotulada=/pro.?[\s-]?labore|dividendo|divisao de lucro|distribuicao de lucro/i.test(descBase);
      if(ehPessoalRotulada&&!isNaN(valorTransf)&&valorTransf<0){
        const categoria=canonNome('cat','Pró-labore'),subcategoria=canonNome('sub',/dividendo|divisao de lucro|distribuicao de lucro/i.test(descBase)?'Distribuição de Lucros':'Retirada dos sócios',categoria);
        const dataCompT=colData!==undefined?parseDataBR(r[colData]):'',dataCaixaT=m.dataCaixa!==undefined?parseDataBR(r[m.dataCaixa]):'';
        if(!dataCompT&&!dataCaixaT&&!dataRefFallback)semData++;
        const dataStrT=dataCompT||dataCaixaT||dataRefFallback||hoje;
        const valorT=round2(Math.abs(valorTransf));
        const descFinalT=descBase||`Transferência pessoal ${idx+1}`;
        const fpT=fpLancamento(dataStrT,descFinalT,valorT,contaLinha);
        if(fpsDespesas.has(fpT)){duplicados++;return}
        const id=nextId('DES');
        S.despesas.push({id,grupo:ehRecorrente?chaveSerieDespesa(categoria,subcategoria,descBase):'',data:dataStrT,mesRef:dataStrT.slice(0,7),categoria,subcategoria,valor:valorT,forma:'',conta:contaLinha,cartao:'',descricao:descFinalT,recorrente:ehRecorrente,status:'Pago',vencimento:dataCaixaT||dataStrT,parcelaAtual:0,parcelasTotal:0,ativo:true,origemExtrato:true,fpImport:fpT});
        fpsDespesas.add(fpT);
        resumo[categoria]=(resumo[categoria]||0)+1;totalD+=valorT;lidas++;
        return;
      }
      if(contaLinha==='Conta Santander PF'&&!isNaN(valorTransf)){valorTransfPessoalIgnorada+=Math.abs(valorTransf);qtdTransfPessoalIgnorada++}
      puladasTransf++;return;
    }
    const valorBruto=parseValorBR(r[m.valor]);if(isNaN(valorBruto)||!valorBruto)return;
    const categoriaRaw=m.categoria!==undefined?(r[m.categoria]||'').trim():'';
    const catNorm=normHead(categoriaRaw);
    const mapa=MAPA_CATEGORIA_RELATORIO[catNorm];
    const ehDespesa=mapa?mapa.tipo==='despesa':(tipoNorm==='saida'?true:tipoNorm==='entrada'?false:valorBruto<0);
    const statusRaw=m.status!==undefined?normHead(r[m.status]):'';
    const statusFinal=/pendente/.test(statusRaw)?'Previsto':'Pago';
    const conta=contaLinha;
    const dataComp=colData!==undefined?parseDataBR(r[colData]):'';
    const dataCaixa=m.dataCaixa!==undefined?parseDataBR(r[m.dataCaixa]):'';
    if(!dataComp&&!dataCaixa&&!dataRefFallback)semData++;
    const dataStr=dataComp||dataCaixa||dataRefFallback||hoje;
    const vencStr=dataCaixa||dataStr;
    const descricao=descBase||`Lançamento ${idx+1}`;
    const valor=round2(Math.abs(valorBruto));
    if(ehDespesa){
      let categoria,subcategoria;
      if(mapa){categoria=mapa.categoria;subcategoria=mapa.subcategoria||'';if(catNorm==='aluguel / condominio / iptu / alvaras')subcategoria=classificarSubOcupacao(descricao);if(catNorm==='gastos pessoais')subcategoria=classificarSubGastosPessoais(descricao)}
      else{const cl=classificarDespesa(descricao);categoria=cl.categoria;subcategoria=cl.subcategoria}
      const catFinal=canonNome('cat',categoria||'Outros'),subcategoriaFinal=canonNome('sub',subcategoria,catFinal);
      const fp=fpLancamento(dataStr,descricao,valor,conta);
      if(fpsDespesas.has(fp)){duplicados++;return}
      const id=nextId('DES');lidas++;
      S.despesas.push({id,grupo:ehRecorrente?chaveSerieDespesa(catFinal,subcategoriaFinal,descricao):'',data:dataStr,mesRef:dataStr.slice(0,7),categoria:catFinal,subcategoria:subcategoriaFinal,valor,forma:'',conta,cartao:'',descricao,recorrente:ehRecorrente,status:statusFinal,vencimento:vencStr,parcelaAtual:0,parcelasTotal:0,ativo:true,origemExtrato:true,fpImport:fp});
      fpsDespesas.add(fp);
      resumo[catFinal]=(resumo[catFinal]||0)+1;totalD+=valor;if(!categoria)EXTRATO_REVISAR.push({tipo:'despesa',id,descricao,valor});
    }else{
      let fonte=mapa?mapa.fonte:classificarEntrada(descricao);
      const fonteFinal=canonNome('fonte',fonte||'Outros');
      const fp=fpLancamento(dataStr,descricao,valor,conta);
      if(fpsEntradas.has(fp)){duplicados++;return}
      const id=nextId('ENT');lidas++;
      S.entradas.push({id,grupo:'',data:dataStr,mesRef:dataStr.slice(0,7),valor,fonte:fonteFinal,categoria:'Variável',conta,descricao,recorrente:ehRecorrente,ativo:true,origemExtrato:true,fpImport:fp});
      fpsEntradas.add(fp);
      resumo[fonteFinal]=(resumo[fonteFinal]||0)+1;totalE+=valor;if(!fonte)EXTRATO_REVISAR.push({tipo:'entrada',id,descricao,valor});
    }
  });
  save();
  const linhas=Object.entries(resumo).map(([k,v])=>`<div class="tag">${esc(k)}: ${v}</div>`).join('');
  const box=document.getElementById('relatorio_resumo');
  if(box)box.innerHTML=`<div class="card" style="margin-top:10px"><b>Importado</b><div class="tag">${lidas} lançamento(s) novo(s) · ${brl(totalD)} em despesas · ${brl(totalE)} em entradas</div><div class="tag">${puladasTransf} transferência(s) entre contas ignorada(s) (não são receita nem despesa) · ${puladasSaldo} saldo(s) inicial ignorado(s)${duplicados?` · ${duplicados} já importado(s) antes, ignorado(s) para não duplicar`:''}${semData?` · ${semData} sem data própria (usaram ${dataRefFallback?fmtDate(dataRefFallback):'hoje'} — vale conferir)`:''}</div>${qtdTransfPessoalIgnorada?`<div class="aviso amb" style="margin-top:8px">${qtdTransfPessoalIgnorada} transferência(s) para a conta pessoal (Santander PF) somando ${brl(valorTransfPessoalIgnorada)}, sem descrição clara do motivo — não lancei como pró-labore por não ter certeza. Vale você conferir a origem e, se for retirada dos sócios, me avisar para eu incluir.</div>`:''}${linhas}</div>
  <button class="btn warn sm" style="margin-top:8px" data-act="undo">${ICO.undo} Desfazer esta importação</button>
  ${revisarHTML()}`;
  toast('Relatório importado');
}

/* ==========================================================================
   v2 — Contas a pagar/receber · Indicadores · Exportação · Comissões · Torre de controle
   Tudo aditivo: não altera DRE, importadores nem a base de clientes/CPF.
   ========================================================================== */
const CP_LISTA={contaPagar:'contasPagar',contaReceber:'contasReceber'};
const FREQS=[['mensal','Mensal'],['semanal','Semanal'],['anual','Anual']];
function addDiasISO(isoStr,n){const [y,m,d]=isoStr.split('-').map(Number);const dt=new Date(y,m-1,d+n);return iso(dt.getFullYear(),dt.getMonth()+1,dt.getDate())}
function fimDoMesISO(isoStr){const [y,m]=isoStr.split('-').map(Number);return iso(y,m,lastDay(y,m))}
function proxVencimento(venc,freq,diaBase){
  const [y,m,d]=venc.split('-').map(Number);
  if(freq==='semanal')return addDiasISO(venc,7);
  const [yy,mm]=addMonths(y,m,freq==='anual'?12:1);
  return dateIn(yy,mm,diaBase||d);
}
function statusConta(c){
  if(c.status==='pago')return 'pago';
  if(c.status==='cancelado')return 'cancelado';
  return c.vencimento&&c.vencimento<todayISO()?'atrasado':'pendente';
}
/* Gera a próxima ocorrência de cada série recorrente. Regra: enquanto a ocorrência mais recente
   da série já foi paga/pulada OU já venceu, cria a próxima (sem duplicar: se já existe uma
   ocorrência com aquele vencimento, só avança). Limite de 60 por série para não disparar. */
function gerarRecorrenciasContas(){
  const hoje=todayISO();let criadas=0;
  ['contaPagar','contaReceber'].forEach(t=>{
    const L=S[CP_LISTA[t]];
    const series={};
    L.forEach(c=>{if(c.serie)(series[c.serie]=series[c.serie]||[]).push(c)});
    Object.values(series).forEach(lista=>{
      lista.sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||''));
      let ultima=lista[lista.length-1];
      if(!ultima.recorrente||!ultima.vencimento||!FREQS.some(f=>f[0]===ultima.frequencia))return;
      const venctos=new Set(lista.map(x=>x.vencimento));
      let guarda=0;
      while((ultima.status==='pago'||ultima.status==='cancelado'||ultima.vencimento<hoje)&&guarda<60){
        guarda++;
        const nv=proxVencimento(ultima.vencimento,ultima.frequencia,ultima.diaBase);
        if(venctos.has(nv)){ultima=lista.find(x=>x.vencimento===nv);if(!ultima.recorrente)break;continue}
        const nova={id:nextId(PFX[t]),serie:ultima.serie,descricao:ultima.descricao,valor:ultima.valor,vencimento:nv,status:'pendente',
          categoria:ultima.categoria||'',subcategoria:ultima.subcategoria||'',recorrente:true,frequencia:ultima.frequencia,diaBase:ultima.diaBase||Number(ultima.vencimento.slice(8)),
          observacao:ultima.observacao||'',contaBancaria:ultima.contaBancaria||'',criadoEm:hoje,geradaAuto:true};
        L.push(nova);lista.push(nova);venctos.add(nv);ultima=nova;criadas++;
      }
    });
  });
  if(criadas)save();
  return criadas;
}
/* Assinatura é receita recorrente: todo assinante ativo (status em STATUS_ATIVOS) com valor cadastrado
   ganha uma série própria em Contas a Receber (marcada origemAssinatura), que se renova sozinha todo mês
   via gerarRecorrenciasContas(). Só para de gerar quando o cliente é cancelado/desativado — nunca apaga
   o que já venceu, só encerra a recorrência (igual ao "encerrar série" manual). Idempotente: pode chamar
   várias vezes sem duplicar. */
function sincronizarContasReceberAssinantes(){
  const hoje=todayISO();let mudou=false;
  const L=S.contasReceber;
  const porCliente={};
  L.forEach(c=>{if(c.clienteId)(porCliente[c.clienteId]=porCliente[c.clienteId]||[]).push(c)});
  // O relatório de Contratos (Data de criação) tem a data real de início da assinatura — é dali que o
  // dia de cobrança recorrente deveria vir. O cliente, criado por OUTRO relatório (cartões/comandas), não
  // carrega essa data sozinho; sem esse cruzamento, cai no dia de hoje (como se a assinatura tivesse
  // começado agora), o que está errado pra quem já é assinante há tempo.
  const contratoPorNome={};
  S.imp.contratos.forEach(ct=>{const k=normNome(ct.nome);if(ct.dataInicio&&(!contratoPorNome[k]||ct.dataInicio<contratoPorNome[k]))contratoPorNome[k]=ct.dataInicio});
  S.clientes.forEach(cli=>{
    const ativo=cli.ativo!==false&&STATUS_ATIVOS.includes(cli.statusAssinatura);
    const valor=round2(Number(cli.valorAtual)||0);
    const serieCli=(porCliente[cli.id]||[]).filter(x=>x.origemAssinatura);
    if(ativo&&valor>0){
      if(!serieCli.length){
        const dataRealInicio=contratoPorNome[normNome(cli.nome)]||cli.dataAdesao;
        const diaBase=dataRealInicio?Number(dataRealInicio.slice(8)):Number(hoje.slice(8));
        let venc=dateIn(Number(hoje.slice(0,4)),Number(hoje.slice(5,7)),diaBase);
        if(venc<hoje)venc=proxVencimento(venc,'mensal',diaBase);
        const nova={id:nextId('CRC'),serie:'ASSIN-'+cli.id,clienteId:cli.id,origemAssinatura:true,
          descricao:'Assinatura · '+(cli.nome||''),categoria:cli.planoAtual||'Assinatura',subcategoria:'',
          valor,vencimento:venc,status:'pendente',recorrente:true,frequencia:'mensal',diaBase,
          observacao:'Gerada automaticamente a partir da assinatura ativa do cliente.',contaBancaria:'',criadoEm:hoje,geradaAuto:true};
        L.push(nova);mudou=true;
      }else{
        serieCli.sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||''));
        const ultima=serieCli[serieCli.length-1];
        if(ultima.status==='pendente'&&(Math.abs((ultima.valor||0)-valor)>=0.01||ultima.categoria!==(cli.planoAtual||'Assinatura'))){
          ultima.valor=valor;ultima.categoria=cli.planoAtual||'Assinatura';ultima.descricao='Assinatura · '+(cli.nome||'');mudou=true;
        }
        serieCli.forEach(x=>{if(!x.recorrente&&x.status!=='pago'&&x.status!=='cancelado'){x.recorrente=true;mudou=true}});
      }
    }else if(serieCli.length){
      serieCli.forEach(x=>{if(x.recorrente){x.recorrente=false;mudou=true}});
    }
  });
  if(mudou)save();
  return mudou;
}
/* ---------------- Pausa de assinatura ----------------
   Pausa é decisão nossa (não vem de nenhum relatório importado): o cliente para de ser cobrado, mas a assinatura
   não é cancelada — status vira "Pausada" (fora de STATUS_ATIVOS), então sincronizarContasReceberAssinantes()
   já para a recorrência sozinha. Guardamos até quando é a pausa para lembrar de retomar/ligar antes de acabar. */
function abrirPausarCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  openModal(`<h2>Pausar assinatura</h2><div class="sub">${esc(c.nome)}${c.planoAtual?' · '+esc(c.planoAtual):''}</div>
  ${F('Duração da pausa',`<select id="f_pausadias"><option value="10">10 dias</option><option value="15" selected>15 dias</option><option value="25">25 dias</option><option value="custom">Outro (dias)</option></select>`)}
  <div id="pausa_custom_box" style="display:none">${F('Quantos dias',`<input type="number" id="f_pausadiascustom" min="1" value="30">`)}</div>
  <div class="tag">A cobrança recorrente para durante a pausa e volta sozinha quando você retomar. Você recebe um aviso no Painel um dia antes da pausa acabar.</div>
  <div class="err" id="f_err"></div>
  <div class="acts"><button class="btn ok" data-act="confirmarpausa" data-id="${id}">Pausar assinatura</button><button class="btn warn" data-act="fechar">Cancelar</button></div>`);
}
function confirmarPausarCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  const sel=val('f_pausadias');
  const dias=sel==='custom'?Number(val('f_pausadiascustom')):Number(sel);
  if(!(dias>0))return setErr('Informe quantos dias de pausa.');
  if(c.statusAssinatura!=='Pausada')c.statusAntesPausa=c.statusAssinatura||'Em dia';
  registrarTransicaoStatus(c,'Pausada',false);
  c.statusAssinatura='Pausada';c.pausaInicio=todayISO();c.pausaDias=dias;c.pausaFim=addDiasISO(todayISO(),dias);
  sincronizarContasReceberAssinantes();gerarRecorrenciasContas();save();closeModal();render();
  toast(`Assinatura pausada até ${fmtDate(c.pausaFim)}`);
}
async function retomarCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  const ok=await askConfirm(`Retomar a assinatura de ${c.nome}? A cobrança recorrente volta a partir de agora.`,[{t:'Retomar',v:1,cls:''},{t:'Cancelar',v:null}]);
  if(!ok)return;
  snap();
  const novoStatus=c.statusAntesPausa||'Em dia';
  registrarTransicaoStatus(c,novoStatus,false);
  c.statusAssinatura=novoStatus;
  delete c.pausaInicio;delete c.pausaFim;delete c.pausaDias;delete c.statusAntesPausa;
  sincronizarContasReceberAssinantes();gerarRecorrenciasContas();save();render();
  toast('Assinatura retomada');
}
/* Botão rápido "✅ Pago" na lista de Clientes (sobretudo útil filtrando por Atrasada/Pendente): sem abrir modal,
   já lança a receita certinho (mesma conta a receber que a importação/recorrência gera), tira o cliente de
   Atrasada, marca Em dia com a data de hoje, e alimenta o histórico de pontualidade de pagamento (para o perfil
   de retenção). Se por algum motivo não houver conta a receber pendente para esta assinatura (ex.: cliente sem
   valor cadastrado), só atualiza o status — sem inventar lançamento financeiro. */
function marcarPagoCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  const hoje=todayISO();
  sincronizarContasReceberAssinantes();
  const serie=S.contasReceber.filter(x=>x.clienteId===id&&x.origemAssinatura).sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||''));
  const pendente=serie.find(x=>x.status==='pendente');
  let lancou=false;
  if(pendente){
    const valorPago=round2(Number(c.valorAtual)||pendente.valor||0);
    const e={id:nextId('ENT'),grupo:'',data:hoje,mesRef:hoje.slice(0,7),valor:valorPago,fonte:pendente.categoria||'Assinaturas (Clube)',categoria:pendente.recorrente?'Fixa':'Variável',conta:pendente.contaBancaria||'',item:'',quantidade:1,descricao:pendente.descricao||('Assinatura · '+(c.nome||'')),recorrente:false,ativo:true,contaReceberId:pendente.id};
    S.entradas.push(e);
    pendente.status='pago';pendente.dataPagamento=hoje;pendente.valorPago=valorPago;pendente.entradaId=e.id;pendente.lancamentoCriado=true;
    registrarHistoricoPagamento(id,pendente.vencimento,hoje);
    lancou=true;
  }
  registrarTransicaoStatus(c,'Em dia',false);
  c.statusAssinatura='Em dia';
  c.ultimoPagamento=hoje;
  gerarRecorrenciasContas();sincronizarContasReceberAssinantes();save();render();
  toast(lancou?'Pagamento registrado — em dia a partir de hoje, receita lançada em Entradas':'Assinatura marcada como Em dia');
}
/* Histórico de pontualidade: cada pagamento registrado (pelo botão rápido "Pago" ou pela confirmação normal de
   uma conta a receber de assinatura) grava se veio antecipado, no dia ou atrasado — e com quantos dias. Isso vira
   o "perfil de pagamento" do cliente (pedido da Caroline), usado na hora de decidir a abordagem de retenção. */
function registrarHistoricoPagamento(clienteId,vencimento,dataPagamento){
  const cli=S.clientes.find(x=>x.id===clienteId);
  if(!cli||!vencimento||!dataPagamento)return;
  const dias=Math.round((new Date(dataPagamento+'T00:00:00')-new Date(vencimento+'T00:00:00'))/86400000);
  const classificacao=dias<0?'Antecipado':dias===0?'Em dia':'Atrasado';
  (cli.historicoPagamentos=cli.historicoPagamentos||[]).push({data:dataPagamento,vencimento,dias,classificacao});
  if(cli.historicoPagamentos.length>36)cli.historicoPagamentos=cli.historicoPagamentos.slice(-36);
}
function perfilPagamentoCliente(c){
  const H=(c&&c.historicoPagamentos)||[];
  if(!H.length)return null;
  const total=H.length;
  const nAntecipado=H.filter(h=>h.classificacao==='Antecipado').length;
  const nEmDia=H.filter(h=>h.classificacao==='Em dia').length;
  const nAtrasado=H.filter(h=>h.classificacao==='Atrasado').length;
  const atrasos=H.filter(h=>h.dias>0).map(h=>h.dias);
  const mediaAtrasoDias=atrasos.length?Math.round(atrasos.reduce((s,d)=>s+d,0)/atrasos.length):0;
  let tendencia;
  if(nAtrasado/total>=0.5)tendencia='Atrasa com frequência';
  else if(nAntecipado/total>=0.5)tendencia='Paga antecipado';
  else if((nAntecipado+nEmDia)/total>=0.8)tendencia='Pontual';
  else tendencia='Irregular';
  return {total,nAntecipado,nEmDia,nAtrasado,mediaAtrasoDias,tendencia,ultimos:H.slice(-6).slice().reverse()};
}
/* Bloco de perfil de pagamento no cadastro do cliente — só aparece quando já existe histórico. */
/* Cor do sinal de pontualidade — mesmo critério em 3 níveis usado na aba Clientes (selo na linha), no cadastro do
   cliente e no relatório agregado de Indicadores: verde = paga em dia/antecipado, amarelo = irregular (atrasa às
   vezes), vermelho = atrasa com frequência. */
function corPerfilPagamento(tendencia){return tendencia==='Atrasa com frequência'?'red':tendencia==='Irregular'?'amb':'green'}
/* Selo compacto para a linha do cliente na aba Clientes — só aparece com pelo menos 2 pagamentos no histórico
   (1 pagamento só não é padrão o suficiente para rotular, evita alarme falso). */
function seloPontualidadeHTML(c){
  const P=perfilPagamentoCliente(c);
  if(!P||P.total<2)return '';
  const cor=corPerfilPagamento(P.tendencia);
  const dot=dotStatus({red:'vermelho',amb:'amarelo',green:'verde'}[cor]);
  return ` <span class="pill ${cor==='red'?'atr':cor==='amb'?'prev':'pago'}" title="${P.total} pagamento(s): ${P.nAntecipado} antecipado(s), ${P.nEmDia} no dia, ${P.nAtrasado} atrasado(s)">${dot} ${esc(P.tendencia)}</span>`;
}

/* Levantamento agregado (pedido da Caroline): % de clientes que pagam em dia/antecipado, atrasam às vezes, ou
   atrasam com frequência — para dar transparência/projeção na hora de decidir investimento. Só entram clientes
   ativos com pelo menos 1 pagamento no histórico (sem inflar "sem dados" como se fosse um grupo à parte). */
function relatorioPontualidade(){
  const perfis=S.clientes.filter(c=>c.ativo!==false).map(c=>perfilPagamentoCliente(c)).filter(Boolean);
  const total=perfis.length;
  if(!total)return null;
  const cont={pontual:0,irregular:0,atrasaFreq:0};
  perfis.forEach(P=>{const cor=corPerfilPagamento(P.tendencia);if(cor==='red')cont.atrasaFreq++;else if(cor==='amb')cont.irregular++;else cont.pontual++});
  return {total,cont,fr:{pontual:cont.pontual/total,irregular:cont.irregular/total,atrasaFreq:cont.atrasaFreq/total}};
}
/* Seção de Indicadores pedida pela Caroline: transparência sobre quantos clientes pagam em dia/antecipado, atrasam
   às vezes, ou atrasam com frequência — para pesar decisão de investimento com uma projeção real de recebimento,
   não só o caixa do mês atual. */
function vPontualidadeIndicadoresHTML(){
  const R=relatorioPontualidade();
  if(!R)return '';
  const card=(lbl,valor,cls,formula)=>`<div class="card"><div class="lbl">${lbl}</div><div class="big ${cls||''}">${valor}</div><div class="formula">${formula}</div></div>`;
  return `<div class="sec-h">Pontualidade de pagamento</div>
  <div class="tag" style="margin-bottom:6px">Baseado no histórico de pagamentos confirmados (botão "Pago" ou recebimento de conta a receber de assinatura) — ${R.total} cliente(s) ativo(s) com pelo menos 1 pagamento registrado.</div>
  <div class="grid">
    ${card('Paga em dia/antecipado',pctFmt(R.fr.pontual,0),'pos',`${R.cont.pontual} de ${R.total} cliente(s)`)}
    ${card('Atrasa às vezes',pctFmt(R.fr.irregular,0),'amb',`${R.cont.irregular} de ${R.total} cliente(s)`)}
    ${card('Atrasa com frequência',pctFmt(R.fr.atrasaFreq,0),'neg',`${R.cont.atrasaFreq} de ${R.total} cliente(s)`)}
  </div>

}
/* Pedido da Caroline: "mês a mês... se o percentual do pessoal melhora de pagamento ou uma projeção de piora... para
   criar ações de antecipação". Mostra a tendência (últimos 6 meses) comparando o % pontual e o % que atrasa com
   frequência mês contra mês, com seta de melhora/piora — não só a foto do mês atual. */
function vPontualidadeHistoricoHTML(){
  const H=(S.historicoPontualidade||[]).slice(-6);
  if(H.length<2)return `<div class="tag" style="margin-top:8px">O histórico mês a mês aparece aqui a partir do 2º mês de uso — cada mês fica registrado automaticamente.</div>`;
  const nomeMes=r=>{const [y,m]=r.split('-');return MESES[Number(m)-1].slice(0,3)+'/'+y.slice(2)};
  const linhas=H.map((h,i)=>{
    const prev=i>0?H[i-1]:null;
    const dPontual=prev?Math.round(h.fr.pontual*100)-Math.round(prev.fr.pontual*100):null;
    const seta=dPontual===null?'':dPontual>0?`<span class="pos">▲ ${dPontual}pp</span>`:dPontual<0?`<span class="neg">▼ ${Math.abs(dPontual)}pp</span>`:`<span class="tag">= estável</span>`;
    const atual=h.mesRef===todayISO().slice(0,7);
    return `<tr>
      <td>${nomeMes(h.mesRef)}${atual?' <small class="tag">(em andamento)</small>':''}</td>
      <td>${h.total}</td>
      <td class="pos">${pctFmt(h.fr.pontual,0)}</td>
      <td class="amb">${pctFmt(h.fr.irregular,0)}</td>
      <td class="neg">${pctFmt(h.fr.atrasaFreq,0)}</td>
      <td>${seta}</td>
    </tr>`;
  }).join('');
  return `<div style="margin-top:10px;overflow:auto"><table class="tbl">
    <thead><tr><th>Mês</th><th>Clientes</th><th>Pontual</th><th>Irregular</th><th>Atraso freq.</th><th>Variação (pontual x mês anterior)</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table></div>`;
}
/* Despesa/entrada já lançada que parece ser a mesma conta (evita dupla contabilização). */
function acharLancamentoCorrespondente(t,c){
  if(!c.vencimento)return null;
  const ref=c.vencimento.slice(0,7);
  if(t==='contaPagar')return S.despesas.find(d=>d.ativo&&d.status!=='Pago'&&!d.contaPagarId&&d.mesRef===ref&&Math.abs((d.valor||0)-c.valor)<0.01&&((c.categoria&&normHead(d.categoria)===normHead(c.categoria))||normNome(d.descricao)===normNome(c.descricao)))||null;
  return S.entradas.find(e=>e.ativo&&!e.contaReceberId&&e.mesRef===ref&&Math.abs((e.valor||0)-c.valor)<0.01&&((c.categoria&&normHead(e.fonte)===normHead(c.categoria))||normNome(e.descricao)===normNome(c.descricao)))||null;
}
/* Itens da central de vencimentos: contas cadastradas + (em "pagar") despesas previstas da aba Despesas. */
function itensVencimentos(t,incluirDespesas){
  const out=[];const vinculadas=new Set();
  S[CP_LISTA[t]].forEach(c=>{
    const st=statusConta(c);
    const match=st!=='pago'&&st!=='cancelado'?acharLancamentoCorrespondente(t,c):null;
    if(match)vinculadas.add(match.id);
    out.push({origem:'conta',t,id:c.id,descricao:c.descricao,valor:c.valor,vencimento:c.vencimento,status:st,categoria:c.categoria,recorrente:c.recorrente,frequencia:c.frequencia,rec:c,match});
  });
  if(t==='contaPagar'&&incluirDespesas){
    S.despesas.forEach(d=>{
      if(!d.ativo||d.status==='Pago'||!d.vencimento||vinculadas.has(d.id))return;
      out.push({origem:'despesa',t:'despesa',id:d.id,descricao:d.descricao||d.subcategoria||d.categoria,valor:d.valor,vencimento:d.vencimento,status:d.vencimento<todayISO()?'atrasado':'pendente',categoria:d.categoria,recorrente:d.recorrente,rec:d});
    });
  }
  return out;
}
function resumoVencimentos(t){
  const hoje=todayISO(),d7=addDiasISO(hoje,7),fimMes=fimDoMesISO(hoje),iniMes=hoje.slice(0,7)+'-01';
  const L=itensVencimentos(t,true);
  const abertos=L.filter(x=>x.status==='pendente'||x.status==='atrasado');
  const at=abertos.filter(x=>x.status==='atrasado');
  const sem=abertos.filter(x=>x.vencimento>=hoje&&x.vencimento<=d7);
  const mes=abertos.filter(x=>x.vencimento>=hoje&&x.vencimento<=fimMes);
  const pagasMes=L.filter(x=>x.origem==='conta'&&x.status==='pago'&&(x.rec.dataPagamento||'')>=iniMes&&(x.rec.dataPagamento||'')<=fimMes);
  const tot=a=>round2(a.reduce((s,x)=>s+(x.valor||0),0));
  return {atrasadas:{n:at.length,v:tot(at)},semana:{n:sem.length,v:tot(sem)},mes:{n:mes.length,v:tot(mes)},pagasMes:{n:pagasMes.length,v:tot(pagasMes)}};
}

function confirmarPagamentoConta(t,id){
  const c=S[CP_LISTA[t]].find(x=>x.id===id);if(!c)return false;
  const pagar=t==='contaPagar';
  const data=val('f_cpdata')||todayISO();

function estornarConta(t,id){

  }
  if(!pagar&&c.entradaId){

  }
  c.status='pendente';delete c.dataPagamento;delete c.valorPago;delete c.despesaId;delete c.entradaId;c.lancamentoCriado=false;

/* ---------------- Churn: registro de transições de status ---------------- */
const STATUS_ATIVOS=['Em dia','Atrasada','Pendente'];
function registrarTransicaoStatus(c,novo,baseline){
  if(!c||!novo)return;
  const ant=c.statusAssinatura||'',hoje=todayISO();
  if(ant===novo)return;
  const eraAtivo=!!ant&&ant!=='Cancelada';
  const ficaAtivo=STATUS_ATIVOS.includes(novo);
  if(novo==='Cancelada'){
    if(eraAtivo&&!c.dataCancelamento)c.dataCancelamento=hoje;
    else if(!eraAtivo&&!c.dataCancelamento)c.canceladoAntesDoAcompanhamento=true;
  }else if(ficaAtivo&&!eraAtivo){
    if(ant==='Cancelada'&&c.dataCancelamento){
      (c.historicoCancelamentos=c.historicoCancelamentos||[]).push({dataAdesao:c.dataAdesao||'',dataCancelamento:c.dataCancelamento});
      delete c.dataCancelamento;c.dataAdesao=hoje;c.reativadoEm=hoje;
    }else if(baseline){if(!c.dataAdesao)c.adesaoAntesDoAcompanhamento=true}
    else if(!c.dataAdesao)c.dataAdesao=hoje;
  }
}

/* ---------------- Indicadores ---------------- */
function refsDoPeriodo(){
  if(V.range){const out=[];let [y,m]=[ym(V.range.de).y,ym(V.range.de).m];const fim=V.range.ate;
    for(let g=0;g<60;g++){const r=`${y}-${pad(m)}`;out.push(r);if(r>=fim)break;[y,m]=addMonths(y,m,1)}return out}
  return V.month==='all'?MESES.map((_,i)=>`${V.year}-${pad(i+1)}`):[`${V.year}-${pad(V.month)}`];
}
function mesFoco(){if(V.range){const hoje=todayISO().slice(0,7);return hoje>=V.range.de&&hoje<=V.range.ate?hoje:V.range.ate}if(V.month!=='all')return `${V.year}-${pad(V.month)}`;const t=todayISO().slice(0,7);return V.year===Number(t.slice(0,4))?t:`${V.year}-12`}
function nomeMes(ref){const [y,m]=ref.split('-').map(Number);return `${MESES[m-1]}/${y}`}
function mesesEntre(a,b){if(!a||!b)return null;const d=(new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000;return d>=0?d/30.4375:null}
function ehComissaoDesp(r){return normHead(r.subcategoria).startsWith('comiss')}
function tipoCustoDe(r){
  if(r.tipoCusto==='fixo'||r.tipoCusto==='variavel')return r.tipoCusto;
  if(r.categoria==='Pessoal'&&(ehComissaoDesp(r)||normHead(r.subcategoria).startsWith('bonific')||(r.colaborador&&nomesBarbeiros().has(r.colaborador))))return 'variavel';
  const cat=S.config.catList.find(c=>normHead(c.nome)===normHead(r.categoria));
  return cat&&cat.tipoCusto==='variavel'?'variavel':'fixo';
}
function assinantesCached(){
  if(!ASSIN_CACHE){try{ASSIN_CACHE=S.imp.contratos.length?computeAssinantes():{subs:[],naoConciliados:[]}}catch(e){ASSIN_CACHE={subs:[],naoConciliados:[]}}}
  return ASSIN_CACHE;
}
function baseAssinantes(){
  const subs=assinantesCached().subs;
  if(subs.length){const k=kpisAssinantes(subs);if(k.ativos)return {ativos:k.ativos,ticketMensal:k.ticket,mrr:k.mrr,fonte:'contratos ativos da Celcoin'}}
  const at=S.clientes.filter(c=>c.ativo!==false&&STATUS_ATIVOS.includes(c.statusAssinatura));
  const comValor=at.filter(c=>Number(c.valorAtual)>0);
  const mrr=round2(comValor.reduce((s,c)=>s+Number(c.valorAtual),0));
  return {ativos:at.length,ticketMensal:comValor.length?round2(mrr/comValor.length):0,mrr,fonte:at.length?'aba Clientes (status Em dia/Atrasada/Pendente)':''};
}
function calcIndicadores(){
  const refs=refsDoPeriodo(),refSet=new Set(refs),foco=mesFoco(),hoje=todayISO();
  const E=entP(),D=desP();
  const receita=round2(sum(E));
  const receitaOp=round2(sum(E.filter(r=>normHead(r.fonte)!=='receita financeira')));
  // --- Ticket médio por atendimento
  let atend=0,baseAtend='';
  const fq=S.imp.freq.filter(f=>refSet.has(f.mesRef));
  if(fq.length){atend=fq.reduce((s,f)=>s+(f.qtd||0),0);baseAtend='atendimentos da Frequência (Cash Barber)'}
  if(!atend){const ag=S.imp.agend.filter(a=>a.data&&refSet.has(a.data.slice(0,7))&&/finalizad/i.test(a.status));if(ag.length){atend=ag.length;baseAtend='agendamentos finalizados (Cash Barber)'}}
  const ticketAtend=atend?round2(receitaOp/atend):null;
  const B=baseAssinantes();
  // --- Churn (mês foco)
  const desde=S.config.churnDesde||hoje;
  const [fy,fm]=foco.split('-').map(Number),iniFoco=foco+'-01',fimFoco=iso(fy,fm,lastDay(fy,fm));
  const cancelEventos=[];
  S.clientes.forEach(c=>{if(c.dataCancelamento)cancelEventos.push({c,data:c.dataCancelamento,adesao:c.dataAdesao||''});(c.historicoCancelamentos||[]).forEach(h=>cancelEventos.push({c,data:h.dataCancelamento,adesao:h.dataAdesao||''}))});
  const cancelNoMes=cancelEventos.filter(e=>e.data>=iniFoco&&e.data<=fimFoco).length;
  const ativosHoje=S.clientes.filter(c=>c.ativo!==false&&STATUS_ATIVOS.includes(c.statusAssinatura)).length;
  const cancelDesdeIni=cancelEventos.filter(e=>e.data>=iniFoco).length;
  const novosDesdeIni=S.clientes.filter(c=>c.dataAdesao&&c.dataAdesao>=iniFoco).length;
  const ativosIni=ativosHoje+cancelDesdeIni-novosDesdeIni;
  let churn={insuficiente:true,motivo:''};
  if(fimFoco<desde)churn.motivo=`O acompanhamento de cancelamentos começou em ${fmtDate(desde)} — não há histórico confiável para ${nomeMes(foco)}.`;
  else if(foco>hoje.slice(0,7))churn.motivo=`${nomeMes(foco)} ainda não começou.`;
  else if(ativosIni<=0)churn.motivo='Nenhum assinante ativo registrado na aba Clientes (importe "Assinaturas no cartão" para acompanhar).';
  else churn={insuficiente:false,taxa:cancelNoMes/ativosIni,cancelados:cancelNoMes,ativosIni,parcial:desde>iniFoco||foco===hoje.slice(0,7)};
  // --- Permanência e LTV
  const medidos=cancelEventos.map(e=>mesesEntre(e.adesao,e.data)).filter(x=>x!=null);
  let permanencia=null,metodoPerm='';
  if(medidos.length>=3){permanencia=medidos.reduce((a,b)=>a+b,0)/medidos.length;metodoPerm=`medida: média de ${medidos.length} cancelamento(s) com data de adesão e de cancelamento`}
  else if(!churn.insuficiente&&churn.taxa>0){permanencia=1/churn.taxa;metodoPerm='estimada: 1 ÷ churn mensal'}
  else{
    const inicios=[];
    assinantesCached().subs.filter(s=>s.status==='Ativo'&&s.dataInicio).forEach(s=>inicios.push(s.dataInicio));
    if(!inicios.length)S.clientes.filter(c=>c.ativo!==false&&STATUS_ATIVOS.includes(c.statusAssinatura)).forEach(c=>{const d=c.dataAdesao||c.primeiraVezVista;if(d)inicios.push(d)});
    const ts=inicios.map(d=>mesesEntre(d,hoje)).filter(x=>x!=null);
    if(ts.length){permanencia=ts.reduce((a,b)=>a+b,0)/ts.length;metodoPerm=`piso: tempo médio dos ${ts.length} assinante(s) ativo(s) até hoje — ainda estão ativos, então o real será maior`}
  }
  const ltv=permanencia!=null&&B.ticketMensal>0?round2(B.ticketMensal*permanencia):null;
  // --- CAC (mês foco)
  const mktInformado=S.config.marketingMensal[foco];
  const mktDespesas=round2(sum(S.despesas.filter(r=>r.ativo&&r.mesRef===foco&&normHead(r.categoria)==='marketing')));
  const investMkt=mktInformado!=null&&mktInformado!==''?Number(mktInformado):mktDespesas;
  const fonteMkt=mktInformado!=null&&mktInformado!==''?'valor informado por você':'despesas da categoria Marketing do mês (informe o valor real abaixo, se for diferente)';
  const nomesNovos=new Set();
  S.clientes.forEach(c=>{if(c.dataAdesao&&c.dataAdesao.slice(0,7)===foco&&c.reativadoEm!==c.dataAdesao)nomesNovos.add(normNome(c.nome))});
  S.imp.contratos.forEach(k=>{if(k.dataInicio&&k.dataInicio.slice(0,7)===foco)nomesNovos.add(normNome(k.nome))});
  const novos=nomesNovos.size;
  const cac=novos?round2(investMkt/novos):null;
  const ltvCac=ltv!=null&&cac?round2(ltv/cac):null;
  const payback=cac&&B.ticketMensal>0?round2(cac/B.ticketMensal):null;
  // --- Ponto de equilíbrio (período selecionado)
  const Dcusto=D.filter(r=>normHead(r.categoria)!==normHead('Gastos Pessoais (Sócios)'));
  const porTipo={fixo:{},variavel:{}};
  const TX=taxasCartao(ymS=>refSet.has(ymS));
  Dcusto.forEach(r=>{if(normHead(r.subcategoria)==='maquininha / taxas'&&TX.meses.has(r.mesRef))return;const tp=tipoCustoDe(r),k=r.categoria||'Sem categoria';porTipo[tp][k]=(porTipo[tp][k]||0)+r.valor});
  if(TX.total>0)porTipo.variavel['Taxas de cartão / maquininha (automático)']=TX.total;
  const custoVar=round2(Object.values(porTipo.variavel).reduce((a,b)=>a+b,0));
  const custoFixo=round2(Object.values(porTipo.fixo).reduce((a,b)=>a+b,0));
  const mc=round2(receita-custoVar),mcPct=receita>0?mc/receita:null;
  const pe=mcPct&&mcPct>0?round2(custoFixo/mcPct):null;
  const cobertura=pe?receita/pe:null;
  const nMeses=refs.length;
  const peClientes=pe&&B.ativos&&mc>0?Math.ceil(custoFixo/(mc/B.ativos)):null;
  // --- Margem por produto/serviço
  const porItem={};
  E.filter(r=>r.item).forEach(r=>{const k=r.item;if(!porItem[k])porItem[k]={receita:0,qtd:0};porItem[k].receita+=r.valor;porItem[k].qtd+=(r.quantidade||1)});
  const margens=Object.entries(porItem).map(([nome,v])=>{
    const it=S.itens.find(i=>i.nome===nome);const cu=it&&it.custoUnitario!==''&&it.custoUnitario!=null?Number(it.custoUnitario):null;
    const custo=cu!=null?round2(cu*v.qtd):null;
    return {nome,tipo:it?it.tipo:'—',receita:round2(v.receita),qtd:v.qtd,custo,margem:custo!=null?round2(v.receita-custo):null,margemPct:custo!=null&&v.receita>0?(v.receita-custo)/v.receita:null};
  }).sort((a,b)=>b.receita-a.receita);
  return {refs,foco,receita,receitaOp,atend,baseAtend,ticketAtend,B,churn,desde,permanencia,metodoPerm,ltv,investMkt,fonteMkt,mktInformado,mktDespesas,novos,cac,ltvCac,payback,
    custoVar,custoFixo,mc,mcPct,pe,cobertura,peClientes,porTipo,nMeses,margens};
}
const pctFmt=(x,d=1)=>x==null||isNaN(x)?'—':(x*100).toFixed(d).replace('.',',')+'%';
const numFmt=(x,d=1)=>x==null||isNaN(x)?'—':Number(x).toFixed(d).replace('.',',');

    ${card('Margem de contribuição',pctFmt(I.mcPct),I.mcPct!=null&&I.mcPct<0?'neg':'',`<code>(receita − custos variáveis) ÷ receita</code> = (${brl(I.receita)} − ${brl(I.custoVar)}) ÷ ${brl(I.receita)}`)}

  :'<div class="empty"><b>Sem vendas vinculadas a produto/serviço no período</b>Ao lançar uma entrada, preencha "Produto ou serviço vendido" e cadastre o custo unitário do item em Produtos — aí a margem aparece aqui. Não estimamos números sem esses dados.</div>'}`;
}

/* ---------------- Comissões ---------------- */
function calcComissoes(){
  const E=entP(),total=round2(sum(E));
  const idsColab=new Set(S.colaboradores.map(c=>c.id));
  const vinc=E.filter(r=>r.colaboradorId&&idsColab.has(r.colaboradorId));
  const valorVinc=round2(sum(vinc));
  const D=desP();
  const porColab={};
  // atendimentos (comandas) ligados ao barbeiro no período — inclui os de R$ 0,00 (assinante: a mensalidade já cobre o corte)
  const visitasPer=(S.imp.comandas||[]).filter(v=>v.colaboradorId&&v.data&&inP(v.data.slice(0,7)));
  S.colaboradores.forEach(c=>{
    const base=round2(sum(vinc.filter(r=>r.colaboradorId===c.id)));
    const pct=Number(c.comissaoPct)||0;
    const calculada=round2(base*pct/100);
    const lancada=round2(sum(D.filter(r=>r.colaborador===c.nome&&r.categoria==='Pessoal'&&ehComissaoDesp(r))));
    const vs=visitasPer.filter(v=>v.colaboradorId===c.id);
    porColab[c.id]={base,pct,calculada,lancada,diferenca:round2(calculada-lancada),n:vinc.filter(r=>r.colaboradorId===c.id).length,visitas:vs.length,visitasPagas:vs.filter(v=>v.valor>0).length,visitasAssin:vs.filter(v=>!(v.valor>0)).length};
  });
  const semVinculoAssin=round2(sum(E.filter(r=>!(r.colaboradorId&&idsColab.has(r.colaboradorId))&&r.fonte==='Assinaturas (Clube)')));
  // lançamentos de comandas que ficaram sem barbeiro porque foram importados ANTES da ligação automática (sem o campo "profissional")
  const antigos=E.filter(r=>r.origemExtrato&&!r.profissional&&!(r.colaboradorId&&idsColab.has(r.colaboradorId))&&r.fonte!=='Assinaturas (Clube)'&&/^(comanda|cr[eé]dito|d[eé]bito|pix|dinheiro)\s+—/i.test(r.descricao||'')); // só comandas de verdade; pagamento de assinatura vindo da Celcoin (sem cliente/barbeiro) não entra aqui
  return {total,valorVinc,nTotal:E.length,nVinc:vinc.length,pctSemVinculo:total>0?(total-valorVinc)/total:null,semVinculoAssin,semProfN:antigos.length,semProfV:round2(sum(antigos)),porColab};
}
function vVinculoProfissionais(){
  const vistos={};
  (S.imp.comandas||[]).forEach(c=>{if(c.profissional&&!ehNA(c.profissional))vistos[c.profissional]=(vistos[c.profissional]||0)+1});
  const L=Object.keys(vistos).sort();
  if(!L.length)return `<div class="hint" style="margin-bottom:12px">Importe o relatório de <b>comandas</b> (de novo, se já importou) pra o app ligar cada atendimento ao barbeiro e calcular a comissão sozinho.</div>`;
  return `<div class="card" style="margin-bottom:12px"><h3>Barbeiros do Cash Barber → colaborador</h3>
    <div class="hint">O relatório de comandas traz o nome do profissional. Confira a quem cada um corresponde; a comissão é calculada sozinha a cada importação.</div>
    ${L.map(p=>{const c=colaboradorDoProfissional(p);return `<div class="row" style="cursor:default;gap:8px;flex-wrap:wrap"><div class="rm" style="min-width:150px"><b>${esc(p)}</b><small>${vistos[p]} atendimento(s) importado(s)${c?'':' · <b>sem colaborador</b>'}</small></div><select data-act="vincprof" data-prof="${esc(p)}" style="max-width:200px"><option value="">— sem comissão —</option>${S.colaboradores.map(x=>`<option value="${esc(x.id)}" ${c&&c.id===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>`}).join('')}</div>`;
}

  return `<div class="card" style="margin-bottom:12px"><h3>Comissão calculada — ${tituloPeriodoDRE()}</h3>
