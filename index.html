    {titulo:'D+3 · Diagnóstico — novo membro (direto)',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nVi que sua renovação ainda não foi concluída e queria entender se aconteceu alguma coisa nesse início de experiência com o Club.\n\nFoi apenas uma questão de organização do pagamento ou teve algum ponto na sua rotina, horários, app ou atendimentos que acabou dificultando sua continuidade?\n\nSeu feedback é muito importante para nós porque, entendendo o que aconteceu, consigo te orientar e buscar a melhor solução por aqui.\n\nSe precisar de qualquer auxílio, conta comigo.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'D+3 · Diagnóstico — membro histórico (aberto)',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando sua renovação e percebi que ela ainda não foi concluída. Como você já está conosco há algum tempo, quis te chamar para entender se aconteceu alguma coisa ou se mudou algo na sua rotina nesse período.\n\nPode ser apenas uma questão de organização do pagamento, mas também queria saber se teve alguma dificuldade com horários, agenda, uso do app, frequência ou até algum ponto da experiência no Club que possamos melhorar.\n\nSeu feedback é muito importante para nós porque, entendendo o que aconteceu, consigo te auxiliar de uma forma mais adequada e buscar uma solução que faça sentido para o seu momento.\n\nQuando puder, me dá um retorno por aqui.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'D+3 · Diagnóstico — membro histórico (curto)',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando sua renovação e quis saber se está tudo certo por aí.\n\nComo você já está conosco há algum tempo, percebi que esse ciclo ficou diferente do seu histórico e queria entender se foi apenas a correria dos últimos dias ou se mudou alguma coisa na sua rotina, frequência ou experiência com o Club.\n\nSe tiver algum ponto em que eu possa ajudar — agenda, aplicativo, atendimento ou até organização da renovação — me conta por aqui.\n\nSeu retorno é importante para conseguirmos entender seu momento e te auxiliar da melhor forma.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'D+3 · Áudio (histórico com vínculo forte — substitui o texto)',dia:3,canal:'Áudio',variacoes:[`Oi, [Nome], tudo bem? Aqui é a Caroline, do Barbarossa.\n\nResolvi te mandar um áudio rapidinho porque percebi que sua renovação ainda não foi concluída e, como você já está conosco há um tempo, quis entender se está tudo certo por aí.\n\nÀs vezes muda a rotina, os horários deixam de encaixar ou acontece alguma coisa na experiência que a gente não fica sabendo.\n\nEntão, mais do que falar só do pagamento, queria entender se aconteceu alguma coisa ou se existe algo em que eu possa te ajudar.\n\nQuando puder, me dá um retorno por aqui.`]},
    {titulo:'D+5 · Humanizar — novo membro (áudio, 30-45s)',dia:5,canal:'Áudio',variacoes:[`Oi, [Nome], tudo bem? Aqui é a Caroline, do Barbarossa.\n\nResolvi te mandar um áudio rapidinho porque, como você ainda está nos primeiros meses do Club, eu queria entender um pouco melhor como foi sua experiência conosco até aqui.\n\nVi que sua renovação ainda não foi concluída e não consegui falar contigo, então queria saber se foi só uma questão de correria ou pagamento, ou se aconteceu alguma coisa na rotina, nos atendimentos, na agenda ou até no uso do app que acabou dificultando sua continuidade.\n\nSe tiver algo que a gente possa ajustar ou facilitar pra você, pode me falar.\n\nQuero realmente entender seu momento e ver como consigo te ajudar.`]},
    {titulo:'D+5 · Humanizar — membro histórico (áudio, 30-45s)',dia:5,canal:'Áudio',variacoes:[`Oi, [Nome], tudo bem? Aqui é a Caroline, do Barbarossa.\n\nResolvi te mandar um áudio porque você já está conosco há um tempo e percebi que sua renovação ainda não foi concluída.\n\nMais do que simplesmente falar sobre o pagamento, eu queria saber se mudou alguma coisa na sua rotina ou na forma como você vem utilizando o Club.\n\nPode ser questão de horário, frequência, agenda, ou até algum ponto da experiência que a gente ainda não saiba.\n\nSe aconteceu alguma coisa, pode me contar.\n\nQuero entender seu momento e ver se existe alguma forma de te ajudar por aqui.`]},
    {titulo:'D+7 · Solução conforme motivo confirmado',dia:7,canal:'WhatsApp',variacoes:[`A solução nasce do diagnóstico do D+3/D+5. Regra: uma solução principal, no máximo uma alternativa — nunca apresentar todos os planos, vários preços ou várias ofertas. Se o membro já respondeu antes, não esperar o D+7: aplicar a solução assim que o motivo for identificado.`]},
    {titulo:'D+12 · Follow-up seletivo (não usar para todos)',dia:12,canal:'WhatsApp',variacoes:[`Usar apenas quando houver: histórico relevante, bom vínculo, membro novo com potencial, alto interesse de recuperação, ou conversa iniciada e não concluída. Pode ser texto curto, áudio ou ligação excepcional. Objetivo: fechar uma tratativa que ainda tem possibilidade real de recuperação.`]},
    {titulo:'D+15 · Decisão',dia:15,canal:'WhatsApp',variacoes:[`O caso não fica indefinidamente em aberto. Classificar como: regularizado, negociação, pausa, migração, cancelamento, encerrado, contas a receber, ou win-back futuro.`]}
  ]},
  {nome:'Assinatura atrasada — Boleto',gatilho:'Boleto do ciclo ainda em aberto no Ceilcoin',etapas:[
    {titulo:'D-3 · Lembrete e envio dos dados',dia:-3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem? 🙂\n\nEste é um lembrete automático do Club para te ajudar a acompanhar sua renovação.\n\nA fatura da sua assinatura já está disponível e o vencimento será no dia [data].\n\nComo o pagamento por boleto é processado em nosso sistema financeiro, separado do aplicativo CashBarber, estou deixando os dados por aqui para facilitar:\n\nBoleto: [link]\nVencimento: [data]\nValor da renovação: R$ [valor]\n\nSe preferir, o pagamento também pode ser realizado via Pix:\n\nChave Pix — CNPJ: 34.293.331/0001-89\n\nDepois do pagamento, se puder nos encaminhar o comprovante pelo WhatsApp, conseguimos conferir e manter sua renovação atualizada por aqui.\n\nSe precisar de ajuda, nossa equipe fica à disposição.\n\nSocial Club Barbarossa`]},
    {titulo:'D0 · Sem próximo agendamento',dia:0,canal:'WhatsApp',variacoes:[`Olá, (nome). Tudo bem? 🙂\n\nAqui quem fala é o Giordan, do Setor Financeiro do Club Barbarossa.\n\nEste é um lembrete automático do Club para te avisar que HOJE é a data da renovação da sua assinatura.\n\nSegue abaixo o link para acessar a sua fatura.\n\nSe preferir, o pagamento também pode ser realizado via Pix:\nChave Pix: 34293331000189\n\nApós o pagamento, se puder me encaminhar o comprovante por aqui, consigo conferir e manter sua renovação atualizada no sistema.\n\nSe precisar que eu reenvie alguma informação ou tiver qualquer dificuldade, fico à disposição.\n\nAtt- Social Club Barbarossa`]},
    {titulo:'D0 · Com próximo agendamento',dia:0,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem? 🙂\n\nEste é um lembrete automático do Club para te avisar que hoje é a data da renovação da sua assinatura.\n\nCaso você já tenha realizado o pagamento por boleto, pode nos encaminhar o comprovante por aqui. Assim conseguimos conferir e manter sua renovação atualizada no sistema.\n\nComo você já possui um próximo atendimento agendado, deixamos este aviso para ajudar na organização da sua renovação antes da sua próxima visita ao Club.\n\nSe precisar de qualquer ajuda, nossa equipe está à disposição.\n\nSocial Club Barbarossa`]},
    {titulo:'D+2 · Conciliação (manual)',dia:2,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou fazendo uma conferência das renovações por aqui e a sua ainda aparece em aberto no sistema.\n\nComo o boleto é processado em nosso sistema financeiro separado do CashBarber, pode acontecer de o pagamento ainda não estar identificado por aqui.\n\nSe você já realizou, pode me encaminhar o comprovante? Assim consigo conferir e atualizar sua renovação.\n\nSe ainda não conseguiu realizar, me avisa que posso reenviar os dados de pagamento e te auxiliar por aqui.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]},
    {titulo:'D+3 · Diagnóstico — novo membro',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nVi que sua renovação ainda não foi concluída e queria entender se aconteceu alguma coisa nesse início de experiência com o Club.\n\nFoi apenas uma questão de organização do pagamento ou teve algum ponto na sua rotina, horários, app ou atendimentos que acabou dificultando sua continuidade?\n\nSeu feedback é muito importante para nós porque, entendendo o que aconteceu, consigo te orientar e buscar a melhor solução por aqui.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'D+3 · Diagnóstico — membro histórico',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando sua renovação e quis saber se está tudo certo por aí.\n\nComo você já está conosco há algum tempo, percebi que esse ciclo ficou diferente do seu histórico e queria entender se foi apenas a correria dos últimos dias ou se mudou alguma coisa na sua rotina, frequência ou experiência com o Club.\n\nSe tiver algum ponto em que eu possa ajudar, me conta por aqui.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'D+5 · Humanizar (áudio)',dia:5,canal:'Áudio',variacoes:[`Oi, [Nome], tudo bem? Aqui é a Caroline, do Barbarossa.\n\nResolvi te mandar um áudio rapidinho porque queria falar contigo de uma forma mais pessoal 🙂. Vi que sua renovação ainda não foi concluída — queria saber se foi só uma questão de organização do boleto ou se aconteceu alguma coisa na sua rotina que dificultou.\n\nSe tiver algo em que eu possa ajudar, me conta por aqui.`]},
    {titulo:'D+7 · Solução conforme motivo confirmado',dia:7,canal:'WhatsApp',variacoes:[`A solução nasce do diagnóstico do D+3/D+5. Uma solução principal, no máximo uma alternativa. Se já respondeu antes, aplicar a solução imediatamente, sem esperar o D+7.`]},
    {titulo:'D+15 · Decisão',dia:15,canal:'WhatsApp',variacoes:[`Classificar: regularizado, negociação, pausa, migração, cancelamento, encerrado, contas a receber ou win-back futuro.`]}
  ]},
  {nome:'Pix enviado / Pagamento não confirmado',gatilho:'Membro informou que pagaria via Pix, mas o pagamento ainda não foi identificado',etapas:[
    {titulo:'Regra da promessa',dia:0,canal:'WhatsApp',variacoes:[`Ao registrar uma promessa ("Pago sexta-feira", "vou fazer via Pix"), suspender WhatsApp, e-mail e follow-up até o prazo combinado. Não enviar cobrança genérica antes da data prometida.`]},
    {titulo:'Acompanhar o combinado',dia:2,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nSó passando para acompanhar sua renovação por aqui.\n\nComo você comentou que faria o pagamento via Pix, queria confirmar se conseguiu realizar.\n\nCaso já tenha feito, pode me encaminhar o comprovante? Assim consigo conferir e atualizar sua assinatura no sistema.\n\nSe ainda não conseguiu realizar, sem problema. Se precisar que eu reenvie a chave Pix, fico à disposição.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]},
    {titulo:'Promessa vencida',dia:5,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando sua renovação por aqui e, como você comentou que realizaria o pagamento, fiz uma nova conferência no sistema, mas ele ainda não apareceu como identificado.\n\nCaso você já tenha efetuado, pode me encaminhar o comprovante?\n\nAssim consigo conferir e deixar sua renovação atualizada.\n\nSe ainda não conseguiu realizar, me avisa que te auxilio com os dados de pagamento.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]}
  ]},
  {nome:'Cartão com falha',gatilho:'Tentativa de cobrança no cartão recorrente não foi concluída',etapas:[
    {titulo:'Falha recuperável (retry automático do CashPag)',dia:0,canal:'E-mail',variacoes:[`Quando o CashPag admitir novo processamento conforme sua configuração: apenas acompanhar. NÃO enviar WhatsApp a cada tentativa, NÃO assumir intenção de cancelamento, NÃO abrir diagnóstico D+3 enquanto ainda existe problema técnico ativo.`]},
    {titulo:'Falha que exige intervenção',dia:1,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando a renovação da sua assinatura e, na tentativa de pagamento pelo cartão cadastrado, o sistema não conseguiu concluir a transação.\n\nPara facilitar, podemos organizar sua renovação da forma que ficar mais prática:\n• posso te encaminhar uma opção de pagamento via Pix;\n• posso enviar um link para pagamento via cartão referente a esta renovação;\n• ou você pode realizar o pagamento diretamente na recepção do Club, via Pix, dinheiro, crédito ou débito.\n\nPara as próximas renovações, caso queira atualizar o cartão cadastrado, você pode fazer isso pelo app ou diretamente na recepção.\n\nMe avisa qual opção fica melhor para você que eu te auxilio por aqui.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]},
    {titulo:'Cartão negado pela operadora',dia:1,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nPassando para te avisar sobre a renovação da sua assinatura.\n\nNa tentativa de processamento no cartão cadastrado, a operadora não conseguiu concluir a transação.\n\nEsse aviso é para que você tenha conhecimento e possa escolher a forma mais prática de organizar a renovação.\n\nVocê pode verificar o cartão cadastrado ou, se preferir, posso te encaminhar outra forma de pagamento.\n\nMe avisa o que fica melhor para você que te auxilio por aqui.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]},
    {titulo:'Segurança do cartão',dia:0,canal:'E-mail',variacoes:[`Nunca solicitar pelo WhatsApp ou e-mail: número completo do cartão, CVV ou outros dados sensíveis. Atualizações de cartão só pelo app, link seguro ou na recepção.`]}
  ]},
  {nome:'Cliente sumido / Baixa frequência',gatilho:'Queda de frequência ou ausência prolongada, mesmo com pagamento em dia',etapas:[
    {titulo:'Referência de dias sem visitar',dia:0,canal:'WhatsApp',variacoes:[`Consultar no CashBarber: último atendimento, intervalo entre atendimentos, próximos horários, cancelamentos, no-show, profissionais e vínculo. Referências iniciais: 7, 14, 21 e 30 dias — evoluir gradualmente para o padrão individual do membro. Pagamento em dia não significa ausência de risco: quem paga e não usa também pode estar em risco de churn.`]},
    {titulo:'Diagnóstico — novo membro',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando sua renovação por aqui e percebi que ela ainda não foi concluída. Como você ainda está nos primeiros meses conosco, queria aproveitar para entender como está sendo sua experiência com o Club até aqui.\n\nÀs vezes pode ser apenas uma questão de organização do pagamento, mas também pode acontecer alguma mudança de rotina, dificuldade para encontrar um horário, utilizar o app ou até algum ponto nos atendimentos que não tenha ficado como você esperava.\n\nSe aconteceu alguma coisa ou se existe algo em que possamos te ajudar, fica à vontade para me contar.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'Diagnóstico — membro histórico',dia:3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou acompanhando sua renovação e percebi que ela ainda não foi concluída. Como você já está conosco há algum tempo, quis te chamar para entender se aconteceu alguma coisa ou se mudou algo na sua rotina nesse período.\n\nPode ser apenas uma questão de organização do pagamento, mas também queria saber se teve alguma dificuldade com horários, agenda, uso do app, frequência ou até algum ponto da experiência no Club que possamos melhorar.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]},
    {titulo:'Solução — adequar o plano',dia:7,canal:'WhatsApp',variacoes:[`Se o motivo confirmado for baixa utilização, avaliar adequação do plano: Club One ou Club Week. Não dizer apenas "temos um plano mais barato" — dizer "podemos avaliar um formato mais compatível com sua rotina atual".`]}
  ]},
  {nome:'Pausa terminando / Pausa em andamento',gatilho:'Pausa da assinatura com retorno previsto se aproximando (adaptado — o POP não traz script literal para esta situação)',etapas:[
    {titulo:'Quando usar pausa',dia:0,canal:'WhatsApp',variacoes:[`Utilizar quando o motivo for temporário: viagem, férias, reorganização financeira, trabalho fora, mudança provisória. Registrar: motivo, início, retorno e próxima ação.`]},
    {titulo:'Lembrete de retomada (adaptado, sem script literal no POP)',dia:-3,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem? 🙂\n\nPassando para avisar que sua pausa no Club está terminando no dia [data] e sua assinatura volta a ficar ativa normalmente.\n\nSe quiser continuar pausado por mais um tempo ou ajustar alguma coisa, é só me avisar por aqui que já deixamos organizado.\n\nSocial Club Barbarossa`]},
    {titulo:'Retorno da pausa — organizar atendimento',dia:0,canal:'WhatsApp',variacoes:[`Olá, [Nome]! Sua assinatura já está ativa novamente. Quer que eu já veja um horário disponível para o seu próximo atendimento? 🙂`]}
  ]},
  {nome:'Cancelamento solicitado (cancel-save)',gatilho:'Membro pediu para cancelar a assinatura',etapas:[
    {titulo:'1. Identificar o motivo',dia:0,canal:'WhatsApp',variacoes:[`Perguntar de forma aberta o que motivou o pedido de cancelamento, antes de qualquer solução.`]},
    {titulo:'2. Classificar',dia:0,canal:'WhatsApp',variacoes:[`Classificar o motivo: financeiro, frequência, rotina, agenda, app, experiência, barbeiro, mudança de cidade, preço, sem interesse, outro.`]},
    {titulo:'3. Apresentar solução coerente',dia:0,canal:'WhatsApp',variacoes:[`Uma solução principal, coerente com o motivo identificado — sem empurrar múltiplas ofertas.`]},
    {titulo:'4. Respeitar a decisão',dia:0,canal:'WhatsApp',variacoes:[`Se o membro mantiver a decisão, não criar barreiras desnecessárias. Encerramento respeitoso protege o win-back futuro.`]}
  ]},
  {nome:'Win-back — membro sumido / sem resposta',gatilho:'Membro histórico cancelou ou sumiu e já recebeu convite/oferta sem responder',etapas:[
    {titulo:'Regra',dia:0,canal:'WhatsApp',variacoes:[`Membro que saiu não é um lead frio: usar histórico, Club anterior, frequência, barbeiro, motivo e experiência anteriores. Se já recebeu convite, oferta, novo barbeiro ou migração sem resposta, não continuar vendendo — o objetivo passa a ser reconectar.`]},
    {titulo:'Reconexão (áudio)',dia:0,canal:'Áudio',variacoes:[`Oi, [Nome], tudo bem? Aqui é a Caroline, do Barbarossa.\n\nResolvi te mandar um áudio porque faz um tempinho que a gente não te vê por aqui e eu queria falar contigo de uma forma um pouco mais pessoal.\n\nMais do que simplesmente te chamar para voltar, eu queria entender se aconteceu alguma coisa nesse período.\n\nSe foi uma mudança de rotina, se o formato do Club deixou de fazer sentido pra você ou até se teve algum ponto da sua experiência conosco que não ficou como você esperava.\n\nEsse retorno é realmente importante pra gente.\n\nE, se fizer sentido retomar seus cuidados conosco, vou ficar muito feliz em te ajudar a organizar esse retorno.`]}
  ]},
  {nome:'Novo membro — Onboarding',gatilho:'Primeiros 90 dias do membro',etapas:[
    {titulo:'Acompanhamento onboarding',dia:0,canal:'WhatsApp',variacoes:[`Durante os primeiros 90 dias, acompanhar: primeiro atendimento, feedback, segundo atendimento, frequência e primeira renovação. Risco principal: early churn.`]},
    {titulo:'Feedback pós 1º atendimento (24-48h depois)',dia:2,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nQueria saber como foi sua primeira experiência como membro do Social Club Barbarossa.\n\nComo você se sentiu com o atendimento, o serviço e a experiência no Club?\n\nSeu retorno é muito importante para nós, principalmente nesse início, para entendermos se está tudo alinhado com o que você esperava e se existe algum ponto em que podemos melhorar.\n\nE, se quiser, posso te ajudar a organizar seu próximo atendimento e verificar alguns horários para os próximos dias.\n\nCaroline — Relacionamento com Membros — Social Club Barbarossa`]}
  ]},
  {nome:'Agendamento/atendimento com renovação em aberto (Prioridade 1)',gatilho:'Membro tem atendimento agendado ou já realizado, mas a renovação do ciclo está em aberto',etapas:[
    {titulo:'Agendamento + renovação em aberto',dia:0,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nVi que você tem atendimento agendado para [dia], às [horário], com o [Barbeiro].\n\nNa conferência da sua assinatura, a renovação deste ciclo ainda consta em aberto no sistema.\n\nCaso você já tenha realizado o pagamento, pode me encaminhar o comprovante? Assim consigo conferir e atualizar antes do seu atendimento.\n\nSe ainda não realizou, podemos organizar a renovação antes do seu horário, por aqui ou diretamente na recepção do Club.\n\nDessa forma, deixamos tudo alinhado para que seu atendimento siga normalmente dentro da assinatura.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]},
    {titulo:'Atendimento realizado + renovação em aberto',dia:0,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou fazendo a conferência das renovações por aqui e vi que o seu atendimento já foi realizado, mas a renovação deste ciclo ainda consta em aberto no sistema.\n\nCaso você já tenha efetuado o pagamento, pode me encaminhar o comprovante? Assim consigo conferir e atualizar sua assinatura.\n\nSe ainda não conseguiu realizar, me avisa que posso te auxiliar com a forma de pagamento e deixar tudo organizado por aqui.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]},
    {titulo:'Membro histórico com histórico de atrasos',dia:0,canal:'WhatsApp',variacoes:[`Olá, [Nome]. Tudo bem?\n\nEstou fazendo a conferência das renovações e verifiquei que a sua ainda consta em aberto no sistema.\n\nComo o atendimento deste ciclo já foi realizado, preciso deixar essa renovação organizada por aqui.\n\nCaso você já tenha efetuado o pagamento, pode me encaminhar o comprovante? Assim consigo conferir e atualizar sua assinatura.\n\nSe ainda não conseguiu realizar, me avisa que posso te reenviar os dados de pagamento e facilitar por aqui.\n\nCaroline — Relacionamento com Membros e Financeiro — Social Club Barbarossa`]}
  ]},

/* Copia texto para a área de transferência, com fallback para navegadores/contextos sem permissão */
async function copiarTexto(texto){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(texto);return true}
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=texto;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
    ta.focus();ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false}
}
function seedReguasPOP(){

/* Acha, dentro de uma régua, a etapa cujo "dia" mais se aproxima da situação real do cliente (dias de
   atraso, dias sem visitar, dias de casa) — sem isso, toda régua nova começava sempre do zero (D-3),
   mesmo pra alguém que já está há 20 dias atrasado, o que não faz sentido. Quando há mais de uma etapa
   no mesmo dia (variações de texto pro mesmo momento), pega a primeira — dá pra trocar manualmente.*/
function etapaMaisAdequada(reguaObj,diasRef){
  if(!reguaObj||!reguaObj.etapas.length)return 0;
  if(diasRef==null||isNaN(diasRef))return 0;
  let melhorIdx=0,melhorDia=-Infinity;
  reguaObj.etapas.forEach((et,i)=>{
    const d=Number(et.dia);
    if(!isNaN(d)&&d<=diasRef&&d>melhorDia){melhorDia=d;melhorIdx=i}
  });
  return melhorIdx;
}
/* Lista de réguas candidatas pra situação do cliente — nunca uma só quando a escolha certa depende de
   algo que os relatórios não trazem (forma de pagamento: cartão, boleto ou manual). Cada candidata já
   vem com o "diasRef" certo pra calcular a etapa inicial adequada, e uma explicação do porquê. */
function sugerirReguasCandidatas(s){
  const txt=(s.motivos||[]).join(' ').toLowerCase();
  const temPagamentoEmAberto=/pagamento|atrasad|não autorizado|nao autorizado|promessa/.test(txt);
  if(s.proximoAgendamento&&temPagamentoEmAberto)
    return [{regua:'Agendamento/atendimento com renovação em aberto (Prioridade 1)',diasRef:null,porque:'Já tem atendimento marcado ou feito — isso vem antes de qualquer cobrança.'}];
  if(s.status==='Cancelado')
    return [{regua:'Win-back — membro sumido / sem resposta',diasRef:null,porque:'Assinatura cancelada — aqui é reconquista, não cobrança.'}];
  if(s.tipoCliente==='Sem assinatura')
    return [{regua:'Sem assinatura — estimular recorrência',diasRef:s.diasSemVisita,porque:`${s.diasSemVisita||0} dia(s) sem aparecer, sem assinatura formal.`}];
  if(s.dataInicio){
    const diasCasa=Math.round((new Date(todayISO()+'T00:00:00')-new Date(s.dataInicio+'T00:00:00'))/86400000);
    if(diasCasa>=0&&diasCasa<=90&&!temPagamentoEmAberto)
      return [{regua:'Novo membro — Onboarding',diasRef:diasCasa,porque:`Entrou há ${diasCasa} dia(s) — ainda no período de adaptação.`}];
  }
  if(temPagamentoEmAberto){
    const dAtraso=s.diasAtraso||0,quando=dAtraso>0?`há ${dAtraso}d`:'(atrasado no Cash Barber, sem data de vencimento)';
    // Quando o histórico de comandas já mostra como esse cliente costuma pagar a assinatura (sinal
    // "Pagamento externo" do Cash Barber), não precisa perguntar — já aponta a régua certa direto.
    if(s.formaProvavel==='cartao')
      return [{regua:'Assinatura atrasada — Cartão recorrente',diasRef:dAtraso,porque:`Pagamento em aberto ${quando}. Ele paga no cartão recorrente (Cash Pag / cartão Celcoin).`}];
    if(s.formaProvavel==='externo')
      return [{regua:'Assinatura atrasada — Boleto',diasRef:dAtraso,porque:`Pagamento em aberto ${quando}. Ele paga por fora do cartão (Pix/boleto/manual).`}];
    return [
      {regua:'Assinatura atrasada — Cartão recorrente',diasRef:dAtraso,porque:`Pagamento em aberto ${quando} — use se ele paga no cartão recorrente.`},
      {regua:'Assinatura atrasada — Boleto',diasRef:dAtraso,porque:`Mesma situação — use pra qualquer pagamento que não seja no cartão recorrente (boleto, Pix, transferência, manual — é tudo a mesma régua).`},
      {regua:'Cartão com falha',diasRef:null,porque:'Use se a cobrança no cartão foi tentada e recusada (diferente de simplesmente ainda não ter vencido).'},
      {regua:'Pix enviado / Pagamento não confirmado',diasRef:null,porque:'Use se ele avisou que já pagou por Pix e está esperando confirmar.'}
    ];
  }
  if(/dias sem visitar|queda de frequ|faltas recentes|trocou de barbeiro/.test(txt))
    return [{regua:'Cliente sumido / Baixa frequência',diasRef:s.diasSemVisita,porque:`${s.diasSemVisita||0} dia(s) sem aparecer.`}];
  return [{regua:'Cliente sumido / Baixa frequência',diasRef:s.diasSemVisita,porque:'Situação geral de baixo engajamento.'}];
}
/* Mantido por compatibilidade com quem só precisa do nome (ex.: texto resumido no cartão da lista) —
   pega a primeira candidata, que é sempre a mais provável. */
function sugerirRegua(s){return sugerirReguasCandidatas(s)[0].regua}
function calcRetencao(){
  const temDados=S.imp.clientes.length||S.imp.contratos.length||S.imp.cartaoCB.length;
  const {subs}=temDados?computeAssinantes():{subs:[]};
  const K=kpisAssinantes(subs);
  const ativos=subs.filter(s=>s.status==='Ativo');
  const em_risco=ativos.filter(s=>s.score>=30);
  const criticos=ativos.filter(s=>s.score>=60);
  const mrrRisco=round2(sum(em_risco.map(s=>({valor:s.valorMensal}))));
  const mrrCritico=round2(sum(criticos.map(s=>({valor:s.valorMensal}))));
  // Churn mensal: cancelados com dataInicio no período atual
  const cancelados_periodo=subs.filter(s=>s.status==='Cancelado'&&s.dataInicio&&inP(s.dataInicio.slice(0,7)));
  const churnMensal=ativos.length+cancelados_periodo.length>0?
    round2(cancelados_periodo.length/(ativos.length+cancelados_periodo.length)*100):0;
  // Receita perdida por churn (MRR * cancelados no período)
  const mrrPerdido=round2(sum(cancelados_periodo.map(s=>({valor:s.valorMensal}))));
  // LTV médio dos ativos (ticket / churn mensal)
  const churnMensalDecimal=churnMensal/100;
  const ltvMedio=churnMensalDecimal>0&&K.ticket>0?round2(K.ticket/churnMensalDecimal):null;
  // Histórico de contatos de retenção
  const contatos=S.retencao.contatos||[];
  // Fila priorizada: todos os ativos em risco (score >= 20), ordenados por score desc
  const hoje=todayISO();
  const ultimoContato=nome=>{
    const ctList=contatos.filter(c=>c.clienteNome===nome);
    return ctList.length?ctList.sort((a,b)=>b.data.localeCompare(a.data))[0]:null;
  };
  // Resultados que encerram o caso (POP §12: "Pago = encerrar régua"; aplicado também a recuperado/cancelado)
  const RESOLVIDOS=new Set(['Pagou / Regularizado','Recuperado / Renovou','Cancelou']);
  // Vencido entra na fila sempre, mesmo que o score geral ainda esteja baixo — é bloqueado pelo Cash
  // Barber no próprio dia do vencimento, então já é acionável desde o primeiro dia, não só quando o
  // score genérico (que mistura outros sinais mais fracos) cruza o corte de 20.
  const fila=ativos.filter(s=>s.score>=20||s.diasAtraso>0||s.statusCliente==='Atrasada').sort((a,b)=>b.score-a.score).map(s=>{
    const uc=ultimoContato(s.nome);
    const diasDesdeContato=uc?Math.round((new Date(hoje+'T00:00:00')-new Date(uc.data+'T00:00:00'))/86400000):null;
    const resolvido=!!(uc&&RESOLVIDOS.has(uc.resultado));
    const promessaPendente=!!(uc&&uc.resultado==='Prometeu pagar'&&uc.promessaData&&uc.promessaData>=hoje);
    const promessaVencida=!!(uc&&uc.resultado==='Prometeu pagar'&&uc.promessaData&&uc.promessaData<hoje);
    return {...s,ultimoContato:uc,diasDesdeContato,resolvido,promessaPendente,promessaVencida};
  });
  const filaAtiva=fila.filter(s=>!s.resolvido);
  // Quem chamar agora (POP §13 Stop Conditions + §23/§24 promessa):
  // nunca contactado, ou promessa vencida, ou passou o prazo de espera (3d).
  // Registrar contato tira o assinante daqui imediatamente, sempre — mesmo os críticos.
  const filaHoje=filaAtiva.filter(s=>{
    if(s.promessaPendente)return false;
    if(s.promessaVencida)return true;
    if(!s.ultimoContato)return true;
    return s.diasDesdeContato>=3;
  });
  // Aguardando retorno: já contactado, aguardando prazo (promessa ou cooldown), ainda não resolvido
  const aguardando=filaAtiva.filter(s=>!filaHoje.includes(s));
  // Cancelados — vale tentar reconquistar (win-back). Os relatórios importados não trazem a data exata
  // do cancelamento, então mostra todos (não dá pra filtrar só "recentes" com o dado que existe hoje).
  const canceladosRecentes=subs.filter(s=>s.status==='Cancelado');
  return {subs,ativos,em_risco,criticos,K,mrrRisco,mrrCritico,churnMensal,mrrPerdido,ltvMedio,fila,filaHoje,aguardando,contatos,canceladosRecentes,temDados};
}

/* Sub-tela: RÉGUA — sequências de abordagem */
/* Busca livre na tela de Régua: aceita texto solto (ex. "pagamento", "onboarding") e também reconhece
   o dia da etapa escrito como "D0", "D+7", "D-3" ou "dia 7", pra achar rápido uma etapa específica sem
   precisar abrir régua por régua. */
const STOPWORDS_BUSCA_REGUA=new Set(['de','do','da','dos','das','em','no','na','nos','nas','o','a','os','as','um','uma','e','ou','pra','para','que','agora','ali','la','ja','so','dia','dias']);
// Conceitos do dia a dia da barbearia -> grupo de réguas que realmente respondem a eles. "Atrasado" ou
// "cartão recusado" não são palavras que aparecem soltas nas mensagens — são a SITUAÇÃO que a pessoa quer
// resolver, então aqui mapeamos a situação direto pro grupo certo de réguas, em vez de depender de bater
// a palavra exata no texto.
const CONCEITOS_BUSCA_REGUA=[
  {termos:['atrasad','atraso','nao pagou','inadimplen','nao passou','vencid','devendo','pagamento','cobranca'],reguas:['Assinatura atrasada — Cartão recorrente','Assinatura atrasada — Boleto','Cartão com falha','Pix enviado / Pagamento não confirmado']},
  {termos:['recusa','falhou','nao passou no cartao','cartao recusad','bandeira'],reguas:['Cartão com falha']},
  {termos:['sumi','nao vem','baixa frequencia','faltando','parou de vir','nao aparece'],reguas:['Cliente sumido / Baixa frequência']},
  {termos:['cancelou','cancelad','cancelamento','quer sair','quer cancelar','cancel save'],reguas:['Cancelamento solicitado (cancel-save)','Win-back — membro sumido / sem resposta']},
  {termos:['winback','reconquist','ex assinante','ex membro'],reguas:['Win-back — membro sumido / sem resposta']},
  {termos:['novo membro','comecou agora','entrou agora','boas vindas','acabou de assinar'],reguas:['Novo membro — Onboarding']},
  {termos:['pausa','pausou','pausar','retomar'],reguas:['Pausa terminando / Pausa em andamento']},
  {termos:['reajuste','aumentou','mudou o valor','valor novo'],reguas:['Avisos — reajuste e pagamento combinado']},
  {termos:['sem assinatura','avulso','nao assina','nao tem plano'],reguas:['Sem assinatura — estimular recorrência']},
  {termos:['agendamento','ja marcou','ja tem horario','prioridade'],reguas:['Agendamento/atendimento com renovação em aberto (Prioridade 1)']}
];
function etapaCombinaComBusca(regua,etapa,q){
  if(!q)return true;
  let qn=normHead(q);
  const diaM=qn.match(/\bd\s*([+-]?\d+)\b/);
  if(diaM)return Number(etapa.dia)===Number(diaM[1]);
  // "hoje" ou "dia de pagamento" (sem número) — a pessoa está perguntando pelo que fazer HOJE com quem
  // está no D0 (vencimento/cobrança do dia), não só pedindo qualquer réguas de pagamento em geral.
  if(/\bhoje\b/.test(qn)||/dia\s+de\s+pagamento/.test(qn))
    return Number(etapa.dia)===0&&CONCEITOS_BUSCA_REGUA[0].reguas.includes(regua.nome);
  for(const grupo of CONCEITOS_BUSCA_REGUA)
    if(grupo.termos.some(t=>qn.includes(t)))return grupo.reguas.includes(regua.nome);
  const alvo=normHead([regua.nome,regua.gatilho,etapa.titulo,etapa.canal,(etapa.variacoes||[]).join(' ')].join(' '));
  // Aceita frases soltas: ignora palavras de ligação e basta UMA das palavras que sobrarem bater, não
  // precisa a frase inteira bater igual.
  const palavras=qn.split(/\s+/).filter(p=>p.length>=2&&!STOPWORDS_BUSCA_REGUA.has(p));
  if(!palavras.length)return false;
  return palavras.some(p=>alvo.includes(p));
}

/* Sub-tela: RELATÓRIO — impacto financeiro do churn */
function vRetRelatorio(R){
  const {K,churnMensal,mrrPerdido,ltvMedio,em_risco,mrrRisco,mrrCritico,ativos,contatos}=R;
  const entAtual=round2(sum(entP().filter(e=>e.fonte&&/assina/i.test(e.fonte))));
  const metaRec=S.metas.find(m=>m.nome&&/assinatura|recorr/i.test(m.nome));
  const pctMeta=metaRec&&metaRec.alvo>0?round2(K.mrr/metaRec.alvo*100):null;
  const contatosMes=contatos.filter(c=>inP(c.data.slice(0,7)));
  const convertidos=contatosMes.filter(c=>/reteve|pagou|renovou/i.test(c.resultado||''));
  const txConversao=contatosMes.length?round2(convertidos.length/contatosMes.length*100):null;
  return `
  <div class="sumline" style="margin-bottom:16px">
    <div class="card tap" data-act="tab" data-v="assinantes"><div class="lbl">MRR</div><div class="big pos">${brl(K.mrr)}</div>${pctMeta!==null?`<div class="tag">${pctMeta}% da meta`:''}${pctMeta!==null?`</div>`:''}${pctMeta===null?`<div class="tag">receita mensal recorrente</div>`:''}</div>
    <div class="card"><div class="lbl">MRR em risco</div><div class="big ${mrrRisco?'amb':''}">${brl(mrrRisco)}</div><div class="tag">${em_risco.length} assinante(s) score ≥ 30</div></div>
    <div class="card"><div class="lbl">Churn do período</div><div class="big ${churnMensal>5?'neg':churnMensal>2?'amb':'pos'}">${churnMensal.toFixed(1)}%</div><div class="tag">${mrrPerdido>0?`${brl(mrrPerdido)} perdidos`:'sem cancelamentos no período'}</div></div>
    <div class="card"><div class="lbl">LTV estimado</div><div class="big">${ltvMedio?brl(ltvMedio):'—'}</div><div class="tag">${K.ticket>0?`Ticket ${brl(K.ticket)}/mês`:'sem dados suficientes'}</div></div>
  </div>
  <h3 style="margin:0 0 8px">Impacto financeiro do churn</h3>
  ${mrrCritico>0?`<div class="aviso neg" style="margin-bottom:10px">Se os ${em_risco.filter(s=>s.score>=60).length} assinantes <b>críticos</b> cancelarem, o impacto no MRR será <b>${brl(mrrCritico)}/mês</b> (${round2(mrrCritico/K.mrr*100).toFixed(0)}% do MRR atual).</div>`:''}
  ${mrrRisco>0&&mrrRisco>mrrCritico?`<div class="aviso amb" style="margin-bottom:10px">Incluindo todos em atenção, o risco total é <b>${brl(mrrRisco)}/mês</b>.</div>`:''}
  <div class="formula" style="margin-bottom:8px">Referência de saúde: churn mensal abaixo de 2% é saudável para clubes de barbearia. Acima de 5% exige ação imediata.</div>
  <h3 style="margin:16px 0 8px">Eficiência da retenção no período</h3>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    <div class="card"><div class="lbl">Contatos realizados</div><div class="big">${contatosMes.length}</div></div>
    <div class="card"><div class="lbl">Clientes retidos</div><div class="big pos">${convertidos.length}</div></div>
    <div class="card"><div class="lbl">Taxa de conversão</div><div class="big ${txConversao!==null&&txConversao<20?'neg':'pos'}">${txConversao!==null?txConversao.toFixed(0)+'%':'—'}</div></div>
    <div class="card"><div class="lbl">MRR salvo</div><div class="big pos">${brl(round2(sum(convertidos.map(c=>({valor:c.mrr||0})))))}</div></div>
  </div>
  <div class="formula">O MRR salvo só aparece quando você registrar o valor mensal do cliente no contato. Preencha o campo ao registrar.</div>`;
}

function salvarRegistroContato(nome){
  const canal=val('f_ctcanal')||'WhatsApp',resultado=val('f_ctresultado')||'Aguardando retorno';
  const promessaData=val('f_ctpromessa')||'';
  const mrr=Number(val('f_ctmrr'))||0,obs=val('f_ctobs').trim();
  snap();
  S.retencao.contatos.push({id:nextId('CTT'),clienteNome:nome,data:todayISO(),canal,resultado,promessaData,mrr,obs});
  // Resultado decisivo também atualiza o status do cliente na aba Clientes — mesma lógica usada em todo o app
  const c=S.clientes.find(x=>normNome(x.nome)===normNome(nome));
  let statusMsg='';
  if(c){
    if(resultado==='Cancelou'){registrarTransicaoStatus(c,'Cancelada',false);c.statusAssinatura='Cancelada';statusMsg=' · status do cliente: Cancelada'}
    else if(resultado==='Pagou / Regularizado'||resultado==='Recuperado / Renovou'){registrarTransicaoStatus(c,'Em dia',false);c.statusAssinatura='Em dia';c.ultimoPagamento=todayISO();statusMsg=' · status do cliente: Em dia'}
  }
  save();closeModal();render();toast('Contato registrado'+statusMsg);
}
/* "Voltar para a fila agora": remove o último contato do cliente, tirando-o do estado de espera */
async function voltarParaFila(nome){
  const ctList=(S.retencao.contatos||[]).filter(c=>c.clienteNome===nome);
  if(!ctList.length)return;
  const ultimo=ctList.sort((a,b)=>b.data.localeCompare(a.data))[0];
  const ok=await askConfirm(`Voltar ${nome} para a fila de "quem chamar agora"?`,[{t:'Voltar',v:1,cls:''},{t:'Cancelar',v:null}]);
  if(!ok)return;
  snap();
  S.retencao.contatos=S.retencao.contatos.filter(c=>c.id!==ultimo.id);
  save();render();toast('Voltou para a fila');
}

function compressImageFile(file){
  // resolve {dataUrl, blob}: dataUrl para o modo local (sem nuvem), blob para subir como asset (modo compartilhado)
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const max=1400;let w2=img.width,h2=img.height;
          if(w2>=h2){if(w2>max){h2=Math.round(h2*max/w2);w2=max}}else{if(h2>max){w2=Math.round(w2*max/h2);h2=max}}
          const cv=document.createElement('canvas');cv.width=w2;cv.height=h2;
          cv.getContext('2d').drawImage(img,0,0,w2,h2);
          const dataUrl=cv.toDataURL('image/jpeg',0.75);
          cv.toBlob(blob=>resolve({dataUrl,blob}),'image/jpeg',0.75);
        }catch(e){reject(e)}
      };
      img.onerror=()=>reject(new Error('img'));
      img.src=rd.result;
    };
    rd.onerror=()=>reject(new Error('read'));
    rd.readAsDataURL(file);
  });
}
async function handleAnexoFile(t,recId,files){
  snap();
  const rec=S[LISTAS[t]].find(x=>x.id===recId);if(!rec)return;
  if(!rec.anexos)rec.anexos=[];
  if(!S.anexos)S.anexos={};
  const assetsCap=await getAssetsCap();
  for(const file of Array.from(files)){
    try{
      let dataUrl,blob,tipo;
      if(file.type.startsWith('image/')){const r=await compressImageFile(file);dataUrl=r.dataUrl;blob=r.blob;tipo='image'}
      else if(file.type==='application/pdf'){
        if(file.size>4*1024*1024){toast(`"${file.name}" é maior que 4MB — não foi anexado.`);continue}
        dataUrl=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(file)});
        blob=file;
        tipo='pdf';
      }else{toast(`Tipo de arquivo não suportado: ${file.name}`);continue}
      const aid=newCfgId();
      if(assetsCap){
        // Modo compartilhado: sobe o arquivo pra nuvem do artifact, todo mundo com acesso enxerga o mesmo anexo
        try{
          const up=await assetsCap.upload(blob);
          S.anexos[aid]={id:aid,nome:file.name,tipo,url:up.url};
        }catch(e){S.anexos[aid]={id:aid,nome:file.name,tipo,dataUrl}} // se a subida falhar, guarda local mesmo assim
      }else{
        S.anexos[aid]={id:aid,nome:file.name,tipo,dataUrl};
      }
      rec.anexos.push(aid);
    }catch(e){toast(`Falha ao processar "${file.name}"`)}
  }
  save();
  const box=document.getElementById('anexos_box');
  if(box)box.outerHTML=anexosBlock(t,recId);
  toast('Anexo(s) salvos');
}
async function verAnexo(id){
  const a=S.anexos[id];if(!a)return;
  if(a.url){window.open(a.url,'_blank');return}
  try{const res=await fetch(a.dataUrl);const blob=await res.blob();const url=URL.createObjectURL(blob);window.open(url,'_blank')}
  catch(e){toast('Não foi possível abrir o anexo')}
}

function metaCamposHTML(tipo,r){
  if(tipo==='faturamento')return F('Meta de faturamento mensal (R$)',`<input id="f_alvo" inputmode="decimal" data-money value="${moneyMask(r.alvo)}">`)+'<div class="hint">Comparado sozinho com a receita do período selecionado no topo do app.</div>';
  if(tipo==='reducao')return F('Categoria de despesa',`<select id="f_catmeta">${opts(catNames(),r.categoriaAlvo)}</select>`)+F('Teto mensal desejado (R$)',`<input id="f_alvo" inputmode="decimal" data-money value="${moneyMask(r.alvo)}">`)+'<div class="hint">Comparado sozinho com o gasto dessa categoria no período selecionado no topo do app.</div>';
  return `<div class="two">${F('Valor atual (R$)',`<input id="f_atual" inputmode="decimal" data-money value="${moneyMask(r.atual)}">`)}${F('Valor alvo (R$)',`<input id="f_alvo" inputmode="decimal" data-money value="${moneyMask(r.alvo)}">`)}</div>${F('Prazo',`<input type="date" id="f_prazo" value="${r.prazo||''}">`)}`;
}

/* ========= PICKER DE ÍCONES SVG =========
   Exibe um grid com todos os ícones do app. O valor armazenado é a KEY do ICO (ex: 'k_pessoal').
   Se o valor salvo for uma key conhecida → renderiza o SVG; caso contrário (emoji antigo) → emoji escapado.

function saldoDoExtrato(c,ateData){
  const desde=c.dataSaldoInicial||'0000-01-01';
  const mv=(S.movContas||[]).filter(x=>x.conta===c.nome&&x.data>=desde&&x.data<=ateData);
  return round2((c.saldoInicial||0)+mv.reduce((a,x)=>a+x.valor,0)+ajusteTransfSemExtrato(c,ateData))||0; // ||0 evita "-R$ 0,00" (zero negativo)

/* Transferência lançada à mão entre contas (aba Contas → Transferir) também mexe no saldo de conta que usa extrato —
   MAS só enquanto o extrato dessa conta ainda não trouxe o movimento (mesmo valor, sentido certo, até 3 dias de diferença).
   Quando o extrato chega com o saque/Pix, ele passa a valer e a transferência manual deixa de contar (evita contar 2 vezes). */
function transfPendenteDeExtrato(c,t,ateData){
  const desde=c.dataSaldoInicial||'0000-01-01';
  if(!t.ativo||t.data<desde||t.data>ateData)return 0;
  const entra=t.contaDestino===c.nome,sai=t.contaOrigem===c.nome;
  if(!entra&&!sai)return 0;
  const alvo=entra?t.valor:-t.valor,t0=new Date(t.data+'T00:00:00');

  return achou?0:alvo;
}
function ajusteTransfSemExtrato(c,ateData){
  return round2(sum((S.transferencias||[]).map(t=>({valor:transfPendenteDeExtrato(c,t,ateData)}))));

function saldoConta(c){

  const desde=c.dataSaldoInicial||'0000-01-01',hoje=todayISO();
  const e=sum(S.entradas.filter(r=>r.ativo&&r.conta===c.nome&&r.data>=desde&&r.data<=hoje));
  const d=sum(S.despesas.filter(r=>r.ativo&&r.status==='Pago'&&r.conta===c.nome&&r.data>=desde&&r.data<=hoje));
  const tIn=sum(S.transferencias.filter(t=>t.ativo&&t.contaDestino===c.nome&&t.data>=desde&&t.data<=hoje));
  const tOut=sum(S.transferencias.filter(t=>t.ativo&&t.contaOrigem===c.nome&&t.data>=desde&&t.data<=hoje));
  return round2((c.saldoInicial||0)+e-d+tIn-tOut);
}

const T_EXCLUIVEL=new Set(['entrada','despesa','cartao','patrimonio','meta','conta','colaborador','item','plano','transferencia','cliente','contaPagar','contaReceber']);
function decorarExcluir(raiz){
  const app=raiz||document.getElementById('app');if(!app)return;
  const feitos=new Set();
  const pos=(cont,t,id)=>{
    if(!cont||!t||!id||!T_EXCLUIVEL.has(t)||feitos.has(cont))return;
    feitos.add(cont);cont.classList.add('hasx');
    const x=document.createElement('button');x.type='button';x.className='xdel';x.textContent='×';
    x.dataset.act='xdel';x.dataset.t=t;x.dataset.id=id;x.title='Excluir';x.setAttribute('aria-label','Excluir');
    cont.appendChild(x);
  };
  app.querySelectorAll('[data-act="edit"][data-t][data-id]').forEach(el=>{
    let cont=el.matches('.row,.cat,.drtx,.card')?el:el.closest('.row,.cat,.drtx,.card');
    if(cont){
      const ids=new Set([...cont.querySelectorAll('[data-act="edit"][data-id]')].map(e=>e.dataset.t+'|'+e.dataset.id));
      if(cont.matches('[data-act="edit"][data-id]'))ids.add(cont.dataset.t+'|'+cont.dataset.id);
      if(ids.size!==1)cont=el;          // vários itens dentro do mesmo cartão (ex.: metas no Painel): × em cada um
    }else cont=el;
    pos(cont,el.dataset.t,el.dataset.id);
  });
  app.querySelectorAll('[data-act="abrircolab"][data-id]').forEach(el=>pos(el.closest('.card'),'colaborador',el.dataset.id));
}
async function excluirRapido(t,id){
  if(t==='cliente'){
    const c=S.clientes.find(x=>x.id===id);if(!c)return;
    snap();c.ativo=false;save();render();refrescarDetalhe();toastDesfazer(`${c.nome} removido(a) da base`);return;
  }
  if(t==='contaPagar'||t==='contaReceber'){
    const L=S[CP_LISTA[t]],c=L.find(x=>x.id===id);if(!c)return;
    if(c.serie&&c.recorrente)return delConta(t,id);        // recorrente: precisa escolher o que fazer
    snap();S[CP_LISTA[t]]=L.filter(x=>x.id!==id);save();render();refrescarDetalhe();toastDesfazer('Excluída');return;
  }
  const lista=S[LISTAS[t]];if(!lista)return;
  const r=lista.find(x=>x.id===id);if(!r)return;
  if(r.grupo){snap();return delRec(t,id)}                   // série: pergunta o alcance
  snap();S[LISTAS[t]]=lista.filter(x=>x.id!==id);
  if(t==='transferencia')S.despesas=S.despesas.filter(d=>d.origemTransferencia!==id); // a tarifa de saque vai junto
  save();render();refrescarDetalhe();toastDesfazer('Excluído');
}
async function delRec(t,id){
  if(t==='contaPagar'||t==='contaReceber')return delConta(t,id);
  const lista=S[LISTAS[t]],r=lista.find(x=>x.id===id);if(!r)return;
  let modo='um';
  if(r.grupo){
    const a=await askConfirm('Este lançamento faz parte de uma série. O que excluir?',[{t:'Só este',v:'um',cls:'sec'},{t:'Este e os próximos',v:'prox',cls:'sec'},{t:'A série inteira',v:'todos',cls:'warn'},{t:'Cancelar',v:null}]);
    if(!a)return;modo=a;
  }else{
    const a=await askConfirm(`Excluir ${(NOME_REG[t]||['','este registro'])[0]} definitivamente?`,[{t:'Excluir',v:'um',cls:'warn'},{t:'Cancelar',v:null}]);
    if(!a)return;
  }
  S[LISTAS[t]]=lista.filter(x=>{
    if(x.id===id)return false;
    if(!r.grupo||x.grupo!==r.grupo)return true;
    if(modo==='todos')return false;
    if(modo==='prox')return x.data<r.data;
    return true;
  });
  if(t==='transferencia')S.despesas=S.despesas.filter(d=>d.origemTransferencia!==id);
  const det=DETALHE_COLAB;save();if(!det)closeModal();render();refrescarDetalhe();toastDesfazer('Excluído');
}

let IMP_ERROS={};
async function handleImportFile(tipo,files){
  const imp=IMPORTERS[tipo];let all=[];const erros=[];
  for(const f of files){
    try{
      const nomeArq=(f.name||'').toLowerCase();
      if((f.type||'').startsWith('image/')||EXT_IMAGEM.test(nomeArq))throw erroArq('imagem');
      const ehPdf=nomeArq.endsWith('.pdf')||(f.type||'').includes('pdf');
      const {headers,rows}=(tipo==='clientes'&&ehPdf)?await parsePdfClientesCelcoin(f):await parseArquivoTabular(f);
      const lidos=imp.parse(adaptarCabecalhos(tipo,headers),rows);
      if(!lidos.length){const d=detectarTipoDocumento(headers);erros.push(`${f.name||'arquivo'}: nenhum registro reconhecido como "${imp.titulo}".`+(d.length&&!d.some(x=>x.tipo===tipo)?` Parece ser: ${d.map(x=>ROTULOS_DOC[x.tipo]).join(' ou ')}.`:''))}
      all=all.concat(lidos);
    }catch(e){erros.push(`${f.name||'arquivo'}: ${msgErroArquivo(e)}`)}
  }
  IMP_STAGE[tipo]=all.length||!erros.length?all:null;
  IMP_ERROS[tipo]=erros;
  const sheet=document.querySelector('.sheet');if(sheet)sheet.innerHTML=importHTML();
}

function salvarImportacao(){
  let total=0;
  ULTIMA_CATALOGO=null;ULTIMA_COLABORADORES=null;ULTIMA_VALORESASS=null;
  if(IMP_STAGE.contratos){S.imp.contratos=IMP_STAGE.contratos;total++}
  if(IMP_STAGE.valoresAss){
    const novo=IMP_STAGE.valoresAss,canal=(novo[0]||{}).canal||'manual',hoje=todayISO(),ant=S.imp.valoresAss||[];
    S.imp.valoresAss=ant.filter(x=>x.canal!==canal).concat(novo.map(x=>Object.assign({},x,{canal,importadoEm:hoje})));
    // o valor atual de cada cliente passa a ser o da planilha (o cartão do Cash Barber guarda o valor de tabela, não o que se paga)
    const idx=indexValoresAss();let atualizados=0;
    S.clientes.forEach(c=>{const v=valorAssinatura(idx,c.nome,c.planoAtual);if(v&&Math.abs((c.valorAtual||0)-v.valor)>0.005){c.valorAtual=v.valor;atualizados++}});
    ULTIMA_VALORESASS={canal,n:novo.length,antes:ant.filter(x=>x.canal===canal).length,atualizados};
    total++;
  }
  if(IMP_STAGE.transacoes){
    S.imp.transacoes=IMP_STAGE.transacoes;
    // O relatório de Transações da Celcoin traz cel_cash (cartão) e boleto/Pix (manual) juntos — os dois módulos
    // já entram somados (sem separar por canal). Só ESCALONA um cliente para "Atrasada" quando a cobrança já
    // venceu de fato (nunca rebaixa quem já está "Em dia"/"Cancelada"/"Pausada" por outra fonte, e nunca marca
    // "Pendente" — uma cobrança que ainda não venceu é o ciclo normal, não motivo pra mexer no status do cliente).
    const hoje=todayISO();
    const porCliente={};
    S.imp.transacoes.forEach(t=>{const k=normNome(t.nome);if(!k)return;(porCliente[k]=porCliente[k]||[]).push(t)});
    ULTIMA_TRANSACOES_ATRASADAS=[];
    Object.entries(porCliente).forEach(([k,rows])=>{
      const atrasada=rows.some(t=>bucketTransacao(t,hoje)==='Atrasada');
      if(!atrasada)return;
      let c=S.clientes.find(x=>normNome(x.nome)===k);
      if(!c){c={id:nextId('CLI'),nome:rows[0].nome,telefone:'',email:'',cpfHash:'',cpfLast4:'',planoAtual:rows[0].plano,valorAtual:rows[0].valor,ativo:true,primeiraVezVista:todayISO()};S.clientes.push(c)}
      if(c.statusAssinatura==='Cancelada'||c.statusAssinatura==='Pausada'||c.canceladoEm)return;
      if(!atrasoCelcoinDe(rows[0].nome))return; // já pago (✅ Pago ou comanda) — não escalar
      // Status vindo de importação sempre é tratado como "baseline" (não cravar dataAdesao=hoje) — um
      // relatório importado reflete um histórico que já existia antes, nunca um evento acontecendo agora.
      if(c.statusAssinatura!=='Atrasada'){registrarTransicaoStatus(c,'Atrasada',true);c.statusAssinatura='Atrasada'}
      ULTIMA_TRANSACOES_ATRASADAS.push({nome:rows[0].nome,valor:round2(sum(rows.filter(t=>bucketTransacao(t,hoje)==='Atrasada')))});
    });
    total++;
  }
  if(IMP_STAGE.clientes){
    S.imp.clientes=IMP_STAGE.clientes;
    IMP_STAGE.clientes.forEach(r=>{
      const h=r.cpfDig?hashStr(r.cpfDig):null;
      let c=h?S.clientes.find(x=>x.cpfHash===h):null;
      if(!c)c=S.clientes.find(x=>normNome(x.nome)===normNome(r.nome));
      if(!c){
        c={id:nextId('CLI'),nome:r.nome,cpfHash:h||'',cpfLast4:h?r.cpfDig.slice(-4):'',telefone:r.telefone||'',email:r.email||'',planoAtual:'',valorAtual:'',ativo:true,primeiraVezVista:r.dataCadastro||todayISO(),ultimaVezVista:r.ultimaVisita||''};
        S.clientes.push(c);
      }else{
        if(h&&!c.cpfHash){c.cpfHash=h;c.cpfLast4=r.cpfDig.slice(-4)}
        if(!c.telefone)c.telefone=r.telefone||'';
        if(!c.email)c.email=r.email||'';
        if(r.ultimaVisita&&(!c.ultimaVezVista||r.ultimaVisita>c.ultimaVezVista))c.ultimaVezVista=r.ultimaVisita;
      }
    });
    total++;
  }
  if(IMP_STAGE.cartaoCB){
    const anterior=S.imp.cartaoCB.slice(),novo=IMP_STAGE.cartaoCB;
    const primeiraImportacaoCartao=anterior.length===0;
    const porNome={};novo.forEach(r=>{(porNome[normNome(r.nome)]=porNome[normNome(r.nome)]||[]).push(r)});
    ULTIMA_DUPLICADAS=Object.values(porNome).filter(l=>l.length>1);
    ULTIMA_VALORBAIXO=novo.filter(r=>r.valor>0&&r.valor<20&&r.bucket!=='Cancelada');
    const nomesNovos=new Set(novo.map(r=>normNome(r.nome)));
    ULTIMA_SUMIU=anterior.filter(r=>r.bucket!=='Cancelada'&&!nomesNovos.has(normNome(r.nome)));
    S.imp.cartaoCB=novo;
    ULTIMA_VALORDIVERGENTE=[];
    novo.forEach(r=>{
      const chave=normNome(r.nome);
      let c=S.clientes.find(x=>normNome(x.nome)===chave);
      if(!c){
        c={id:nextId('CLI'),nome:r.nome,telefone:r.telefone||'',email:r.email||'',cpfHash:'',cpfLast4:'',planoAtual:r.plano,valorAtual:r.valor,ativo:true,primeiraVezVista:todayISO()};
        S.clientes.push(c);
      }else{
        if(!c.telefone)c.telefone=r.telefone||'';
        if(!c.email)c.email=r.email||'';
        if(c.valorAtual>0&&r.bucket!=='Cancelada'&&Math.abs(c.valorAtual-r.valor)>0.01){
          ULTIMA_VALORDIVERGENTE.push({nome:r.nome,esperado:c.valorAtual,importado:r.valor});
        }
      }
      // Mesmo raciocínio: dado vindo de relatório importado nunca é "aconteceu agora", é histórico já
      // existente — trata como baseline sempre, não só quando é a primeira importação desse tipo.
      // Status = união das fontes: se a Celcoin ainda tem cobrança vencida em aberto (e não foi paga), continua "Atrasada" mesmo que o
      // Cash Barber diga "Em dia"; e quem você marcou como cancelado no app (candidatos a cancelamento) continua cancelado.
      let stFinal=r.bucket;
      if((stFinal==='Em dia'||stFinal==='Pendente'||stFinal==='Outro')&&atrasoCelcoinDe(r.nome))stFinal='Atrasada';
      if(c.canceladoEm&&stFinal!=='Cancelada')stFinal='Cancelada';
      registrarTransicaoStatus(c,stFinal,true);
      c.statusAssinatura=stFinal;c.ultimaVezVista=todayISO();
    });
    total++;
  }
  if(IMP_STAGE.catalogo){
    ULTIMA_CATALOGO={novos:0,atualizados:0};
    IMP_STAGE.catalogo.forEach(r=>{
      let it=S.itens.find(i=>normNome(i.nome)===normNome(r.nome)&&i.tipo===r.tipo);
      if(!it){it={id:nextId('ITM'),nome:r.nome,tipo:r.tipo,precoSugerido:'',custoUnitario:''};S.itens.push(it);ULTIMA_CATALOGO.novos++}
      else ULTIMA_CATALOGO.atualizados++;

  }
  if(IMP_STAGE.planosCatalogo){
    // Catálogo de planos/clubes: casa por nome, nunca apaga um plano que já não vem mais no arquivo
    // (descontinuar um plano é manual), e não mexe no preço já cadastrado — esse relatório não traz valor.
    ULTIMA_PLANOSCATALOGO={novos:0,atualizados:0};

      if(!pl){pl={id:nextId('PLN'),nome:r.nome,precoSugerido:'',descricao:''};S.planos.push(pl);ULTIMA_PLANOSCATALOGO.novos++}
      else ULTIMA_PLANOSCATALOGO.atualizados++;
    });

  }
  if(IMP_STAGE.freq){const key=r=>normNome(r.nome)+'|'+normHead(r.profissional)+'|'+r.mesRef;const map={};S.imp.freq.forEach(r=>map[key(r)]=r);IMP_STAGE.freq.forEach(r=>map[key(r)]=r);S.imp.freq=Object.values(map);total++}
  if(IMP_STAGE.agend){const key=r=>normNome(r.nome)+'|'+r.dataHora+'|'+normHead(r.status);const map={};S.imp.agend.forEach(r=>map[key(r)]=r);IMP_STAGE.agend.forEach(r=>map[key(r)]=r);S.imp.agend=Object.values(map);total++}
  if(IMP_STAGE.colaboradores){
    // Mesma cautela do catálogo: casa por nome (sem CPF nesse relatório), nunca apaga um colaborador que já não
    // vem mais no arquivo (desligamento se resolve manualmente, não por ausência numa planilha), e só sobrescreve
    // % de comissão quando o arquivo realmente traz um valor — não zera uma comissão já cadastrada na mão.
    ULTIMA_COLABORADORES={novos:0,atualizados:0};
    IMP_STAGE.colaboradores.forEach(r=>{
      let c=S.colaboradores.find(x=>normNome(x.nome)===normNome(r.nome));
      if(!c){
        c={id:nextId('COL'),nome:r.nome,funcao:'Outro',telefone:'',email:'',percentualComissao:'',comissaoPct:0,dataAdmissao:r.dataAdmissao||todayISO(),ativo:true};
        S.colaboradores.push(c);ULTIMA_COLABORADORES.novos++;

  if(!total)return setErr('Selecione ao menos um arquivo antes de salvar.');
  sincronizarContasReceberAssinantes();gerarRecorrenciasContas();
  save();render();
  // Depois de salvar, a tela de importação volta zerada — sem isso, ficava mostrando
  // "pronto para salvar" com o arquivo antigo, arriscando salvar ele de novo por engano
  // e os números ficarem diferentes do esperado.
  IMP_STAGE={clientes:null,freq:null,agend:null,contratos:null,transacoes:null,cartaoCB:null};
  IMP_ERROS={};
  if(DOC&&DOC.etapa==='feito'&&ULTIMA_VALORESASS)return toast(`Valores de ${ULTIMA_VALORESASS.n} assinante(s) — ${ROTULO_CANAL[ULTIMA_VALORESASS.canal]||ULTIMA_VALORESASS.canal}`);
  const sheet=document.querySelector('.sheet');if(sheet)sheet.innerHTML=importHTML();
  const box=document.getElementById('cartaocb_relatorio');
  if(box)box.innerHTML=relatorioCartaoBox();
  const boxT=document.getElementById('transacoes_resumo');
  if(boxT)boxT.innerHTML=relatorioTransacoesBox();
  toast(ULTIMA_CATALOGO?`Catálogo importado — ${ULTIMA_CATALOGO.novos} novo(s), ${ULTIMA_CATALOGO.atualizados} atualizado(s)`
    :ULTIMA_COLABORADORES?`Equipe importada — ${ULTIMA_COLABORADORES.novos} novo(s), ${ULTIMA_COLABORADORES.atualizados} atualizado(s)`
    :ULTIMA_PLANOSCATALOGO?`Planos importados — ${ULTIMA_PLANOSCATALOGO.novos} novo(s), ${ULTIMA_PLANOSCATALOGO.atualizados} já existia(m)`
    :'Dados importados');
}

/* ============ importação unificada: "Importar documento" (detecta o tipo sozinho) ============
   Camada ADITIVA sobre os importadores existentes: lê o arquivo, reconhece qual dos relatórios conhecidos ele é
   pelas colunas, mostra o que foi detectado + prévia e só grava depois da confirmação. Em caso de dúvida pergunta;
   se não reconhece, oferece mapear as colunas para Entradas/Despesas. Nunca grava sem o usuário ver o resultado. */
/* Nomes exatamente como a Caroline se refere a cada relatório (opção B: importação única + confirmação
   nomeada) — usados na tela de detecção ("Detectei: <nome>") para ela reconhecer de cara qual relatório é. */
const ROTULOS_DOC={clientes:'Relatório de Clientes',freq:'Relatório de Frequência',agend:'Relatório de Agendamento',
  planosCatalogo:'Catálogo de Planos/Clubes',
  cartaoCB:'Relatório de Assinaturas no Cartão',valoresAss:'Planilha de valor de cada assinante',contratos:'Relatório de Assinatura (Contratos/Vendas)',transacoes:'Relatório de Churn (Clientes Atrasados)',
  relatorio:'Relatório de Lançamentos (entradas e saídas)',extrato:'Extrato de conta (banco, maquininha ou carteira digital)',agendarec:'Agenda de recebíveis (cartão a liquidar)',
  comandas:'Relatório de Pagamento de Assinatura / Comandas Fechadas',catmix:'Relatório de Categorias/Serviços (Faturamento — só conferência)',
  catalogo:'Catálogo (Produtos / Serviços / Bar-Cozinha)',colaboradores:'Colaboradores (Equipe)'};
/* Comandas fechadas (Cash Barber): cada linha é um pagamento recebido — "Assinatura" vira receita recorrente do
   clube, o resto vira Serviços avulsos. Comanda com valor R$ 0,00 nunca é receita e é sempre ignorada. */
/* ===== Vínculo: "Profissional" do relatório de comandas (Cash Barber) → colaborador (comissão) =====
   O relatório traz "Barbeiro Eduardo Silva", "Giordan Barbeiro Visagista"… e o cadastro da equipe pode ter o nome de outro jeito
   (Eduardo Jean). Casa por nome completo e, na falta, pelo PRIMEIRO nome quando é único na equipe. Um vínculo escolhido à mão
   (aba Equipe) vale mais que o automático. "N/A" (pagamento de assinatura) não tem barbeiro. */
const ehNA=t=>/^n\s*\/?\s*a$/i.test(String(t||'').trim());
function normProfissional(txt){return normHead(txt||'').replace(/^(barbeiro|barbeira|profissional)\s+/,'').replace(/\s+(barbeiro|barbeira|visagista)(\s+visagista)?$/,'').trim()}
function colaboradorDoProfissional(txt){
  const bruto=String(txt||'').trim();
  if(!bruto||ehNA(bruto))return null;
  const k=normHead(bruto),cfg=S.config.vinculoProfissional||{};
  if(Object.prototype.hasOwnProperty.call(cfg,k))return cfg[k]?(S.colaboradores.find(c=>c.id===cfg[k])||null):null;
  const n=normProfissional(bruto);
  let ach=S.colaboradores.find(c=>normHead(c.nome)===n);
  if(!ach){const p=n.split(' ')[0],cand=S.colaboradores.filter(c=>normHead(c.nome).split(' ')[0]===p);if(cand.length===1)ach=cand[0]}
  return ach||null;
}
function mapComandas(headers){
  return mapHeaders(headers,[
    ['idComanda',['id da comanda']],['filial',['filial']],['profissional',['profissional']],['cliente',['cliente']],
    ['tipo',['tipo']],['pagamentoExterno',['pagamento externo']],['valor',['valor comanda fechada / assinatura','valor']],
    ['dataHora',['data e hora','data']]
  ]);
}
/* Pagamento em dinheiro (espécie) não passa por banco nem maquininha: entra direto no Caixa da empresa. O relatório de faturamento do
   Cash Barber traz a forma de pagamento no "Tipo" ("Dinheiro — Fulano"); a conta do lançamento vira o Caixa (Dinheiro) da empresa. */
const EH_DINHEIRO=t=>/^\s*(dinheiro|esp[eé]cie)\b/i.test(String(t||''));
function contaCaixaEmpresa(criar){
  let c=S.contas.find(x=>x.tipo==='Caixa (Dinheiro)'&&!x.socio&&/caixa/i.test(x.nome))||S.contas.find(x=>x.tipo==='Caixa (Dinheiro)'&&!x.socio);
  if(!c&&criar){c={id:nextId('CTA'),nome:'Caixa Empresa',tipo:'Caixa (Dinheiro)',icone:'',saldoInicial:0,dataSaldoInicial:'2026-01-01'};S.contas.push(c)}
  return c?c.nome:'';
}
function rotearDinheiroCaixa(){
  const alvo=S.entradas.filter(e=>e.ativo!==false&&!e.conta&&EH_DINHEIRO(e.descricao));
  if(!alvo.length)return 0;
  const nome=contaCaixaEmpresa(true);alvo.forEach(e=>{e.conta=nome});return alvo.length;
}
let ROTEANDO=false;
function classificarTipoComanda(tipoRaw){
  const n=normHead(tipoRaw);
  if(/assinatura/.test(n))return 'Assinaturas (Clube)';
  if(/comanda|avulso|corte|barba/.test(n))return 'Serviços avulsos';
  if(/produto|revenda/.test(n))return 'Produtos / revenda';
  return '';
}
function previaComandas(rows,m){
  const P={n:0,total:0,zeradas:0,semData:0,amostra:[],porTipo:{}};
  rows.forEach(r=>{
    const valor=m.valor!==undefined?parseValorBR(r[m.valor]):NaN;
    if(isNaN(valor))return;
    if(!(valor>0)){P.zeradas++;return}
    const dataStr=m.dataHora!==undefined?parseDataBR(r[m.dataHora]):'';
    if(!dataStr)P.semData++;
    P.n++;P.total=round2(P.total+valor);
    const tipoRaw=m.tipo!==undefined?(r[m.tipo]||'').trim():'';
    const grupo=classificarTipoComanda(tipoRaw)||classificarEntrada(tipoRaw)||'Serviços avulsos';
    if(!P.porTipo[grupo])P.porTipo[grupo]={n:0,total:0};
    P.porTipo[grupo].n++;P.porTipo[grupo].total=round2(P.porTipo[grupo].total+valor);
    if(P.amostra.length<4){
      P.amostra.push([dataStr?fmtDate(dataStr):'—',(m.cliente!==undefined?r[m.cliente]:'')||'',tipoRaw||'—',brl(valor)]);
    }
  });
  return P;
}
/* Rótulos "faturamento/venda" que a Caroline usa para cada grupo classificado de comanda — só para exibição
   na prévia de confirmação, não muda a fonte gravada em S.entradas (que continua usando classificarTipoComanda). */
const ROTULOS_TIPO_COMANDA={'Assinaturas (Clube)':'Pagamento de assinatura','Serviços avulsos':'Venda de serviço avulso/extra','Produtos / revenda':'Faturamento de produto'};
async function executarImportacaoComandas(rows,m,dataRefFallback){
  snap();
  const hoje=todayISO();
  const resumo={};let totalE=0,lidas=0,zeradas=0,semData=0,duplicados=0,semNome=0,visitasZeradas=0;
  const fpsEntradas=new Set(S.entradas.filter(e=>e.origemExtrato&&e.fpImport).map(e=>e.fpImport));
  const entPorFp=new Map(S.entradas.filter(e=>e.origemExtrato&&e.fpImport).map(e=>[e.fpImport,e]));
  // Visitas: a mesma pessoa pode ser atendida por DOIS barbeiros no mesmo dia (cada um conta pra comissão dele), então a identidade da
  // visita é "impressão digital + barbeiro". Visita importada antes de guardarmos o barbeiro (sem profissional) só é completada.
  const visPorFp=new Map();S.imp.comandas.forEach(c=>{if(c.fp){const a=visPorFp.get(c.fp)||[];a.push(c);visPorFp.set(c.fp,a)}});
  const registrarVisita=(fpv,rec)=>{
    const lista=visPorFp.get(fpv)||[],pn=normHead(rec.profissional||'');
    if(pn&&lista.some(v=>normHead(v.profissional||'')===pn))return false;
    const legado=lista.find(v=>!v.profissional&&!v.colaboradorId);
    if(legado){legado.profissional=rec.profissional;legado.colaboradorId=rec.colaboradorId;return false}
    if(lista.length&&!pn)return false;
    S.imp.comandas.push(rec);lista.push(rec);visPorFp.set(fpv,lista);return true;
  };
  let vinculados=0,semBarbeiro=0;const semColab={};
  /* Anti-duplicação: o mesmo atendimento pode vir de dois relatórios (um com Tipo="Comanda", outro com Tipo=forma de pagamento:
     Crédito/Débito/Pix…). A chave é data + cliente + valor, SEM o tipo. Quantas vendas iguais já existem entra na conta:
     as primeiras N linhas do arquivo (N = o que já está lançado) são tratadas como repetidas; se o arquivo tiver MAIS
     linhas iguais do que as já lançadas (dois cortes iguais no mesmo dia), o excedente entra normalmente. */
  const chaveVenda=(d,n,v)=>`${d}|${normNome(n)}|${Number(v).toFixed(2)}`;
  const jaLancado=new Map(),vistoNoArq=new Map();
  S.entradas.forEach(e=>{
    if(e.ativo===false||!e.origemExtrato||!/^(comanda|assinatura|cr[eé]dito|d[eé]bito|pix|dinheiro)\s+—\s+/i.test(e.descricao||''))return;
    const k=chaveVenda(e.data,(e.descricao||'').split(' — ').slice(1).join(' — '),e.valor);
    const a=jaLancado.get(k)||[];a.push(e);jaLancado.set(k,a);
  });
  rows.forEach(r=>{
    const nome=(m.cliente!==undefined?(r[m.cliente]||''):'').trim();
    const valorBruto=m.valor!==undefined?parseValorBR(r[m.valor]):NaN;
    if(isNaN(valorBruto))return;
    const tipoRaw=m.tipo!==undefined?(r[m.tipo]||'').trim():'';
    // "Pagamento externo" = Sim: o pagamento dessa assinatura passou por fora do cartão recorrente nativo
    // do Cash Barber (Pix, boleto, manual, CelCash) — confirmado pelo usuário num caso real (pagamento do
    // Alexsander Thomaz, Pix). "Não" (ou em branco) = cartão recorrente nativo.
    const pagExterno=m.pagamentoExterno!==undefined?/^sim$/i.test((r[m.pagamentoExterno]||'').trim()):null;
    const dataStr0=m.dataHora!==undefined?parseDataBR(r[m.dataHora]):'';
    if(!dataStr0&&!dataRefFallback)semData++;
    const dataStr=dataStr0||dataRefFallback||hoje;
    const profRaw=m.profissional!==undefined?(r[m.profissional]||'').trim():'',colab=colaboradorDoProfissional(profRaw),colabId=colab?colab.id:'';
    if(profRaw&&!ehNA(profRaw)&&!colab)semColab[profRaw]=(semColab[profRaw]||0)+1;
    // Comanda zerada (R$ 0,00): não é receita — nunca sobe pro financeiro (S.entradas). Mas a visita em si
    // aconteceu, então ainda conta como atendimento no histórico do cliente (frequência/risco de churn),
    // gravada só em S.imp.comandas, nunca em S.entradas.
    if(!(valorBruto>0)){
      zeradas++;
      if(nome){
        const fpv=fpLancamento(dataStr,nome,0,tipoRaw||'zerada');
        if(registrarVisita(fpv,{nome,data:dataStr,valor:0,tipo:tipoRaw,fp:fpv,pagExterno,profissional:profRaw,colaboradorId:colabId}))visitasZeradas++;
      }
      return;
    }
    if(!nome){semNome++;return}
    const valor=round2(valorBruto);
    const fonte=classificarTipoComanda(tipoRaw)||classificarEntrada(tipoRaw)||'Serviços avulsos';
    const fonteFinal=canonNome('fonte',fonte);
    const descricao=tipoRaw?`${tipoRaw} — ${nome}`:nome;
    const tipoFp=/assinatura/i.test(tipoRaw)||!tipoRaw||/^comanda$/i.test(tipoRaw)?tipoRaw:'Comanda'; // forma de pagamento (Crédito/Débito/Pix) = mesma venda de uma comanda
    const fp=fpLancamento(dataStr,nome,valor,tipoFp);
    const kv=chaveVenda(dataStr,nome,valor),nVisto=(vistoNoArq.get(kv)||0)+1;vistoNoArq.set(kv,nVisto);
    const jaTem=jaLancado.get(kv)||[];
    // Toda comanda paga também é uma visita (fonte extra para "última visita"/frequência, além do relatório
    // de Agendamento), mesmo quando o lançamento financeiro já existir de uma importação anterior.
    registrarVisita(fp,{nome,data:dataStr,valor,tipo:tipoRaw,fp,pagExterno,profissional:profRaw,colaboradorId:colabId});
    if(nVisto<=jaTem.length&&!fpsEntradas.has(fp)){
      duplicados++;
      const ex2=jaTem[nVisto-1];
      if(ex2&&colabId&&!ex2.colaboradorId){ex2.colaboradorId=colabId;ex2.profissional=profRaw;vinculados++}
      return;
    }
    if(fpsEntradas.has(fp)){
      duplicados++;
      const ex=entPorFp.get(fp); // já importado antes: só liga ao barbeiro se ainda não estava ligado
      if(ex&&colabId&&!ex.colaboradorId){ex.colaboradorId=colabId;ex.profissional=profRaw;vinculados++}
      return;
    }
    const id=nextId('ENT');lidas++;
    S.entradas.push({id,grupo:'',data:dataStr,mesRef:dataStr.slice(0,7),valor,fonte:fonteFinal,categoria:'Variável',conta:EH_DINHEIRO(tipoRaw)?contaCaixaEmpresa(true):'',descricao,recorrente:false,ativo:true,origemExtrato:true,fpImport:fp,colaboradorId:colabId,profissional:profRaw});
    fpsEntradas.add(fp);
    if(colabId)vinculados++;else semBarbeiro++;
    resumo[fonteFinal]=(resumo[fonteFinal]||0)+1;totalE+=valor;
  });
  save();
  const linhas=Object.entries(resumo).map(([k,v])=>`<div class="tag">${esc(k)}: ${v}</div>`).join('');
  const box=document.getElementById('comandas_resumo');
  if(box)box.innerHTML=`<div class="card" style="margin-top:10px"><b>Importado</b><div class="tag">${lidas} lançamento(s) novo(s) · ${brl(totalE)} em receita${zeradas?` · ${zeradas} comanda(s) zerada(s) ignorada(s) no financeiro (${visitasZeradas} nova(s) registrada(s) como visita/frequência)`:''}${duplicados?` · ${duplicados} já importado(s) antes, ignorado(s) para não duplicar`:''}${semData?` · ${semData} sem data própria (usaram ${dataRefFallback?fmtDate(dataRefFallback):'hoje'})`:''}${semNome?` · ${semNome} linha(s) sem cliente identificado, ignorada(s)`:''}</div>
    ${vinculados?`<div class="tag">${vinculados} lançamento(s) ligado(s) ao barbeiro que atendeu — a comissão já aparece na aba Equipe.</div>`:''}
    ${semBarbeiro?`<div class="tag">${semBarbeiro} sem barbeiro (pagamentos de assinatura: o relatório não diz quem atendeu).</div>`:''}
    ${Object.keys(semColab).length?`<div class="aviso amb" style="margin-top:6px"><b>Profissional sem colaborador na Equipe:</b> ${Object.entries(semColab).map(([k,v])=>`${esc(k)} (${v})`).join(', ')}. Cadastre em Equipe, ou escolha o vínculo no cartão "Barbeiros do Cash Barber".</div>`:''}${linhas}</div>
  <button class="btn warn sm" style="margin-top:8px" data-act="undo">${ICO.undo} Desfazer esta importação</button>`;
  toast('Comandas/assinaturas importadas');
}
/* Relatório de mix de faturamento (Categoria/Serviço × Qtd × Valor): confirmado pela Caroline como RECEITA.
   Sem data nem cliente por linha — é um resumo agregado do período, então serve só de CONFERÊNCIA (analítico):
   nunca gera lançamento novo em S.entradas, para não duplicar a receita que já entra pelo relatório de comandas.
   Pede o período (data inicial/final) coberto pelo relatório, já que o arquivo não traz datas. */
function mapCategorias(headers){
  return mapHeaders(headers,[['categoria',['categoria','servico']],['qtd',['qtd','quantidade']],['valor',['valor']]]);
}
/* Mapeamento das categorias como a Caroline nomeia cada uma, confirmado por ela: "Barbearia" = corte/barba avulso;
   "Cosméticos" = produtos/revenda; "Serviços extras" e "Bar e cozinha" (venda a cliente e a colaborador) são
   categorias próprias. Isso não muda nenhum lançamento já gravado — é só o rótulo usado na prévia/análise. */
function classificarCategoriaMix(catRaw){
  const n=normHead(catRaw);
  if(/barbearia|corte|barba|avulso/.test(n))return 'Serviços avulsos';
  if(/servico.?s? extras?/.test(n))return 'Serviços extras';
  if(/cosmetico|produto|revenda/.test(n))return 'Produtos / revenda';
  if(/bar e cozinha|bar\/cozinha|cozinha/.test(n))return 'Bar e cozinha';
  if(/assinatura/.test(n))return 'Assinaturas (Clube)';
  return catRaw||'Outros';
}
function previaCategorias(rows,m){
  const P={n:0,total:0,linhas:[]};
  rows.forEach(r=>{
    const catRaw=m.categoria!==undefined?(r[m.categoria]||'').trim():'';
    if(!catRaw)return;
    const valor=m.valor!==undefined?parseValorBR(r[m.valor]):0;
    const qtd=m.qtd!==undefined?(parseInt(String(r[m.qtd]).replace(/\D/g,''))||0):0;
    P.n++;P.total=round2(P.total+valor);
    P.linhas.push({categoria:catRaw,grupo:classificarCategoriaMix(catRaw),qtd,valor});
  });
  return P;
}
async function executarImportacaoCategorias(rows,m,periodoDe,periodoAte){
  snap();
  const P=previaCategorias(rows,m);

  if(has('cliente')&&inc('tipo de cobranca'))add('cartaoCB',`colunas ${nomes('cliente','tipo de cobranca','plano','vencimento','status')}`);
  else if(has('cliente')&&inc('plano')&&inc('vencimento')&&inc('valor')&&inc('status')&&!inc('codigo')&&!inc('periodicidade')&&!inc('bandeira')&&!inc('documento'))
    add('cartaoCB',`colunas ${nomes('cliente','plano','vencimento','valor','status')}`);

  if(has('cliente')&&inc('plano')&&(inc('periodicidade')||inc('data da primeira transacao')||inc('codigo'))&&(inc('documento')||inc('codigo')||inc('operadora')))
    add('contratos',`colunas ${nomes('codigo','cliente','documento','plano','periodicidade','operadora')}`);
  // variante com "Nome do cliente" (sem "Documento"): só conta como contratos se não tiver "Vencimento" — senão é

  else if(inc('nome do cliente')&&inc('plano')&&!inc('vencimento')&&(inc('periodicidade')||inc('data da primeira transacao')||inc('codigo'))&&(inc('documento')||inc('codigo')||inc('operadora')))
    add('contratos',`colunas ${nomes('nome do cliente','plano','periodicidade','codigo','operadora')}`);
  // Variante mais simples do relatório de status de assinaturas: só "Cliente, Plano, Status, Data de

  // identifica os outros relatórios acima).
  if((inc('nome')||inc('item')||inc('produto'))&&(has('tipo')||inc('categoria')||inc('classe'))&&(inc('preco')||has('valor'))
    &&!inc('cliente')&&!inc('cpf')&&!inc('documento')&&!inc('vencimento')&&!inc('qtd')&&!inc('quantidade')&&meses===0)
    add('catalogo',`colunas ${nomes('nome','item','tipo','categoria','preco','valor')}`);

  // preço — um arquivo por tipo. Sem "Cliente"/"CPF"/"Vencimento"/"Plano", que identificariam outro relatório.
  else if(has('id')&&has('nome')&&has('status')&&!inc('cliente')&&!inc('cpf')&&!inc('plano')&&!inc('vencimento')&&meses===0)
    add('catalogo',`colunas ${nomes('id','nome','status','criado em')}`);
  // Export nativo do CATÁLOGO DE PLANOS/CLUBES (Cash Barber): "ID"+"Nome"+"Criado em"+"Atualizado em", sem Status
  // (o que diferencia do export de Produtos/Serviços acima) e sem Cliente/CPF/Vencimento/preço — cada linha é um
  // tipo de plano/clube cadastrado, não um cliente assinando.
  if(has('id')&&has('nome')&&inc('criado em')&&inc('atualizado em')&&!has('status')&&!inc('cliente')&&!inc('cpf')&&!inc('plano')&&!inc('vencimento')&&!inc('preco')&&!inc('valor')&&meses===0)
    add('planosCatalogo',`colunas ${nomes('id','nome','criado em','atualizado em')}`);
  // Relatório de estoque por filial ("Produto"+"Filial"+"Quantidade atual/mínima"): mistura categorias na mesma
  // planilha (bar/cozinha + produtos + o que mais tiver em estoque) — cada item é classificado pelo próprio nome.
  else if(has('produto')&&has('filial')&&(inc('quantidade atual')||inc('quantidade minima')||inc('estoque'))&&!inc('cliente')&&meses===0)
    add('catalogo',`colunas ${nomes('produto','filial','quantidade atual','quantidade minima')}`);
  // Lista simples de itens à venda: só NOME + PREÇO, sem coluna de categoria (é o que a Caroline vai subir). Último
  // recurso: só vale se nenhum outro tipo bateu e o arquivo não tem cara de extrato/cliente/relatório (data, cliente,
  // CPF, débito/crédito, quantidade, vencimento). O tipo de cada item vem do nome, e ela corrige na confirmação.
  // Cabeçalho de nome tem de ser de ITEM (nunca só "Nome", que também é o de lista de clientes/colaboradores) e o de
  // preço tem de ser explícito ("Preço", "Valor de venda"…, nunca só "Valor"). Qualquer sinal de PESSOA barra.
  const nomeDeItem=has('item')||has('produto')||has('servico')||has('nome do item')||has('nome do servico')||has('nome do produto')||has('servicos')||has('produtos')
    ||(has('nome')&&(inc('preco')||inc('valor de venda')||inc('valor sugerido')));
  const sinalDePessoa=inc('telefone')||inc('celular')||inc('whatsapp')||inc('email')||inc('e-mail')||inc('endereco')||inc('nascimento')||inc('aniversario')||inc('cpf')||inc('cnpj')||inc('cargo')||inc('funcao')||inc('comissao')||inc('admissao')||inc('cliente')||inc('colaborador')||inc('barbeiro');
  if(!out.length&&nomeDeItem&&(inc('preco')||inc('valor de venda')||inc('valor sugerido'))&&!sinalDePessoa

    add('catalogo',`lista de itens com ${nomes('nome','item','produto','servico','descricao')} e ${nomes('preco','valor')}`);
  return out;
}

  ['descricao',['descricao','historico','lancamento','movimentacao','memo','detalhe','detalhes','description','estabelecimento','titulo','favorecido','complemento','identificacao']],
