<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)">
<title>Barber Gestão Financeira</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barber Gestão">
<link rel="apple-touch-icon" id="link_appicon" href="icons/icon-192.png">
<link rel="icon" id="link_favicon" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Social Club Barbarossa — identidade "clube de barbearia": couro, madeira
   escura, latão. Tema escuro é o principal; o claro usa marfim + marrom.
   Estrutura (grid/flex/breakpoints/nav fixa/modal) idêntica à versão anterior —
   só paleta, tipografia e acabamento mudaram.
   ========================================================================== */
:root{
  color-scheme:light;
  --bg:#f4eee3;--bg2:#ebe1cf;--card:#fffcf6;--card2:#f3ebdd;--input:#fffdf8;
  --text:#2b2119;--muted:#7a6a57;--border:rgba(122,90,40,.17);--line:rgba(156,118,48,.40);
  --pri:#8f6a27;--pri2:#b8923f;--priText:#fffaf0;--gold:#a8822f;--goldSoft:rgba(176,138,58,.14);
  --green:#2e7a4f;--red:#a8402f;--amber:#a2670f;--blue:#3f6b8e;
  --greenBg:rgba(46,122,79,.11);--redBg:rgba(168,64,47,.10);--amberBg:rgba(162,103,15,.12);
  --greenLn:rgba(46,122,79,.32);--redLn:rgba(168,64,47,.32);--amberLn:rgba(162,103,15,.34);
  --shadow:0 1px 2px rgba(60,40,15,.05),0 10px 26px -16px rgba(60,40,15,.30);
  --shadowLg:0 22px 60px -22px rgba(50,32,10,.50);
  --grad:linear-gradient(145deg,#3b2b1c 0%,#1f160e 100%);
  --hero:linear-gradient(155deg,#fffaf1 0%,#f1e6d1 100%);
  --navBg:rgba(255,251,243,.94);
  --glow:radial-gradient(900px 420px at 50% -160px,rgba(176,138,58,.13),transparent 70%);
  --serif:'Fraunces','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0c0a;--bg2:#15110d;--card:#1a1612;--card2:#241e18;--input:#14110e;
    --text:#efe6d6;--muted:#a3957f;--border:rgba(201,162,74,.13);--line:rgba(201,162,74,.34);
    --pri:#c9a24a;--pri2:#e2c47e;--priText:#16110a;--gold:#c9a24a;--goldSoft:rgba(201,162,74,.12);
    --green:#79b98c;--red:#e07a64;--amber:#e3ac52;--blue:#86a9c8;
    --greenBg:rgba(121,185,140,.12);--redBg:rgba(224,122,100,.12);--amberBg:rgba(227,172,82,.13);
    --greenLn:rgba(121,185,140,.34);--redLn:rgba(224,122,100,.34);--amberLn:rgba(227,172,82,.36);
    --shadow:0 1px 0 rgba(255,235,200,.03) inset,0 12px 30px -16px rgba(0,0,0,.75);
    --shadowLg:0 26px 70px -22px rgba(0,0,0,.85);
    --grad:linear-gradient(145deg,#2c2218 0%,#15100b 100%);
    --hero:linear-gradient(155deg,#231c15 0%,#120f0b 100%);
    --navBg:rgba(18,15,12,.94);
    --glow:radial-gradient(900px 420px at 50% -160px,rgba(201,162,74,.10),transparent 70%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0c0a;--bg2:#15110d;--card:#1a1612;--card2:#241e18;--input:#14110e;
  --text:#efe6d6;--muted:#a3957f;--border:rgba(201,162,74,.13);--line:rgba(201,162,74,.34);
  --pri:#c9a24a;--pri2:#e2c47e;--priText:#16110a;--gold:#c9a24a;--goldSoft:rgba(201,162,74,.12);
  --green:#79b98c;--red:#e07a64;--amber:#e3ac52;--blue:#86a9c8;
  --greenBg:rgba(121,185,140,.12);--redBg:rgba(224,122,100,.12);--amberBg:rgba(227,172,82,.13);
  --greenLn:rgba(121,185,140,.34);--redLn:rgba(224,122,100,.34);--amberLn:rgba(227,172,82,.36);
  --shadow:0 1px 0 rgba(255,235,200,.03) inset,0 12px 30px -16px rgba(0,0,0,.75);
  --shadowLg:0 26px 70px -22px rgba(0,0,0,.85);
  --grad:linear-gradient(145deg,#2c2218 0%,#15100b 100%);
  --hero:linear-gradient(155deg,#231c15 0%,#120f0b 100%);
  --navBg:rgba(18,15,12,.94);
  --glow:radial-gradient(900px 420px at 50% -160px,rgba(201,162,74,.10),transparent 70%);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background-color:var(--bg)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Rede de segurança: todo ícone SVG do app usa viewBox="0 0 24 24" e não tem width/height no próprio elemento.
   Se algum ícone for usado fora de um contêiner que já define o tamanho (ex.: .ico, .btn>svg), o navegador usaria
   o tamanho padrão dele (300x150px) — um ícone gigante estourando o card. Essa regra evita isso em qualquer lugar,
   e cai fácil por trás de qualquer regra mais específica que já exista (.ico svg, .btn>svg etc., que continuam valendo). */
svg[viewBox]{width:1em;height:1em;display:inline-block;vertical-align:-0.15em}
body{background-color:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.4;min-height:100%;padding-bottom:88px;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
::selection{background:var(--goldSoft)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.005em}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#d9b866;border:1px solid rgba(201,162,74,.45);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:21px;box-shadow:0 6px 16px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,230,180,.08)}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.brand b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.01em}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px;color:var(--pri);transition:border-color .15s}
.iconbtn:hover{border-color:var(--line)}
.iconbtn svg,nav button i svg{width:19px;height:19px;display:block}
.saldo{position:relative;overflow:hidden;background:var(--hero);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.saldo::before{content:'';position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--pri),transparent);opacity:.8}
.saldo small{color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.saldo .v{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--pri);letter-spacing:-.01em;line-height:1.1;margin-top:3px;font-variant-numeric:lining-nums tabular-nums}
.saldo .v.neg{color:var(--red)}
.saldo .r{text-align:right}
.saldo .r b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-top:3px;font-variant-numeric:lining-nums tabular-nums}
/* period */
.period{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.yr{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:3px;box-shadow:var(--shadow);flex:none}
.yr button{width:28px;height:30px;border-radius:9px;font-size:16px;color:var(--pri)}
.yr span{font-family:var(--serif);font-weight:600;font-size:15px;padding:0 4px;font-variant-numeric:lining-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.hasx{position:relative}
.xdel{position:absolute;top:-7px;right:-5px;width:19px;height:19px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600;line-height:1;display:grid;place-items:center;padding:0 0 1px;cursor:pointer;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.28);opacity:.9}
.xdel::after{content:'';position:absolute;inset:-9px}
.xdel:hover,.xdel:active{background:var(--redBg);color:var(--red);border-color:var(--redLn);opacity:1}
.drtx.hasx .xdel{position:absolute;top:50%;right:2px;transform:translateY(-50%);background:var(--card2)}
.xclose{position:sticky;top:-6px;float:right;z-index:4;width:28px;height:28px;margin:-6px -8px 0 6px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center;padding:0 0 2px;cursor:pointer}
.xclose:hover,.xclose:active{color:var(--red);background:var(--redBg);border-color:var(--redLn)}
.toastu{display:flex;align-items:center;gap:12px}
.tundo{color:#e6c46e;font-weight:700;font-size:13px;padding:5px 10px;border-radius:9px;background:rgba(201,162,74,.20);white-space:nowrap}
.datebar{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);z-index:30;display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--navBg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 6px 18px -8px rgba(0,0,0,.5);font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;transition:transform .18s ease,opacity .18s ease;max-width:94vw}
.datebar.on{transform:translate(-50%,0);opacity:1}
.datebar .dbn{pointer-events:auto;cursor:pointer;border:0;background:transparent;color:var(--pri);font:inherit;font-size:18px;line-height:1;font-weight:700;padding:2px 8px;margin:-2px 0}
.datebar .dbn:active{opacity:.55}
.datebar .dbp{color:var(--pri)}
.datebar .dbs{color:var(--muted)}
.datebar .dbh{color:var(--muted);font-weight:500}
.datebar.sohoje .dbh{color:var(--text);font-weight:600}
@media print{.xdel,.xclose,.datebar{display:none!important}}
.card.tap{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.tap:active{transform:scale(.985)}
.card.tap:hover{box-shadow:var(--shadowLg)}
.row[data-act]:active,.cat[data-act]:active{transform:scale(.99)}
.period2{margin-bottom:12px}
.ptipos{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px}
.ptipos::-webkit-scrollbar{display:none}
.ptipos .chip{font-size:11.5px;padding:6px 9px;letter-spacing:0;flex:none}
@media (max-width:380px){.ptipos{gap:4px}.ptipos .chip{font-size:11px;padding:6px 7px}}
.period2 .period{margin-bottom:0}
.yr .prot{min-width:88px;text-align:center;font-size:14px;white-space:nowrap}
.chip small{opacity:.7;font-size:10.5px;margin-left:3px}
.period2 .period{flex-wrap:wrap}
.period2 .period:has(.pers) .yr{flex:1 1 100%;justify-content:space-between}
.period2 .period:has(.pers) .yr .prot{flex:1}
.pers{flex:1 1 100%;display:flex;gap:8px;align-items:center}
.pers label{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.pers select{flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);transition:color .15s,border-color .15s}
.chip:hover{border-color:var(--line);color:var(--text)}
.chip.on{background:linear-gradient(180deg,var(--pri2),var(--pri));border-color:transparent;color:var(--priText);box-shadow:0 6px 14px -8px rgba(150,110,30,.7)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.span4{grid-column:span 4}.span3{grid-column:span 3}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:15px;min-width:0}
.card h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--text)}
.card .lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.card .big{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.01em;line-height:1.15;font-variant-numeric:lining-nums tabular-nums}
@media(min-width:900px){.card .big{font-size:23px}}
.pat{background:var(--grad);color:#f3e8d2;border-color:rgba(201,162,74,.42)}
.pat .lbl{color:#cdb88a}
.pat .big{font-size:20px;color:#e7c983}
@media(min-width:900px){.pat .big{font-size:25px}}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}
.ico-pick-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:6px;flex:none;transition:border-color .12s}
.ico-pick-btn:hover,.ico-pick-btn.on,.ico-pick-btn:active{border-color:var(--pri);background:var(--goldSoft)}
#ico-picker-float{padding:4px 0 0;position:relative}
.ico-picker{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 8px 30px -8px rgba(0,0,0,.5);max-height:300px;overflow-y:auto}
.ico-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px;padding-bottom:8px}
.ico-pk-btn{width:42px;height:42px;border-radius:10px;border:1.5px solid transparent;background:var(--card2);cursor:pointer;display:grid;place-items:center;padding:8px;transition:border-color .1s,background .1s}
.ico-pk-btn:hover,.ico-pk-btn.on{border-color:var(--pri);background:var(--goldSoft)}
.ico-picker-actions{border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.statusdot{display:inline-flex;width:1em;height:1em}
.statusdot svg{width:100%;height:100%}
.dotv{color:var(--green)}.dotr{color:var(--red)}.dota{color:var(--amber)}.dotp{color:#9a6fd0}.dotc{color:var(--muted)}
.spark{width:100%;height:34px;margin-top:8px;display:block}
.quick{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding:2px}
.quick::-webkit-scrollbar{display:none}
.q{flex:none;width:70px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.q i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 5px;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--card2),var(--card) 70%);border:1px solid var(--line);font-style:normal;font-size:21px;color:var(--gold);box-shadow:var(--shadow),inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--goldSoft);transition:transform .15s}
.q i svg{width:23px;height:23px;display:block}
.q:hover i{transform:translateY(-1px)}
/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar em{font-style:normal;font-size:10px;font-weight:600;margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar div{width:100%;max-width:38px;border-radius:5px 5px 0 0;min-height:3px}
.bar span{font-size:10px;color:var(--muted);margin-top:5px;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span svg{width:12px;height:12px;display:inline-block;vertical-align:-2px;color:var(--gold)}
/* lists */
.catlist{display:flex;flex-direction:column;gap:11px}
.cat{display:flex;align-items:center;gap:10px}
/* selo de ícone: moldura redonda, filete de latão e fundo quente — vale para emoji personalizado e para SVG */
.ico{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--card2),var(--card) 75%);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--goldSoft);display:grid;place-items:center;font-size:16px;line-height:1;color:var(--gold);flex:none;overflow:hidden}
.ico svg{width:54%;height:54%;display:block}
.cat .ico{width:34px;height:34px;font-size:15px}
.ico.ini{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.03em;font-variant-numeric:lining-nums}
.ico.r-alto{border-color:var(--redLn)}.ico.r-medio{border-color:var(--amberLn)}.ico.r-baixo{border-color:var(--greenLn)}
.cardhead{display:flex;align-items:center;gap:11px}
/* DRE: linha que abre o detalhamento (os lançamentos que somam aquele valor) */
.row.drel{cursor:pointer}
.row.drel .drechev{flex:none;width:18px;text-align:center;color:var(--gold);font-size:17px;line-height:1;transition:transform .15s}
.row.drel.open{border-color:var(--line);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.row.drel.open .drechev{transform:rotate(90deg)}
.drepanel{background:var(--card2);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:6px 12px 10px;margin-bottom:8px}
.drepanel .drg{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--border);cursor:pointer}
.drepanel .drg b{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drepanel .drg .ico{width:28px;height:28px;font-size:12px}
.drepanel .drg .v{font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.drepanel .drg .v small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.drepanel .drg .drechev{color:var(--gold);width:14px;text-align:center;transition:transform .15s}
.drepanel .drg.open .drechev{transform:rotate(90deg)}
.drepanel .drtx{display:flex;align-items:baseline;gap:10px;padding:6px 26px 6px 2px;font-size:12.5px;border-bottom:1px solid var(--border);cursor:pointer;position:relative}
.drepanel .drsub .drtx{padding-left:14px}
.drepanel .drtx .d{flex:none;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;width:74px}
.drepanel .drtx .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drepanel .drtx .v{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.drepanel .drtx:hover,.drepanel .drg:hover{color:var(--text);background:var(--goldSoft)}
.drepanel .drfoot{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding-top:8px;color:var(--muted)}
.drepanel .drfoot b{color:var(--text);font-variant-numeric:tabular-nums}
.drepanel .btn.sm{margin:8px 0 2px}
.cat .m{flex:1;min-width:0}
.cat .m b{font-size:13px;font-weight:600}
.cat .m .track{height:4px;border-radius:4px;background:var(--card2);margin-top:6px;overflow:hidden}
.cat .m .track i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:4px}
.cat .val{font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
.legend div{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

<script>
/* ============ utilidades ============ */
const KEY='barbarossa_fin_v1';
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const PALETA=['#c9a24a','#6f9f7c','#6d8fb0','#c46a4e','#9a6f8e','#b07d3c','#5e9a96','#8c8272'];
const CATS={
  'Pessoal':['Comissões','Bonificações','Salários','Encargos','Benefícios','Vale/Adiantamento'],

};
const EMOJI={'Pessoal':'👥','Ocupação':'🏠','Insumos':'🧴','Marketing':'📣','Sistemas':'💻','Equipamentos':'🛠️','Impostos':'🧾','Pró-labore':'💼','Outros':'📦'};
const FONTES=['Assinaturas (Clube)','Serviços avulsos','Serviços extras','Produtos / revenda','Bar e cozinha','Pacotes e vale-presente','Outros'];
const FORMAS=['Pix','Débito','Crédito','Boleto','Dinheiro'];
const TIPOS_PAT=['Equipamentos','Imóvel','Reserva de caixa','Investimentos','Veículo','Outros'];
const PERIOD_MESES={'mensal':1,'bimestral':2,'trimestral':3,'quadrimestral':4,'semestral':6,'anual':12};

const $=s=>document.querySelector(s);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const dateIn=(y,m,d)=>iso(y,m,Math.min(d,lastDay(y,m)));
/* Em qual fatura do cartão uma compra cai — não é o mês da compra, é o mês em que ESSA fatura vence.
   Se a compra foi feita depois do dia de fechamento, ela já entra na fatura seguinte (que fecha no mês
   seguinte); o dia de vencimento pode cair ainda nesse mesmo mês de fechamento ou só no mês depois,
   dependendo de qual dos dois (fechamento/vencimento) vem primeiro no calendário. */
function calcularFaturaCartao(cartao,dataCompraISO){
  if(!cartao||!cartao.fechamento||!cartao.vencimento||!dataCompraISO)return null;
  const y=Number(dataCompraISO.slice(0,4)),m=Number(dataCompraISO.slice(5,7)),d=Number(dataCompraISO.slice(8,10));
  const fech=Number(cartao.fechamento),venc=Number(cartao.vencimento);
  const [anoFat,mesFat]=d>fech?addMonths(y,m,1):[y,m];
  const [anoVenc,mesVenc]=venc<fech?addMonths(anoFat,mesFat,1):[anoFat,mesFat];
  const vencISO=dateIn(anoVenc,mesVenc,venc);
  return {vencimento:vencISO,mesRef:vencISO.slice(0,7)};
}
const addMonths=(y,m,k)=>{const t=y*12+(m-1)+k;return [Math.floor(t/12),t%12+1]};
const todayISO=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlC=n=>{n=Number(n)||0;const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(1).replace('.',',')+' mi';if(a>=1e3)return (n/1e3).toFixed(1).replace('.',',').replace(',0','')+' mil';return String(Math.round(n))};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round(n*100)/100;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=a=>a.reduce((s,r)=>s+(r.valor||0),0);
/* Máscara de dinheiro: monta "1.234,56" a partir dos dígitos digitados (os 2 últimos são sempre os centavos) */
function moneyMaskDigits(raw){
  const d=String(raw||'').replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  if(!d)return '';
  const padded=d.length<3?d.padStart(3,'0'):d;
  const cents=padded.slice(-2),intPart=padded.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return intPart+','+cents;
}
/* Mesma máscara, mas a partir de um número (R$) — usada para preencher os campos ao abrir um cadastro existente */
function moneyMask(n){
  if(n===''||n===null||n===undefined||isNaN(n))return '';
  const neg=Number(n)<0;
  return (neg?'-':'')+moneyMaskDigits(String(Math.round(Math.abs(Number(n))*100)));
}
function parseMoney(s){
  s=String(s||'').replace(/[R$\s]/g,'');
  if(!s)return NaN;
  // "1,175.04" (milhar com vírgula, decimal com ponto — o que o Excel/SheetJS devolve com formato [$R$-pt-BR]): sem isto
  // virava 1,17. Se o ÚLTIMO separador é o ponto, é formato en-US.
  if(s.includes(',')&&s.includes('.')&&s.lastIndexOf('.')>s.lastIndexOf(','))s=s.replace(/,/g,'');
  else if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s);
}
const ym=s=>{const [y,m]=s.split('-').map(Number);return {y,m}};

/* ============ estado + persistência ============ */
function blank(){return {v:1,seq:{ENT:0,DES:0,CAR:0,PAT:0,MET:0,CTA:0,COL:0,ITM:0,PLN:0,TRF:0,CLI:0,CPG:0,CRC:0,SLD:0,MOV:0,REC:0,ADT:0,CPC:0,ACR:0,FEC:0},movContas:[],recebiveis:[],adiantamentos:[],comprasColab:[],acertosColab:[],fechamentosColab:[],comissaoCB:{},entradas:[],despesas:[],cartoes:[],patrimonio:[],metas:[],contas:[],colaboradores:[],itens:[],planos:[],transferencias:[],clientes:[],contasPagar:[],contasReceber:[],saldosConta:[],demo:false,
  imp:{clientes:[],freq:[],agend:[],contratos:[],transacoes:[],cartaoCB:[],comandas:[],categorias:[],valoresAss:[]},anexos:{},retencao:{reguas:[],aprendizados:[],contatos:[],progresso:{}},historicoPontualidade:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);const b=blank();const s=Object.assign(b,d);s.imp=Object.assign(blank().imp,d.imp||{});return s}}catch(e){}return blank()}
/* Ícone do app na tela inicial (PWA): usa a logo de verdade do negócio assim que ela existir (a mesma
   que aparece no topo do app, S.config.logoDataUrl) — sem isso, fica só o "B" genérico de reserva. Chama
   de novo sempre que a logo for trocada/removida ou que os dados sincronizarem de outro aparelho. */
let ICONE_PWA_PADRAO=null;
function atualizarIconePWA(){
  const li=document.getElementById('link_appicon'),li2=document.getElementById('link_favicon');
  if(ICONE_PWA_PADRAO===null&&li)ICONE_PWA_PADRAO=li.href; // guarda o "B" de reserva na primeira vez
  const href=(S.config&&S.config.logoDataUrl)||ICONE_PWA_PADRAO;
  if(!href)return;
  if(li)li.href=href;
  if(li2)li2.href=href;
}
let S=load();
atualizarIconePWA();
ensureConfig();
function ensureConfig(){
  if(!S.config)S.config={};
  if(!S.retencao)S.retencao={reguas:[],aprendizados:[],contatos:[],progresso:{}};
  if(!S.retencao.contatos)S.retencao.contatos=[];
  if(!S.retencao.progresso)S.retencao.progresso={};

/* Pedido da Caroline: acompanhar mês a mês se o % de clientes pontuais melhora ou piora, para criar ações de
   antecipação. O mês corrente fica "vivo" (atualiza a cada render, reflete o histórico mais recente); assim que o
   mês vira, o snapshot anterior fica congelado como histórico — nunca é reescrito depois. */
function snapshotPontualidadeMensal(){
  const R=relatorioPontualidade();
  if(!R)return;
  const mesRef=todayISO().slice(0,7);
  let h=S.historicoPontualidade.find(x=>x.mesRef===mesRef);
  if(!h){h={mesRef};S.historicoPontualidade.push(h);S.historicoPontualidade.sort((a,b)=>a.mesRef.localeCompare(b.mesRef));}
  h.total=R.total;h.cont=Object.assign({},R.cont);h.fr=Object.assign({},R.fr);h.atualizadoEm=todayISO();
}

  if(!C.fontesList.some(f=>f.nome==='Serviços extras'))C.fontesList.push({nome:'Serviços extras',icon:'💈'});

const ACCEPT_DOCS='.csv,.tsv,.txt,.xlsx,.xls,.xlsm,.xlsb,.ods,.pdf,.ofx,text/csv,text/tab-separated-values,text/plain,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12,application/vnd.oasis.opendocument.spreadsheet,application/x-ofx';
const MSG_IMAGEM='Fotos e imagens não são lidas automaticamente ainda — exporte como PDF, CSV ou Excel do sistema de origem.';
const EXT_IMAGEM=/\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?|avif|svg)$/i;
const EXT_EXCEL=/\.(xlsx|xls|xlsm|xlsb|ods)$/i;
const EXT_NAO_SUPORTADO=/\.(docx?|odt|rtf|pages|numbers|key|pptx?|zip|rar|7z|mp4|mov|mp3|m4a|wav|exe|html?|xml|eml|msg)$/i;
function erroArq(code){const e=new Error(code);e.code=code;return e}
/* Olha os primeiros bytes do arquivo (a extensão pode estar errada): imagem, pdf, zip (xlsx/ods/docx), ole (xls/doc). */
async function assinaturaBinaria(file){
  if(!file||typeof file.slice!=='function')return '';
  try{
    const b=new Uint8Array(await file.slice(0,16).arrayBuffer());
    const hx=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
    const asc=String.fromCharCode(...b);
    if(hx.startsWith('ffd8ff')||hx.startsWith('89504e47')||asc.startsWith('GIF8')||(asc.startsWith('RIFF')&&asc.slice(8,12)==='WEBP'))return 'imagem';
    if(asc.slice(4,8)==='ftyp')return /heic|heix|mif1|avif/.test(asc.slice(8,12))?'imagem':'midia';
    if(asc.startsWith('%PDF'))return 'pdf';
    if(hx.startsWith('504b0304'))return 'zip';
    if(hx.startsWith('d0cf11e0'))return 'ole';
  }catch(e){}
  return '';
}
/* Texto: tenta UTF-8; se o arquivo vier em Windows-1252/Latin-1 (comum em exportações brasileiras), decodifica assim
   em vez de trocar "ç/ã" por caracteres inválidos — o que quebraria o reconhecimento das colunas. */
async function lerTextoArquivo(file){
  if(typeof file.arrayBuffer==='function'&&typeof TextDecoder!=='undefined'){
    const buf=await file.arrayBuffer();const b0=new Uint8Array(buf.slice(0,2));
    // "Texto Unicode" do Excel = UTF-16 com BOM
    if(b0[0]===0xFF&&b0[1]===0xFE)try{return new TextDecoder('utf-16le').decode(buf)}catch(e){}
    if(b0[0]===0xFE&&b0[1]===0xFF)try{return new TextDecoder('utf-16be').decode(buf)}catch(e){}
    try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){}
    try{return new TextDecoder('windows-1252').decode(buf)}catch(e){}
    return new TextDecoder('utf-8').decode(buf);
  }
  return file.text();
}
function pareceBinario(text){
  const a=String(text||'').slice(0,4000);if(!a)return false;
  let ruins=0,nul=0;for(let i=0;i<a.length;i++){const c=a.charCodeAt(i);if(c===0)nul++;if((c<9)||(c>13&&c<32)||c===0xFFFD)ruins++}
  return nul>0||ruins/a.length>0.02;
}
/* OFX (extrato bancário padrão dos bancos brasileiros) → tabela Data/Descrição/Valor */
function parseOFX(text){
  const blocos=String(text).split(/<STMTTRN>/i).slice(1);
  const tag=(b,t)=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
  const rows=blocos.map(b=>{
    const dt=tag(b,'DTPOSTED'),m=dt.match(/^(\d{4})(\d{2})(\d{2})/);
    const desc=[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' — ');
    return [m?`${m[3]}/${m[2]}/${m[1]}`:'',desc||tag(b,'TRNTYPE'),tag(b,'TRNAMT')];
  }).filter(r=>r[2]!=='');
  return {headers:['Data','Descrição','Valor'],rows};
}
async function parseArquivoTabular(file){
  const nome=(file.name||'').toLowerCase(),mime=(file.type||'').toLowerCase();
  if(mime.startsWith('image/')||EXT_IMAGEM.test(nome))throw erroArq('imagem');
  if(nome.endsWith('.json')||mime==='application/json')throw erroArq('json');
  const sig=await assinaturaBinaria(file);
  if(sig==='imagem')throw erroArq('imagem');
  if(sig==='midia')throw erroArq('nao-suportado');
  const ehPdf=sig==='pdf'||(sig===''&&(nome.endsWith('.pdf')||mime.includes('pdf')));
  let ehExcel=EXT_EXCEL.test(nome)||mime.includes('spreadsheet')||mime.includes('ms-excel');
  if(!ehExcel&&!ehPdf&&(sig==='zip'||sig==='ole')){if(EXT_NAO_SUPORTADO.test(nome))throw erroArq('nao-suportado');ehExcel=true}
  if(!ehExcel&&!ehPdf&&EXT_NAO_SUPORTADO.test(nome))throw erroArq('nao-suportado');
  if(ehExcel){
    if(typeof XLSX==='undefined')throw erroArq('sem-xlsx');
    const buf=await file.arrayBuffer();
    let wb;try{wb=XLSX.read(buf,{type:'array',cellDates:false})}catch(e){throw erroArq('xlsx-invalido')}
    if(!wb.SheetNames||!wb.SheetNames.length)throw erroArq('xlsx-vazio');
    // primeira planilha que tenha conteúdo (antes: sempre a primeira, mesmo vazia)
    let aoa=[];
    for(const nm of wb.SheetNames){const a=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:false,defval:''});if(a.some(r=>r.some(c=>String(c).trim()!==''))){aoa=a;break}}
    const headers=(aoa[0]||[]).map(h=>String(h).trim());
    const rows=aoa.slice(1).map(r=>headers.map((_,i)=>r[i]!==undefined?r[i]:''));
    return {headers,rows};
  }
  if(ehPdf)return parsePdfParaTabela(file);
  const text=await lerTextoArquivo(file);
  if(pareceBinario(text))throw erroArq('binario');
  if(nome.endsWith('.ofx')||/<OFX>/i.test(text.slice(0,4000)))return parseOFX(text);
  if(nome.endsWith('.tsv')||mime.includes('tab-separated'))return parseCSV(text,'\t');
  const t=parseCSV(text);
  if(nome.endsWith('.txt')&&t.headers.length<=1){
    // .txt em colunas alinhadas por espaços (relatório de impressora/sistema antigo)
    const linhas=String(text).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim()).map(dividirColunas);
    if(linhas.length&&linhas[0].length>1){const headers=linhas[0];return {headers,rows:linhas.slice(1).map(r=>headers.map((_,i)=>r[i]!==undefined?r[i]:''))}}
  }
  return t;
}
/* Mensagem única e honesta para qualquer falha de leitura (usada por todas as telas de importação). */
function msgErroArquivo(e){

    :c==='json'?'Esse arquivo é um .json — se for um backup do app, use Ajustes → "Importar backup".'
    :c==='nao-suportado'?'Esse tipo de arquivo eu não consigo ler (Word, apresentação, zip, vídeo…). Exporte como PDF, CSV ou Excel do sistema de origem.'

    :c==='sem-pdf'?'Não consegui carregar o leitor de PDF — tente de novo com internet.'
    :c==='pdf-vazio'?'Esse PDF não tem texto legível — provavelmente é uma digitalização ou foto. Sem OCR eu não consigo ler; exporte o relatório direto do sistema (PDF, CSV ou Excel).'
    :c==='pdf-sem-cabecalho'?'Não encontrei uma tabela reconhecível nesse PDF. PDFs com várias linhas por lançamento (como o Extrato de Caixa) nem sempre dão certo — se puder, exporte em .xlsx ou .csv.'
    :'Não foi possível ler o arquivo';
}
const COLUNAS_CONHECIDAS=['tipo','data caixa','data competencia','categoria','descricao','valor','conta','status','cliente','fornecedor','observacao','codigo','plano','cartao','bandeira','vencimento','parcela'];
/* vocabulário mais amplo — só usado pela importação unificada, como 2ª tentativa (a 1ª usa a lista acima, igual antes) */
const COLUNAS_AMPLAS=COLUNAS_CONHECIDAS.concat(['data','nome','cpf','documento','email','e-mail','telefone','profissional','historico','debito','credito','periodicidade','origem','filial','lancamento','frequencia']);
function linhasDoTexto(items){
  const porY={};
  items.forEach(it=>{
    const y=Math.round(it.transform[5]);
    let chave=null;
    for(const k in porY)if(Math.abs(k-y)<=2){chave=k;break}
    if(chave==null)chave=y;
    (porY[chave]=porY[chave]||[]).push({x:it.transform[4],s:it.str,w:(it.width||it.str.length*5)});
  });
  return Object.keys(porY).map(Number).sort((a,b)=>b-a).map(y=>{
    const itens=porY[y].sort((a,b)=>a.x-b.x);
    let linha='',fimAnterior=null;
    itens.forEach(it=>{
      if(fimAnterior!=null){const gap=it.x-fimAnterior;linha+=gap>8?'   ':' '}
      linha+=it.s;fimAnterior=it.x+(it.w||it.s.length*5);
    });
    return linha.replace(/\s+$/,'').trim();
  }).filter(Boolean);
}
function dividirColunas(linha){return linha.split(/ {2,}|\t/).map(s=>s.trim()).filter(s=>s!=='')}
/* PDF de extrato bancário: lê cada coluna pela POSIÇÃO no papel, não por espaços no texto. A heurística antiga
   (linhasDoTexto + dividirColunas) quebrava a linha em "colunas" pelos espaços: no extrato do Santander a coluna
   Documento vem vazia na maioria das linhas, então tudo andava uma coluna pra esquerda e o SALDO caía no lugar
   do VALOR. Aqui: acha o cabeçalho (Data, Histórico, Documento, Valor, Saldo...), usa a borda direita das colunas
   numéricas e a borda esquerda das de texto, e agrupa cada movimento pela linha da DATA — inclusive quando a
   descrição quebra em duas linhas. Linhas sem data (resumo de saldo, rodapé) ficam de fora. */
function extratoPdfPosicional(paginasItens){
  const DATA_RE=/^\d{2}\/\d{2}(\/\d{2,4})?$/,NUM_RE=/^[-+]?\(?\d{1,3}(\.\d{3})*,\d{2}\)?[-+]?(\s?[CD])?$|^[-+]?\d+,\d{2}$/i;
  const eNumCol=n=>/valor|saldo|debito|credito/.test(n);
  const pgs=paginasItens.map(its=>its.map(it=>{const t=String(it.str||'').trim(),x=it.transform[4],w=(it.width||t.length*5);return {t,x,x1:x+w,y:-it.transform[5]}}).filter(i=>i.t));
  let cols=null,headerPg=-1;
  for(let p=0;p<pgs.length&&!cols;p++){
    const linhas=[];
    pgs[p].forEach(i=>{let l=linhas.find(L=>Math.abs(L.y-i.y)<=2);if(!l){l={y:i.y,its:[]};linhas.push(l)}l.its.push(i)});
    for(const L of linhas.sort((a,b)=>a.y-b.y)){
      const its=L.its.sort((a,b)=>a.x-b.x),cel=[];
      its.forEach(i=>{const u=cel[cel.length-1];if(u&&i.x-u.x1<=8){u.t+=' '+i.t;u.x1=i.x1}else cel.push({t:i.t,x:i.x,x1:i.x1})});
      const nn=cel.map(c=>normHead(c.t));
      const ok=nn.filter(n=>/^(data|historico|descricao|lancamento|detalhe|documento|docto|valor|saldo|debito|credito)/.test(n)).length;
      if(ok>=3&&nn.some(n=>/^data/.test(n))&&nn.some(n=>/^(valor|debito|credito)/.test(n))){cols=cel.map((c,i)=>({nome:c.t,n:nn[i],x:c.x,x1:c.x1,num:eNumCol(nn[i])}));headerPg=p;cols.yHeader=L.y;break}
    }
  }
  if(!cols||cols.length<3)return null;
  const textCols=cols.filter(c=>!c.num),numCols=cols.filter(c=>c.num);
  const colDoItem=i=>{
    if(NUM_RE.test(i.t)&&numCols.length){
      let melhor=null,d=1e9;numCols.forEach(c=>{const dd=Math.abs(i.x1-c.x1);if(dd<d){d=dd;melhor=c}});
      if(melhor&&d<=18)return melhor;
    }
    let esc=null;textCols.forEach((c,k)=>{const lim=k===0?-1e9:c.x-6;if(i.x>=lim)esc=c});
    if(esc&&numCols.length&&i.x>=numCols[0].x-30)return null; // texto solto dentro da área dos valores: ignora
    return esc;
  };
  const rows=[];
  pgs.forEach((its,p)=>{
    const corpo=its.filter(i=>p>headerPg||i.y>cols.yHeader+2);
    // a data só abre um movimento se for o PRIMEIRO item da linha ("Posição em: 03/10/2026" não é movimento)
    const ancoras=corpo.filter(i=>colDoItem(i)===cols[0]&&DATA_RE.test(i.t)&&!corpo.some(o=>o!==i&&Math.abs(o.y-i.y)<=2&&o.x<i.x-1)).sort((a,b)=>a.y-b.y);
    if(!ancoras.length)return;
    const difs=[];for(let k=1;k<ancoras.length;k++)difs.push(ancoras[k].y-ancoras[k-1].y);
    difs.sort((a,b)=>a-b);const passo=difs.length?difs[Math.floor(difs.length/2)]:25,lim=Math.min(14,passo*0.48);
    const reg=ancoras.map(a=>({y:a.y,cel:cols.map(()=>[])}));
    corpo.forEach(i=>{
      let bi=-1,bd=1e9;reg.forEach((r,k)=>{const d=Math.abs(i.y-r.y);if(d<bd){bd=d;bi=k}});
      if(bi<0||bd>lim)return;
      const c=colDoItem(i);if(!c)return;
      reg[bi].cel[cols.indexOf(c)].push(i);
    });
    reg.forEach(r=>{
      const linha=r.cel.map(l=>l.sort((a,b)=>(Math.abs(a.y-b.y)>2?a.y-b.y:a.x-b.x)).map(i=>i.t).join(' '));
      // sem nenhum valor numérico não é movimento (cabeçalho de seção, rodapé...)
      if(cols.some((c,k)=>c.num&&linha[k]))rows.push(linha);
    });
  });
  if(!rows.length)return null;
  return {headers:cols.map(c=>c.nome),rows};
}
/* Confere se os VALORES lidos fecham com a coluna SALDO do extrato (saldo anterior + valor = saldo seguinte). Serve de
   trava: se a leitura trocou Valor por Saldo, ou perdeu/duplicou linha, quase nenhum par fecha. O que vale pra
   bater é o Valor; o Saldo entra aqui só como prova de que a leitura está certa. */
function conferirSaldoExtrato(headers,rows,m){
  if(!headers||m.valor===undefined)return null;
  const H=headers.map(normHead);
  let iS=H.findIndex((h,i)=>i!==m.valor&&h==='saldo depois'); // se o arquivo traz "antes" e "depois", o que encadeia é o "depois"
  if(iS<0)iS=H.findIndex((h,i)=>i!==m.valor&&/^saldo/.test(h));
  if(iS<0)return null;
  const pts=[];
  const comValor=rows.filter(r=>String(r[m.valor]==null?'':r[m.valor]).trim()!=='').length;
  rows.forEach(r=>{if(String(r[iS]==null?'':r[iS]).trim()===''||String(r[m.valor]==null?'':r[m.valor]).trim()==='')return;const v=parseValorBR(r[m.valor]),s=parseValorBR(r[iS]);if(!isNaN(v)&&!isNaN(s))pts.push({v,s})});
  if(pts.length<2||pts.length<comValor*0.8)return null; // coluna Saldo esparsa (só no fim do dia): não dá pra conferir linha a linha
  let okA=0,okB=0;
  for(let i=0;i<pts.length-1;i++){
    if(Math.abs(pts[i+1].s+pts[i].v-pts[i].s)<0.011)okA++;   // mais novo primeiro: s(i) = s(i+1) + v(i)
    if(Math.abs(pts[i].s+pts[i+1].v-pts[i+1].s)<0.011)okB++;  // mais antigo primeiro: s(i+1) = s(i) + v(i+1)
  }
  const pares=pts.length-1,ok=Math.max(okA,okB),novoPrimeiro=okA>=okB;

/* Listas que podem crescer MUITO (clientes, tudo que vem de importação) — em vez de um documento
   só (que tem um teto de tamanho na nuvem), cada uma é dividida automaticamente em vários pedaços
   de 300 registros. Cabe até 9.000 registros por lista (30 pedaços) sem travar em tamanho nunca. */
const SHARD_SIZE=300,MAX_SHARDS=30;
const SHARD_DATA={},SHARD_LAST={},SHARD_COUNT_MAX={};
/* entradas, despesas e movContas já passaram de ~230 KB num documento só (o app se recusava a sincronizar e o que era lançado ficava
   só no aparelho). Agora também são fracionadas. `legado:true` = na 1ª abertura lê o documento antigo (data/<k>) e migra para os pedaços. */
const DB_SHARDED=[
  {k:'entradas',legado:true,size:400,get:()=>S.entradas,set:v=>{S.entradas=v}},
  {k:'despesas',legado:true,size:400,get:()=>S.despesas,set:v=>{S.despesas=v}},
  {k:'movContas',legado:true,size:400,get:()=>S.movContas||[],set:v=>{S.movContas=v}},
  {k:'clientes',get:()=>S.clientes,set:v=>{S.clientes=v}},
  {k:'impClientes',get:()=>S.imp.clientes,set:v=>{S.imp.clientes=v}},
  {k:'impContratos',get:()=>S.imp.contratos,set:v=>{S.imp.contratos=v}},
  {k:'impTransacoes',get:()=>S.imp.transacoes,set:v=>{S.imp.transacoes=v}},
  {k:'impFreq',get:()=>S.imp.freq,set:v=>{S.imp.freq=v}},
  {k:'impAgend',get:()=>S.imp.agend,set:v=>{S.imp.agend=v}},
  {k:'impCartaoCB',get:()=>S.imp.cartaoCB,set:v=>{S.imp.cartaoCB=v}},
  {k:'impComandas',get:()=>S.imp.comandas,set:v=>{S.imp.comandas=v}},
  {k:'impValoresAss',get:()=>S.imp.valoresAss,set:v=>{S.imp.valoresAss=v}}
];
function remontarShard(k){
  const partes=SHARD_DATA[k]||[];
  const arr=[];
  for(let i=0;i<partes.length;i++){if(partes[i])arr.push(...partes[i])}
  const chunk=DB_SHARDED.find(c=>c.k===k);
  if(chunk)chunk.set(arr);
}
async function initShardedChunk(c){
  try{
    SHARD_DATA[c.k]=[];
    for(let i=0;i<MAX_SHARDS;i++){
      DB.doc(`data/${c.k}_${i}`).onSnapshot(s=>{
        if(s.metadata&&s.metadata.hasPendingWrites)return;
        if(!s.exists&&!DB_CHUNK_READY[c.k])return; // pedaço ainda inexistente durante a carga/migração: não é "lista vazia", não apaga o que está na tela
        if(!s.exists&&SHARD_LAST[c.k+':'+i]===undefined){SHARD_LAST[c.k+':'+i]='[]';return} // pedaço que nunca existiu: nada a redesenhar
        const lista=s.exists?(destravar(s.data()).list||[]):[];
        const str=JSON.stringify(lista);
        if(str===SHARD_LAST[c.k+':'+i])return;
        SHARD_LAST[c.k+':'+i]=str;
        SHARD_DATA[c.k][i]=lista;
        remontarShard(c.k);
        renderSoon();
      },err=>{console.warn('db onSnapshot pedaço',c.k,i,err&&err.code);try{registrarErroDebug('onSnapshotShard:'+c.k+':'+i,err)}catch(e2){}});
    }
    const snaps=await Promise.race([
      Promise.all(Array.from({length:MAX_SHARDS},(_,i)=>DB.doc(`data/${c.k}_${i}`).get())),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))
    ]);
    let achouAlgo=false;
    snaps.forEach((s,i)=>{
      if(s.exists){
        achouAlgo=true;
        const lista=destravar(s.data()).list||[];
        SHARD_DATA[c.k][i]=lista;
        SHARD_LAST[c.k+':'+i]=JSON.stringify(lista);
      }
    });
    if(achouAlgo){remontarShard(c.k);render()}
    else{
      if(c.legado){ // migração: lê o documento único antigo e junta com o que ainda só existe aqui no aparelho
        try{
          const lg=await Promise.race([DB.doc('data/'+c.k).get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))]);
          if(lg.exists){
            const nuvem=destravar(lg.data()).list||[],ids=new Set(nuvem.map(x=>x&&x.id)),local=(c.get()||[]).filter(x=>x&&x.id&&!ids.has(x.id));
            c.set(nuvem.concat(local));
          }
        }catch(e){console.warn('migração',c.k,e);DB_CHUNK_READY[c.k]=false;throw e}
      }
      await flushShardedChunk(c,true);renderSoon();
    }
    DB_CHUNK_READY[c.k]=true;
  }catch(e){
    console.warn('db init (fracionado)',c.k,e);
    try{registrarErroDebug('initSharded:'+c.k,e)}catch(e2){}
    DB_CHUNK_READY[c.k]=!c.legado; // migração que falhou: não grava nada por cima até a próxima abertura
  }
}
async function flushShardedChunk(c,forcarTudo){
  const arr=c.get()||[];
  const TAM=c.size||SHARD_SIZE,totalPedacos=Math.max(1,Math.ceil(arr.length/TAM));
  for(let i=0;i<totalPedacos;i++){
    const fatia=arr.slice(i*TAM,(i+1)*TAM);
    const str=JSON.stringify(fatia);
    if(!forcarTudo&&str===SHARD_LAST[c.k+':'+i])continue;
    if(str.length>230000){
      console.warn('Pedaço grande demais mesmo fracionado:',c.k,i,str.length);
      toast(`Um pedaço de "${c.k}" ainda ficou grande demais — fale com o suporte.`);
      continue;
    }
    try{
      await DB.doc(`data/${c.k}_${i}`).set({list:fatia});
      SHARD_LAST[c.k+':'+i]=str;
      if(!SHARD_DATA[c.k])SHARD_DATA[c.k]=[];SHARD_DATA[c.k][i]=fatia; // mantém o espelho local igual ao que foi gravado (senão o eco da nuvem apagaria a lista)
    }catch(e){DB_FALHOU=true;console.warn('Falha ao sincronizar pedaço',c.k,i,e);try{registrarErroDebug('flushShard:'+c.k+':'+i,e)}catch(e2){}}
  }
  const anteriorMax=SHARD_COUNT_MAX[c.k]||0;
  for(let i=totalPedacos;i<anteriorMax;i++){
    try{await DB.doc(`data/${c.k}_${i}`).set({list:[]});SHARD_LAST[c.k+':'+i]=JSON.stringify([])}catch(e){}
  }
  SHARD_COUNT_MAX[c.k]=Math.max(totalPedacos,anteriorMax);
}
function scheduleDbSync(){
  if(window.CLOUD&&CLOUD.ativo){CLOUD.agendar();return}
  if(!DB_READY||!DB)return;
  clearTimeout(DB_TIMER);
  DB_TIMER=setTimeout(flushDbSync,600);
}
/* Nunca deixa duas rodadas de sincronização rodarem ao mesmo tempo (isso causava uma "corrida"
   onde pedaços ficavam se reescrevendo em loop e outros nunca chegavam a ser sincronizados de
   verdade). Se um save() acontece enquanto uma rodada já está em andamento, só agenda mais UMA
   rodada extra pra rodar assim que a atual terminar — nunca duas ao mesmo tempo. */
let DB_FLUSH_RODANDO=false,DB_FLUSH_PENDENTE=false,DB_FALHOU=false,DB_AVISOU_FALHA=false,DB_RETRY=null,SYNC_ULTIMO=0,DB_SUJO=false;
/* "Sujo" = tem alteração feita aqui que ainda não foi confirmada na nuvem. Serve pra (1) avisar antes de fechar a página e
   (2) gravar na hora quando a página some (troca de aba, recarregar, fechar), sem esperar o atraso de 0,6 s. */
function marcarSujo(){DB_SUJO=true}
function desmarcarSujo(){DB_SUJO=false}
function atualizarSyncBadge(){try{const el=document.querySelector('[data-act="syncinfo"] small');if(el&&SYNC_STATUS==='ao_vivo')el.textContent='Ao vivo · salvo '+new Date(SYNC_ULTIMO||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(_){}}
function salvarNuvemAgora(){if(!DB_READY||!DB)return;clearTimeout(DB_TIMER);flushDbSync()}
window.addEventListener('pagehide',salvarNuvemAgora);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')salvarNuvemAgora()});
window.addEventListener('beforeunload',e=>{if(DB_SUJO&&DB_READY){salvarNuvemAgora();e.preventDefault();e.returnValue=''}});
/* Salvamento forçado a cada 2 h: regrava TUDO na nuvem, mesmo o que o app acha que já está igual (garante que nada fica pra trás). */
const DOIS_HORAS=2*60*60*1000;
function salvamentoCompleto(){
  if(!DB_READY||!DB)return;
  Object.keys(DB_LAST).forEach(k=>delete DB_LAST[k]);
  Object.keys(SHARD_LAST).forEach(k=>delete SHARD_LAST[k]);
  flushDbSync();
}
setInterval(salvamentoCompleto,DOIS_HORAS);
async function flushDbSync(){
  if(!DB)return;
  if(DB_FLUSH_RODANDO){DB_FLUSH_PENDENTE=true;return}
  DB_FLUSH_RODANDO=true;DB_FALHOU=false;
  try{
    for(const c of DB_CHUNKS){
      if(!DB_CHUNK_READY[c.k])continue; // ainda carregando esse pedaço pela primeira vez — espera pra não sobrescrever
      try{
        const body=c.get();
        const str=JSON.stringify(body);
        if(str===DB_LAST[c.k])continue;
        if(str.length>230000){
          console.warn('Pedaço de dado grande demais para sincronizar:',c.k,str.length);
          toast(`"${c.k}" está grande demais pra sincronizar — fale com o suporte.`);
          continue;
        }
        await DB.doc('data/'+c.k).set(body);
        DB_LAST[c.k]=str; // só marca como sincronizado DEPOIS da escrita confirmar — se falhar, tenta de novo na próxima
      }catch(e){DB_FALHOU=true;console.warn('Falha ao sincronizar',c.k,e);try{registrarErroDebug('sync:'+c.k,e)}catch(e2){}}
    }
    for(const c of DB_SHARDED){
      if(!DB_CHUNK_READY[c.k])continue;
      try{await flushShardedChunk(c,false)}catch(e){DB_FALHOU=true;console.warn('Falha ao sincronizar (fracionado)',c.k,e);try{registrarErroDebug('syncSharded:'+c.k,e)}catch(e2){}}
    }
    if(DB_FALHOU){
      if(!DB_AVISOU_FALHA){DB_AVISOU_FALHA=true;toast('Não consegui salvar na nuvem agora — vou tentar de novo automaticamente. Não feche a página ainda.')}
      clearTimeout(DB_RETRY);DB_RETRY=setTimeout(flushDbSync,20000);
    }else{
      DB_AVISOU_FALHA=false;
      if(!DB_FLUSH_PENDENTE){SYNC_ULTIMO=Date.now();desmarcarSujo()}
      try{atualizarSyncBadge()}catch(_){}
    }
  }finally{
    DB_FLUSH_RODANDO=false;

}
const DB_CHUNK_READY={};
/* Cada "pedaço" carrega e sincroniza sozinho, em paralelo com os outros — se um travar ou
   demorar (rede lenta, etc.), os demais (incluindo a régua) continuam funcionando normalmente. */
/* O que vem da base compartilhada pode chegar "travado" (somente-leitura) — se a gente guardasse
   direto em S, qualquer tentativa de editar (ex.: adicionar uma despesa nova na lista) quebraria
   com "object is not extensible". Clonar antes garante que S sempre fica editável. */
function destravar(v){try{return JSON.parse(JSON.stringify(v))}catch(e){return v}}
/* Vários documentos da nuvem chegam quase juntos na abertura: redesenhar a tela a cada um travava o app (centenas de render()). Junta tudo num só. */
let RENDER_SOON_T=null;
function renderSoon(){clearTimeout(RENDER_SOON_T);RENDER_SOON_T=setTimeout(()=>{RENDER_SOON_T=null;render()},120)}
async function initChunk(c){
  try{
    const ref=DB.doc('data/'+c.k);
    const snap=await Promise.race([
      ref.get(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))
    ]);
    if(snap.exists){
      const body=destravar(snap.data());
      c.set(body);
      DB_LAST[c.k]=JSON.stringify(body);
      renderSoon();
    }else{
      const body=c.get();
      const str=JSON.stringify(body);
      if(str.length<=230000){await ref.set(body);DB_LAST[c.k]=str}
    }
    DB_CHUNK_READY[c.k]=true;
    ref.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites)return;
      const body=destravar(s.data());
      const str=JSON.stringify(body);
      if(str===DB_LAST[c.k])return;
      DB_LAST[c.k]=str;
      c.set(body);
      renderSoon();
    },err=>{console.warn('db onSnapshot',c.k,err&&err.code);try{registrarErroDebug('onSnapshot:'+c.k,err)}catch(e2){}});
  }catch(e){
    console.warn('db init',c.k,e);
    try{registrarErroDebug('initChunk:'+c.k,e)}catch(e2){}
    // mesmo com falha, libera esse pedaço pra tentar salvar depois — não fica travado pra sempre
    DB_CHUNK_READY[c.k]=true;
  }
}
/* Grava o erro técnico (mensagem, pilha, ação, tela) num documento separado só de diagnóstico,
   pra dar pra investigar de fora sem precisar que a pessoa abra o console do navegador.
   Guarda só os últimos 10, nunca trava nada (é só um "melhor esforço"). */
async function registrarErroDebug(acao,err){

function resizeImageParaEnvio(file){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const max=1400;let w2=img.width,h2=img.height;
          if(!w2||!h2){reject(new Error('sem-dimensoes'));return}
          if(w2>=h2){if(w2>max){h2=Math.round(h2*max/w2);w2=max}}else{if(h2>max){w2=Math.round(w2*max/h2);h2=max}}
          const cv=document.createElement('canvas');cv.width=w2;cv.height=h2;
          const ctx=cv.getContext('2d');
          if(!ctx){reject(new Error('sem-canvas'));return}
          ctx.drawImage(img,0,0,w2,h2);
          const dataUrl=cv.toDataURL('image/jpeg',0.82);
          cv.toBlob(blob=>{blob?resolve({blob,dataUrl}):reject(new Error('sem-blob'))},'image/jpeg',0.82);
        }catch(e){reject(e)}
      };
      img.onerror=()=>reject(new Error('img-invalida'));
      img.src=rd.result;
    };
    rd.onerror=()=>reject(new Error('leitura-falhou'));
    rd.readAsDataURL(file);
  });
}

/* ============ dados derivados ============ */
/* Período do app. Duas formas, sempre coerentes entre si:
   • V.range=null  → um mês (V.month) ou o ano todo (V.month==='all') de V.year — comportamento original;
   • V.range={de,ate} ('AAAA-MM') → intervalo livre (trimestre, semestre, vários meses, mesmo cruzando anos).
   Tudo que já usa inP/entP/desP (painel, DRE, comissões, listas…) acompanha sem precisar mudar. */
const inP=mesRef=>{
  if(V.range)return mesRef>=V.range.de&&mesRef<=V.range.ate;
  const {y,m}=ym(mesRef);return y===V.year&&(V.month==='all'||m===V.month);
};
const entP=()=>S.entradas.filter(r=>r.ativo&&inP(r.mesRef));
const desP=()=>S.despesas.filter(r=>r.ativo&&inP(r.mesRef));
function monthly(list){const a=Array(12).fill(0);list.forEach(r=>{if(!r.ativo)return;const {y,m}=ym(r.mesRef);if(y===V.year)a[m-1]+=r.valor});return a}
function statusDe(r){if(r.status==='Pago')return 'Pago';return r.vencimento&&r.vencimento<todayISO()?'Atrasado':'Previsto'}
function saldoTotal(){
  const t=todayISO();
  const e=S.entradas.filter(r=>r.ativo&&r.data<=t).reduce((s,r)=>s+r.valor,0);
  const d=S.despesas.filter(r=>r.ativo&&r.status==='Pago').reduce((s,r)=>s+r.valor,0);
  return round2(e-d);
}
function groupBy(list,key){const m={};list.forEach(r=>{const k=r[key]||'Sem categoria';m[k]=(m[k]||0)+r.valor});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function calcScore(){
  const rec=sum(entP()),desp=sum(desP()),t=todayISO();
  if(!S.entradas.length&&!S.despesas.length)return {n:0,status:'Sem dados',cor:'var(--muted)'};
  const margem=rec>0?(rec-desp)/rec:(desp>0?-1:0);
  const p1=clamp(margem/0.3,0,1)*50;
  const vencidas=S.despesas.filter(r=>r.ativo&&r.vencimento&&r.vencimento<t);
  const atras=vencidas.filter(r=>r.status!=='Pago');
  const p2=vencidas.length?(1-atras.length/vencidas.length)*30:30;
  const meses=monthly(S.despesas).filter(x=>x>0);
  const media=meses.length?meses.reduce((a,b)=>a+b,0)/meses.length:0;
  const p3=media>0?clamp(saldoTotal()/media/3,0,1)*20:0;
  const n=Math.round(p1+p2+p3);
  const st=n<40?['Crítico','var(--red)']:n<70?['Alerta','var(--amber)']:['Saudável','var(--green)'];
  return {n,status:st[0],cor:st[1]};
}
function avisos(){
  const out=[],t=todayISO();
  const atras=S.despesas.filter(r=>r.ativo&&r.status!=='Pago'&&r.vencimento&&r.vencimento<t);
  if(atras.length)out.push({tone:'red',txt:`${atras.length} conta(s) em atraso somando ${brl(sum(atras))}. Regularize para evitar juros.`});
  const prox=S.despesas.filter(r=>r.ativo&&r.status!=='Pago'&&r.vencimento&&r.vencimento>=t).sort((a,b)=>a.vencimento.localeCompare(b.vencimento))[0];
  if(prox){
    const dias=Math.round((new Date(prox.vencimento+'T00:00:00')-new Date(t+'T00:00:00'))/86400000);
    out.push({tone:dias<=3?'red':'',txt:`${dias===0?'Vence hoje':dias+' dia(s) para o vencimento'}: ${esc(prox.descricao||prox.subcategoria||prox.categoria)} (${brl(prox.valor)}). Pague antes para evitar atrasos.`});
  }
  const r=sum(entP()),d=sum(desP());
  if(r>0&&d>r)out.push({tone:'red',txt:'As despesas superam a receita no período selecionado.'});
  const amanha=addDiasISO(t,1);
  const voltandoAmanha=S.clientes.filter(c=>c.ativo!==false&&c.statusAssinatura==='Pausada'&&c.pausaFim===amanha);
  voltandoAmanha.forEach(c=>out.push({tone:'amb',txt:`${esc(c.nome)} volta da pausa amanhã (${fmtDate(c.pausaFim)}) — hora de ligar para ele(a).`}));
  const pausaVencida=S.clientes.filter(c=>c.ativo!==false&&c.statusAssinatura==='Pausada'&&c.pausaFim&&c.pausaFim<t);
  if(pausaVencida.length)out.push({tone:'red',txt:`${pausaVencida.length} assinante(s) com a pausa já vencida — confira e retome ou cancele.`});
  if(!S.entradas.length&&!S.despesas.length)out.push({tone:'',txt:'Comece lançando uma entrada e uma despesa, ou carregue os dados de exemplo em Ajustes.'});
  if(!out.length)out.push({tone:'green',txt:'Tudo em dia. Nenhum vencimento pendente.'});
  return out;
}

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function spark(arr,color){
  const mx=Math.max(...arr,1),pts=arr.map((v,i)=>`${(i/11*100).toFixed(1)},${(30-(v/mx)*26-2).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function lineChart(rend,desp){
  const W=360,H=190,L=38,B=22,T=8,R=8,mx=niceMax(Math.max(...rend,...desp,1));
  const x=i=>L+i*(W-L-R)/11,y=v=>T+(H-T-B)*(1-v/mx);

  for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-width="1"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--muted)">${brlC(v)}</text>`}
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=path(desp)+` L${x(11)} ${y(0)} L${x(0)} ${y(0)} Z`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${xl}<path d="${area}" fill="var(--amber)" opacity=".12"/><path d="${path(desp)}" fill="none" stroke="var(--amber)" stroke-width="2.2" stroke-linejoin="round"/><path d="${path(rend)}" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-dasharray="5 4" stroke-linejoin="round"/></svg>`;
}
function donut(items){
  const tot=items.reduce((s,i)=>s+i.v,0);
  if(!tot)return '<div class="tag">Sem dados</div>';
  let off=0,c='';
  items.forEach((it,k)=>{const p=it.v/tot*100;c+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${PALETA[k%PALETA.length]}" stroke-width="6" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=p});
  const svg=`<svg viewBox="0 0 42 42"><g transform="rotate(-90 21 21)">${c}</g><text x="21" y="22.5" text-anchor="middle" font-size="5" font-weight="700" fill="var(--text)">${brlC(tot)}</text></svg>`;
  const leg=items.map((it,k)=>`<div><i style="background:${PALETA[k%PALETA.length]}"></i>${esc(it.l)} <b>${Math.round(it.v/tot*100)}%</b></div>`).join('');

function gauge(n,cor){

/* ============ importação (Cash Barber + Celcoin) ============ */
function normHead(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
function normNome(s){return normHead(s).replace(/[^a-z0-9 ]/g,'').trim()}
/* ============ nomes parecidos: categorias, fontes de renda e subcategorias ============
   Uma regra só, usada ao GRAVAR (formulário, sugestão automática, todas as importações) e na
   LIMPEZA do histórico (unificarNomesParecidos). Objetivo: a mesma categoria digitada com um
   erro não abre uma linha nova no DRE. Nunca "chuta": na dúvida, mantém o nome digitado.
   Ordem de decisão (resolverNome):
   1. EXATO — mesmas letras ignorando maiúsculas, acentos, espaços e pontuação
      ("marketing", "Márketing", "Pró-labore"/"Pro labore"). Sem risco: já era tratado como igual.
   2. SINGULAR/PLURAL — palavra a palavra, regras do português (Taxa/Taxas, Comissão/Comissões,
      Aluguel/Aluguéis). O singular precisa ter 4+ letras: siglas não viram plural (INS×INSS, IS×ISS).
   3. ERRO DE DIGITAÇÃO — comparado PALAVRA A PALAVRA (mesmo nº de palavras; no máximo UMA palavra
      com erro; as outras iguais ou singular/plural). Na palavra, distância de edição Damerau (OSA)
      ≤ 1, com limite pelo tamanho da palavra mais curta:
        até 4 letras .... nunca (INSS×ISS, Luz×Lua, Taxa×Taxi, "Manutenção ar"×"Manutenção TV",
                          "Taxa ISS"×"Taxa INSS", "Loja A"×"Loja B" ficam sempre separados)
        5 a 8 letras .... 1 letra faltando, sobrando ou duas vizinhas trocadas — NÃO troca de
                          letra (Taxas×Taxis, Tarifas×Tarefas, Vendas×Rendas, Salários×Solários)
        9 ou mais ....... 1 diferença qualquer (Marketng, Marketting, Marketimg → Marketing)
      e ainda: a 1ª letra igual, palavras com números só se idênticas (Parcela 1×Parcela 2) e
      palavras que só mudam a vogal final não juntam (Consultoria×Consultório: feminino/masculino).
      Nunca 2 diferenças: nos testes, 2 diferenças juntavam coisas distintas (Contabilidade×
      Confiabilidade, "Fornecedor AB"×"Fornecedor CD"); erro real de digitação é quase sempre 1.
   4. AMBÍGUO — se o nome fica perto de 2+ nomes existentes, NÃO junta: grava como digitado.
   Qual grafia vence (a "estabelecida"): 1º a que está na lista de Personalizar (na ordem da lista;
   para subcategorias, as padrões do app), depois a com mais lançamentos, depois a mais antiga.
   Pares que a Caroline mandou manter separados (Desfazer / "Criar separada") ficam em
   S.config.nomesSeparados e nunca mais são juntados. */
function chaveNomeEsp(s){return normHead(s).replace(/[^a-z0-9]+/g,' ').trim()}
function chaveNome(s){return chaveNomeEsp(s).replace(/ /g,'')}
function distEdicao(a,b,max){
  const la=a.length,lb=b.length;if(Math.abs(la-lb)>max)return max+1;
  let p2=null,p=new Array(lb+1),c=new Array(lb+1);
  for(let j=0;j<=lb;j++)p[j]=j;
  for(let i=1;i<=la;i++){
    c[0]=i;let mn=i;
    for(let j=1;j<=lb;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);
      c[j]=v;if(v<mn)mn=v;

function hashStr(s){s=String(s);let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
/* Impressão digital de um lançamento vindo de Relatório/Extrato: mesma data+descrição+valor+conta = mesma

function parseCSV(text,delimForcado){
  text=String(text||'').replace(/^\uFEFF/,'');
  const linhas=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  const amostra=linhas.slice(0,8);
  let delim;
  if(delimForcado)delim=delimForcado;
  else if(amostra.some(l=>l.includes(';')))delim=';';
  else if(amostra.some(l=>l.includes('\t')))delim='\t';
  else{
    let estrutural=0;
    for(const l of amostra){
      const commas=(l.match(/,/g)||[]).length;
      const decimalish=(l.match(/\d,\d{2}(?!\d)/g)||[]).length;
      estrutural+=Math.max(0,commas-decimalish);
    }
    delim=estrutural>0?',':'\u0001';
  }
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else inQ=false}else field+=c}
    else{if(c==='"')inQ=true;else if(c===delim){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c==='\r'){}else field+=c}
  }
  if(field.length||row.length){row.push(field);rows.push(row)}
  while(rows.length&&rows[rows.length-1].every(x=>String(x).trim()===''))rows.pop();
  const headers=(rows.shift()||[]).map(h=>String(h).trim());
  if(delim===','){
    rows.forEach(row=>{while(row.length>headers.length&&/^\s*\d{1,2}\s*$/.test(row[row.length-1])){const cauda=row.pop();row[row.length-1]=row[row.length-1]+','+cauda.trim()}});
  }
  return {headers,rows};
}
function mapHeaders(headers,fieldSpecs){
  const norm=headers.map(normHead),used=new Array(headers.length).fill(false),map={};
  for(const [key,aliases] of fieldSpecs){for(const al of aliases){const idx=norm.findIndex((h,i)=>!used[i]&&h===al);if(idx>=0){map[key]=idx;used[idx]=true;break}}}
  for(const [key,aliases] of fieldSpecs){if(key in map)continue;for(const al of aliases){const idx=norm.findIndex((h,i)=>!used[i]&&h.includes(al));if(idx>=0){map[key]=idx;used[idx]=true;break}}}
  return map;
}
function parseValorBR(s){const v=parseMoney(s);return isNaN(v)?0:v}
function parseDataBR(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return iso(+m[3],+m[2],+m[1]);
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return iso(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})(?!\d)/);
  if(m){const yy=+m[3],yyyy=yy<=79?2000+yy:1900+yy;return iso(yyyy,+m[2],+m[1])}
  return '';
}

function classificaCanalCartao(s){const n=normHead(s);

}
function classificaStatusCartao(s){const n=normHead(s);
  if(/cancel/.test(n))return 'Cancelada';

  if(/pend|aguard/.test(n))return 'Pendente';

}
/* Relatório de Transações (Celcoin): a coluna "Operadora" mostra por qual dos dois módulos de cobrança da Celcoin
   a cobrança passou — cel_cash (cartão de crédito) ou boleto/Pix (manual). São dois módulos técnicos do MESMO
   processador (Celcoin) — por isso os valores são somados como um total único de "em dia"/"atrasado" (nunca
   mostrados como totais separados por canal), conforme pedido da Caroline. O canal fica salvo por linha só para
   diagnóstico interno (ex.: uma eventual investigação de divergência), nunca como recorte de destaque na tela. */
function classificaCanalTransacao(s){const n=normHead(s);
  if(/cel[ _-]?cash/.test(n))return 'Cobrança Celcoin (cel_cash)'; // módulo da Celcoin — NÃO quer dizer que o cliente paga no cartão
  if(/boleto|pix|manual/.test(n))return 'Manual (Boleto/Pix)';
  return n?'Outro':'';
}
/* Situação da cobrança nesta linha: não dá pra confiar só no texto do Status (ex.: "Aguardando pagamento"/"Em
   aberto" não dizem se já venceu) — por isso cruza com a data de Vencimento. Calculado na hora de usar (não fica
   gravado fixo), para uma cobrança que estava "Pendente" virar "Atrasada" sozinha quando o dia passar. */
function bucketTransacao(t,hoje){
  hoje=hoje||todayISO();
  const n=normHead(t.status);
  if(/cancel/.test(n))return 'Cancelada';
  if(/\bpag[oa]\b|aprovad|liquidad|confirmad|compensad|capturad/.test(n))return 'Paga';
  if(t.vencimento&&t.vencimento<hoje)return 'Atrasada';
  return 'Pendente';
}

/* Cobrança VENCIDA e em aberto na Celcoin (relatório de atrasados) — a menos que já tenha sido paga: botão "✅ Pago" no cliente
   (ultimoPagamento em/depois do vencimento) ou comanda de "Pagamento de assinatura" em/depois do vencimento. Devolve null se não
   há atraso a considerar. Usado pelos DOIS importadores (Cash Barber e Celcoin) pra que o status "Atrasada" seja a UNIÃO das
   duas fontes, independente da ordem em que os relatórios são importados. */
function atrasoCelcoinDe(nome){
  const k=normNome(nome),hoje=todayISO();
  const abertas=(S.imp.transacoes||[]).filter(t=>normNome(t.nome)===k&&bucketTransacao(t,hoje)==='Atrasada');
  if(!abertas.length)return null;
  const venc=abertas.map(t=>t.vencimento).filter(Boolean).sort()[0];
  const c=S.clientes.find(x=>normNome(x.nome)===k);
  if(c&&c.ultimoPagamento&&venc&&c.ultimoPagamento>=venc)return null;
  if((S.imp.comandas||[]).some(x=>normNome(x.nome)===k&&classificarTipoComanda(x.tipo)==='Assinaturas (Clube)'&&x.data&&venc&&x.data>=venc))return null;
  return {venc,dias:venc?Math.max(1,Math.round((new Date(hoje+'T00:00:00')-new Date(venc+'T00:00:00'))/86400000)):0};
}

/* ===== Candidatos a cancelamento (regra dos 2 meses) =====
   Cliente que está ATRASADO (Cash Barber ou Celcoin) e há 60 dias ou mais NÃO aparece na barbearia, sem horário marcado e sem
   pagamento recente conhecido, é candidato a ser cancelado (foi esquecido). Visita = atendimento finalizado na agenda, comanda
   fechada ou, na falta da data exata, o mês da frequência (usa o FIM do mês — conservador). Quem nunca aparece nos dados só conta
   se os dados de visita começam há 60 dias ou mais. O app NÃO cancela sozinho: "Cancelei" marca o cliente e tira do MRR; o
   cancelamento de verdade é no Cash Barber / Celcoin. */
const DIAS_CANCELAMENTO=60;
function candidatosCancelamento(subs){
  const hoje=todayISO(),LIM=DIAS_CANCELAMENTO,dt=d=>new Date(d+'T00:00:00'),dif=(a,b)=>Math.round((dt(b)-dt(a))/86400000);
  const fimMes=m=>{const [y,mm]=m.split('-').map(Number);return iso(y,mm,new Date(y,mm,0).getDate())};
  const exatas={},meses={},pagos={};
  (S.imp.agend||[]).forEach(a=>{if(a.data&&(/finalizad/i.test(a.status)||/chegou/i.test(a.statusCliente))){const k=normNome(a.nome);(exatas[k]=exatas[k]||[]).push(a.data)}});
  (S.imp.comandas||[]).forEach(c=>{if(!c.data)return;const k=normNome(c.nome);(exatas[k]=exatas[k]||[]).push(c.data);if(classificarTipoComanda(c.tipo)==='Assinaturas (Clube)')(pagos[k]=pagos[k]||[]).push(c.data)});
  (S.imp.freq||[]).forEach(f=>{if(f.qtd>0&&f.mesRef){const k=normNome(f.nome);(meses[k]=meses[k]||new Set()).add(f.mesRef)}});
  (S.imp.transacoes||[]).forEach(t=>{if(bucketTransacao(t,hoje)==='Paga'&&(t.dataStatus||t.vencimento)){const k=normNome(t.nome);(pagos[k]=pagos[k]||[]).push(t.dataStatus||t.vencimento)}});
  const datasAg=(S.imp.agend||[]).map(a=>a.data).filter(Boolean).sort(),mesesFq=(S.imp.freq||[]).map(f=>f.mesRef).filter(Boolean).sort();
  const inicioDados=[datasAg[0],mesesFq[0]?mesesFq[0]+'-01':null].filter(Boolean).sort()[0]||null;
  const cancelar=[],acompanhar=[];let ocultos=0,semDados=0;
  subs.filter(s=>s.status==='Ativo'&&s.tipoCliente==='Assinante').forEach(s=>{
    const k=normNome(s.nome),cli=S.clientes.find(x=>normNome(x.nome)===k);
    if(cli&&(cli.statusAssinatura==='Cancelada'||cli.statusAssinatura==='Pausada'||cli.canceladoEm))return;
    const atrasado=s.statusCliente==='Atrasada'||s.diasAtraso>0||s.statusPagRel==='Atrasado';
    if(!atrasado)return;
    const inicio=[s.dataInicio,s.inicioPlanilha].filter(Boolean).sort()[0]; // a mais antiga: a "data de criação" do contrato pode ser recente em quem só trocou de plano
    if(inicio&&dif(inicio,hoje)<LIM)return;                    // assinante novo
    if(s.proximoAgendamento)return;                            // tem horário marcado: vai voltar
    const pg=[cli&&cli.ultimoPagamento].concat(pagos[k]||[]).filter(Boolean).filter(d=>d<=hoje).sort().pop()||'';
    if(pg&&dif(pg,hoje)<LIM)return;                            // pagou recentemente
    if(cli&&cli.manterCancelamentoAte&&cli.manterCancelamentoAte>=hoje){ocultos++;return}
    const ex=(exatas[k]||[]).filter(d=>d<=hoje).sort();let ult=ex.length?ex[ex.length-1]:null;
    [...(meses[k]||[])].forEach(m=>{if(!ex.some(d=>d.slice(0,7)===m)){let d=fimMes(m);if(d>hoje)d=hoje;if(!ult||d>ult)ult=d}});
    let dias,semVisita=false;
    if(ult)dias=dif(ult,hoje);
    else{if(!inicioDados||dif(inicioDados,hoje)<LIM){semDados++;return}dias=dif(inicioDados,hoje);semVisita=true}
    const atraso=s.diasAtraso>0?`Celcoin: vencido há ${s.diasAtraso}d`:(s.statusCliente==='Atrasada'?'Cash Barber: atrasado':'Relatório de assinatura: atrasado');
    const linha={nome:s.nome,plano:s.plano,valor:s.valorMensal,canal:s.canalPag,ult,dias,semVisita,atraso,pagamento:pg,telefone:cli?cli.telefone:'',cruza:ult?addDiasISO(ult,LIM):''};
    if(dias>=LIM)cancelar.push(linha);else if(dias>=LIM-25)acompanhar.push(linha);
  });
  cancelar.sort((a,b)=>b.dias-a.dias||b.valor-a.valor);acompanhar.sort((a,b)=>(a.cruza||'').localeCompare(b.cruza||''));
  return {cancelar,acompanhar,ocultos,semDados,inicioDados,valorCancelar:round2(cancelar.reduce((a,x)=>a+x.valor,0))};
}

  ${C.acompanhar.length?`<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Acompanhar: ${C.acompanhar.length} perto dos ${DIAS_CANCELAMENTO} dias</summary><div style="margin-top:8px">${C.acompanhar.map(linha).join('')}</div></details>`:''}

const IMPORTERS={
  clientes:{titulo:'Clientes (Cash Barber)',multi:false,

    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>({
      nome:(r[m.nome]||'').trim(),cpfDig:soDigitos(r[m.cpf]),email:(r[m.email]||'').trim(),telefone:soDigitos(r[m.telefone]),

      const meses=[];headers.forEach((h,i)=>{if(/^\d{2}\/\d{4}$/.test(String(h).trim()))meses.push(i)});
      const out=[];
      rows.forEach(r=>{

      return rows.map(r=>{

        return {nome,profissional:(r[m.profissional]||'').trim(),origem:(r[m.origem]||'').trim(),
          dataHora:(r[m.dataHora]||'').trim(),data:parseDataBR(r[m.dataHora]),status:(r[m.status]||'').trim(),
          statusCliente:(r[m.statusCliente]||'').trim(),email:em?em[0]:'',telefone:tel?soDigitos(tel[0]):''};
      }).filter(x=>x.nome)}},
  contratos:{titulo:'Contratos/Assinaturas (Celcoin ou relatório de status)',multi:false,
    fields:[['codigo',['codigo']],['cliente',['cliente']],['documento',['documento do cliente','documento']],
      ['plano',['plano']],['valor',['valor']],['periodicidade',['periodicidade']],['quantidade',['quantidade']],
      ['dataPrimeira',['data da primeira transacao','data de criacao']],['status',['status']]],
    parse(headers,rows){const m=mapHeaders(headers,this.fields);return rows.map(r=>{
      const statusBruto=(r[m.status]||'').trim();
      const nomeBruto=(r[m.cliente]||'').trim();
      // Relatório simples de "assinaturas ativas" (Cliente/Plano/Status/Data de criação) usa valores
      // técnicos em inglês pro status de pagamento ("em dia"/"pastdue"/"not_authorized") em vez de
      // Ativo/Cancelado do Celcoin. "Em dia" = em dia; "pastdue" e "not_authorized" = Atrasado — as duas

      const statusPagamento=sNorm==='em dia'?'Em dia':ehDesseRelatorio?'Atrasado':(sNorm===''&&!/^total/i.test(nomeBruto)?'Atrasado':'');
      // Toda linha desse relatório é uma assinatura ativa — o status ali é sobre o pagamento, não sobre
      // o contrato estar ativo ou não. Um texto que não bate com nenhum valor conhecido (ex.: "Cancelado"
      // do Celcoin) fica como veio, sem virar Ativo.
