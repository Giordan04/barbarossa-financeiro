    ${CM.semVinculoAssin>0?`<div class="aviso amb" style="margin-top:8px"><b>${brl(CM.semVinculoAssin)}</b> são <b>pagamentos de assinatura</b>: o relatório não diz qual barbeiro atendeu, e a <b>regra de comissão sobre assinaturas ainda não está definida</b>. Por enquanto a comissão calculada considera só os atendimentos avulsos.</div>`:''}
    <div class="formula"><code>comissão = receita das entradas vinculadas ao colaborador × % de comissão</code>. Para vincular, escolha "Colaborador que atendeu" ao lançar a entrada. Use o período no topo para mudar o mês.</div></div>`;
}

/* ===== Acerto do barbeiro: comissão CHEIA − descontos = LÍQUIDO A PAGAR =====
   Você lança a comissão cheia (+ Comissão). Do líquido saem: a parcela do adiantamento (vale que volta aos poucos), as compras que
   ele fez (descontar) e outros acertos (pra mais ou pra menos). Efeito no DRE: a COMISSÃO continua cheia como custo; o adiantamento
   NÃO é custo (é dinheiro que volta); a compra de produto da barbearia vira VENDA (revenda) pra ele, pra a receita não sumir. */
/* Barbeiro (ou quem tem % de comissão) tem comissão; administrativo/recepção/gestor sem % só tem vale/adiantamento e compras. */
const colabTemComissao=c=>(+c.comissaoPct>0)||/barbeir/i.test(c.funcao||'');
const ehSalarioDesp=r=>normHead(r.subcategoria).startsWith('salar');
const mesDesloc=(ymS,off)=>{const [y,m]=ymS.split('-').map(Number);const t=y*12+(m-1)+off;return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`};
const nomesBarbeiros=()=>new Set(S.colaboradores.filter(colabTemComissao).map(c=>c.nome));
const MESES_CURTO=['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesNomeCurto=ym=>ym&&ym.length>=7?`${MESES_CURTO[+ym.slice(5,7)]}/${ym.slice(2,4)}`:'';
const mesSeguinte=ym=>{let [y,m]=ym.split('-').map(Number);m++;if(m>12){m=1;y++}return `${y}-${pad(m)}`};
const mesAnterior=ym=>{let [y,m]=ym.split('-').map(Number);m--;if(m<1){m=12;y--}return `${y}-${pad(m)}`};
/* Mês de referência do acerto: a comissão é do mês TRABALHADO e paga no 5º dia útil do seguinte. Então o acerto "da vez" é sempre o mês
   ANTERIOR. Quando o acerto desse mês é pago, o cartão do barbeiro zera e passa a mostrar o mês corrente (acumulando, a pagar no mês que vem). */
const mesAcerto=c=>{const hoje=todayISO().slice(0,7),ant=mesAnterior(hoje);return c&&(S.fechamentosColab||[]).some(f=>f.colaboradorId===c.id&&f.mesRef===ant)?hoje:ant};
const saldoAdiantamento=a=>a.tipo==='recorrente'?0:round2(Math.max(0,a.valor-(a.descontos||[]).reduce((x,d)=>x+d.valor,0))); // vale recorrente não tem saldo: repete todo mês até parar
function acertoColab(c,ym){
  const noMes=r=>(r.mesRef||(r.vencimento||r.data||'').slice(0,7))===ym;
  const doColab=r=>r.ativo!==false&&r.colaborador===c.nome&&r.categoria==='Pessoal'&&noMes(r);
  const comissoes=S.despesas.filter(r=>doColab(r)&&(ehComissaoDesp(r)||(!colabTemComissao(c)&&ehSalarioDesp(r))));
  const bonifs=S.despesas.filter(r=>doColab(r)&&normHead(r.subcategoria).startsWith('bonific'));
  const comissao=round2(comissoes.reduce((a,r)=>a+r.valor,0)),bonif=round2(bonifs.reduce((a,r)=>a+r.valor,0));
  const parcelas=[];
  (S.adiantamentos||[]).filter(a=>a.colaboradorId===c.id).forEach(a=>{
    const rec=a.tipo==='recorrente',feito=(a.descontos||[]).find(d=>d.mesRef===ym);
    if(feito){parcelas.push({adId:a.id,descricao:a.descricao||(rec?'Vale recorrente':'Vale / adiantamento'),valor:feito.valor,feito:true,unica:a.tipo==='vale',rec,saldoApos:rec?null:saldoAdiantamento(a)});return}
    if(rec){if(!a.encerrado&&(a.inicio||'')<=ym&&(!a.fim||ym<=a.fim))parcelas.push({adId:a.id,descricao:a.descricao||'Vale recorrente',valor:a.valor,feito:false,rec:true,saldoApos:null});return}
    // Vale avulso e empréstimo: a 1ª parcela cai no PRIMEIRO acerto ainda em aberto a partir do início (meses já fechados ficam pra trás)
    // e as seguintes nos meses seguintes. Assim o mesmo valor não aparece em vários meses ao mesmo tempo.
    const saldo=saldoAdiantamento(a);
    if(saldo>0.004){
      let primeiro=a.inicio||ym,g=0;
      while(S.fechamentosColab.some(f=>f.colaboradorId===c.id&&f.mesRef===primeiro)&&g++<240)primeiro=mesSeguinte(primeiro);
      if(ym>=primeiro){
        const n=(+ym.slice(0,4)-+primeiro.slice(0,4))*12+(+ym.slice(5,7)-+primeiro.slice(5,7));
        let resto=saldo,v=0;
        for(let k=0;k<=n;k++){v=round2(Math.min(a.descontoMensal>0?a.descontoMensal:resto,resto));if(k<n)resto=round2(resto-v)}
        if(v>0.004)parcelas.push({adId:a.id,descricao:a.descricao||'Vale / adiantamento',valor:v,feito:false,unica:a.tipo==='vale',rec:false,saldoApos:round2(resto-v)});
      }
    }
  });
  // vale lançado como despesa (Pessoal › Vale/Adiantamento) com competência neste mês: também é descontado da comissão
  S.despesas.filter(r=>doColab(r)&&r.subcategoria==='Vale/Adiantamento').forEach(r=>parcelas.push({adId:null,despId:r.id,desp:true,descricao:r.descricao||'Vale / adiantamento',valor:r.valor,feito:false,unica:true,rec:false,saldoApos:0}));
  const compras=(S.comprasColab||[]).filter(x=>x.colaboradorId===c.id&&x.mesRef===ym);
  const outros=(S.acertosColab||[]).filter(x=>x.colaboradorId===c.id&&x.mesRef===ym);
  const dAd=round2(parcelas.reduce((a,p)=>a+p.valor,0)),dCp=round2(compras.reduce((a,x)=>a+x.valor,0)),oTot=round2(outros.reduce((a,x)=>a+(x.sinal==='soma'?x.valor:-x.valor),0));
  const fec=(S.fechamentosColab||[]).find(f=>f.colaboradorId===c.id&&f.mesRef===ym)||null;
  return {comissao,comissoes,bonif,bonifs,parcelas,compras,outros,dAd,dCp,oTot,liquido:round2(comissao+bonif-dAd-dCp+oTot),fec};
}
function acertoCartaoHTML(c){
  const ym=mesAcerto(c),A=acertoColab(c,ym),tc=colabTemComissao(c),emAndamento=ym===todayISO().slice(0,7);
  const saldoTot=round2((S.adiantamentos||[]).filter(a=>a.colaboradorId===c.id).reduce((x,a)=>x+saldoAdiantamento(a),0));
  const recs=(S.adiantamentos||[]).filter(a=>a.colaboradorId===c.id&&a.tipo==='recorrente'&&!a.encerrado&&(a.inicio||'')<=ym&&(!a.fim||ym<=a.fim));
  if(!tc&&!A.comissao&&!A.bonif&&!A.parcelas.length&&!A.compras.length&&!A.outros.length&&!saldoTot)return '';
  const base=tc?'Comissão cheia':'Salário';
  return `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)">
    ${saldoTot>0?`<div class="tag" style="margin-bottom:6px">Vale/empréstimo em aberto: saldo <b>${brl(saldoTot)}</b></div>`:''}
    ${recs.length?`<div class="tag" style="margin-bottom:6px">Vale recorrente: <b>${brl(round2(recs.reduce((x,a)=>x+a.valor,0)))}</b> todo mês, descontado do acerto</div>`:''}
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">
      <div><div class="lbl">${base} (${mesNomeCurto(ym)}${emAndamento?' · em andamento, paga no mês que vem':' · a pagar agora'})</div><b>${brl(A.comissao)}</b>${A.bonif>0?`<div class="tag">+ bonificação ${brl(A.bonif)}</div>`:''}</div>
      <div><div class="lbl">(−) Descontos e acertos</div><b class="${(A.dAd+A.dCp-A.oTot)>0?'neg':''}">${brl(round2(A.dAd+A.dCp-A.oTot))}</b></div>
      <div><div class="lbl">Líquido a pagar</div><b class="${A.liquido<0?'neg':'pos'}" style="font-size:16px">${brl(A.liquido)}</b>${A.liquido<0?`<div class="tag">ele fica devendo ${brl(-A.liquido)}</div>`:''}</div>
      <button class="btn sm ${A.fec?'sec':'ok'}" data-act="abriracerto" data-id="${c.id}" data-ym="${ym}">${A.fec?'Acerto pago ✓':'Acerto do mês'}</button>
    </div></div>`;
}
function abrirAcertoColab(id,ym){
  const c=S.colaboradores.find(x=>x.id===id);if(!c)return;
  ym=ym||mesAcerto(c);const A=acertoColab(c,ym),f=A.fec;
  const linha=(txt,val,extra='')=>`<div class="row" style="cursor:default;padding:6px 0"><div class="rm"><b>${txt}</b></div><div class="rv">${val}${extra}</div></div>`;
  const xbtn=(act,id2)=>`<button class="btn sm warn" style="padding:0 8px;margin-left:6px" data-act="${act}" data-id="${id2}" data-colab="${id}" data-ym="${ym}" title="Excluir">×</button>`;
  const com=f?f.comissao:A.comissao,bon=f?(f.bonif||0):A.bonif,liq=f?f.liquido:A.liquido;
  const mudou=f&&Math.abs(f.liquido-A.liquido)>0.009;
  const abertos=(S.adiantamentos||[]).filter(a=>a.colaboradorId===id&&a.tipo!=='recorrente'&&saldoAdiantamento(a)>0);
  const recs=(S.adiantamentos||[]).filter(a=>a.colaboradorId===id&&a.tipo==='recorrente'&&!a.encerrado&&(a.inicio||'')<=ym&&(!a.fim||ym<=a.fim));
  const subParc=p=>p.desp?'vale lançado · '+(S.despesas.find(r=>r.id===p.despId)||{}).status:p.rec?'vale recorrente · todo mês':(p.unica?'desconto do vale':`parcela · saldo depois: ${brl(p.saldoApos)}`);
  openModal(`<h2>Acerto — ${esc(c.nome)}</h2>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><button class="btn sm sec" data-act="acertomes" data-id="${id}" data-ym="${mesAnterior(ym)}">‹</button><b>${mesNomeCurto(ym)}</b><button class="btn sm sec" data-act="acertomes" data-id="${id}" data-ym="${mesSeguinte(ym)}">›</button>${f?`<span class="pill pago">Pago em ${fmtDate(f.pagoEm)}</span>`:''}</div>
  ${linha(`${colabTemComissao(c)?'Comissão cheia':'Salário'}${A.comissoes.length?` <small>(${A.comissoes.length} lançamento${A.comissoes.length>1?'s':''})</small>`:''}`,brl(com))}
  ${f?(bon?linha('(+) Bonificações',`<span class="pos">+ ${brl(bon)}</span>`):''):A.bonifs.map(x=>linha(`(+) ${esc(x.descricao||'Bonificação')}`,`<span class="pos">+ ${brl(x.valor)}</span>`,xbtn('delbonif',x.id))).join('')}
  ${A.parcelas.map(p=>linha(`(−) ${esc(p.descricao)} <small>${subParc(p)}</small>`,`<span class="neg">− ${brl(p.valor)}</span>`)).join('')}
  ${A.compras.map(x=>linha(`(−) Compra: ${esc(x.descricao||'—')} <small>${fmtDate(x.data)}</small>`,`<span class="neg">− ${brl(x.valor)}</span>`,f?'':xbtn('delcompracolab',x.id))).join('')}
  ${A.outros.map(x=>linha(`${x.sinal==='soma'?'(+)':'(−)'} ${esc(x.descricao||'Acerto')}`,`<span class="${x.sinal==='soma'?'pos':'neg'}">${x.sinal==='soma'?'+':'−'} ${brl(x.valor)}</span>`,f?'':xbtn('delacertocolab',x.id))).join('')}
  ${(!A.parcelas.length&&!A.compras.length&&!A.outros.length&&!A.bonifs.length&&!f)?'<div class="hint" style="margin:6px 0">Sem descontos neste mês.</div>':''}
  <div class="row" style="cursor:default;border-top:2px solid var(--border);margin-top:6px;padding-top:8px"><div class="rm"><b style="font-size:15px">LÍQUIDO A PAGAR</b></div><div class="rv"><b class="${liq<0?'neg':'pos'}" style="font-size:18px">${brl(liq)}</b>${liq<0?`<div class="tag">ele fica devendo ${brl(-liq)} — vira desconto no mês seguinte</div>`:''}</div></div>

/* ===== Comissão no modelo do Cash Barber (validado com setembro/2026) =====
   Por barbeiro: AVULSO (% fixo do barbeiro × serviços pagos fora do plano) + POTE (30% das assinaturas recebidas, dividido pelos MINUTOS
   de serviço do clube de cada barbeiro) + PRODUTOS (só cosméticos, por faixa: <1.201 = 15% · ≥1.201 = 25% · ≥2.501 = 35%) − VALE.
   O relatório "D pote" do Cash Barber (Filial | Profissional | Serviço | Realizados) fornece os minutos; ficha = minutos do serviço. */
const CB_FAIXAS=[[2501,35],[1201,25],[0,15]];
const cbFaixas=()=>(S.config.cbFaixas&&S.config.cbFaixas.length===3?S.config.cbFaixas:CB_FAIXAS);
const cbFaixa=v=>(cbFaixas().find(f=>v>=f[0])||[0,0])[1];
function cbMinServ(nome){
  const n=normHead(nome);
  if(/sem degrade/.test(n))return 20;
  if(/maquina/.test(n)&&/barba/.test(n))return 25;
  if(/acabamento/.test(n)&&/cabelo/.test(n))return 10;
  if(/infantil/.test(n)&&/corte/.test(n))return 30;
  if(/desenhar/.test(n)&&/barba/.test(n))return 30;
  if(n==='corte de cabelo')return 30;
  return 0;
}
const cbMesPadrao=()=>mesAnterior(todayISO().slice(0,7));
const cbMes=()=>(V.month!=='all'&&!V.range&&V.year)?`${V.year}-${pad(V.month)}`:cbMesPadrao();
function cbIrMes(ym){const [y,m]=String(ym).split('-').map(Number);if(!y||!m)return;V.year=y;V.month=m;V.range=null;V.preset='mes'}
function cbCfg(ym,criar){S.comissaoCB=S.comissaoCB||{};if(!S.comissaoCB[ym]&&criar)S.comissaoCB[ym]={min:{},det:{},avulso:{},cosm:{},bonus:{}};return S.comissaoCB[ym]||{}}
function cbParsePote(txt){
  const porColab={},naoAchados={},ignorados={};
  String(txt||'').split(/\r?\n/).forEach(l=>{
    const cel=l.split(/\t| {2,}|\s*\|\s*/).map(x=>x.trim()).filter(x=>x!=='');
    if(cel.length<3)return;
    const q=parseInt(cel[cel.length-1].replace(/\./g,''),10);if(isNaN(q))return;
    const serv=cel[cel.length-2],prof=cel[cel.length-3];
    if(/profissional/i.test(prof)&&/servi/i.test(serv))return;
    const c=colaboradorDoProfissional(prof);
    if(!c){naoAchados[prof]=(naoAchados[prof]||0)+q;return}
    const m=cbMinServ(serv);
    if(!m){ignorados[serv]=(ignorados[serv]||0)+q;return}
    const o=porColab[c.id]=porColab[c.id]||{min:0,det:{}};
    o.min+=m*q;o.det[serv]=(o.det[serv]||0)+q;
  });
  return {porColab,naoAchados,ignorados};
}
function calcCB(ym){
  const cfg=cbCfg(ym),potePct=cfg.potePct!=null?cfg.potePct:30;
  const E=S.entradas.filter(r=>r.ativo&&r.mesRef===ym);
  const assinAuto=round2(sum(E.filter(r=>r.fonte==='Assinaturas (Clube)')));
  const assinBase=cfg.assinBase!=null?cfg.assinBase:assinAuto;
  const pote=round2(assinBase*potePct/100);
  const bar=S.colaboradores.filter(c=>c.ativo!==false&&colabTemComissao(c));
  const minTot=bar.reduce((s,c)=>s+(+((cfg.min||{})[c.id])||0),0);
  const vm=minTot>0?pote/minTot:0;
  const porColab={};
  bar.forEach(c=>{
    const pct=Number(c.comissaoPct)||0;
    const avAuto=round2(sum(E.filter(r=>r.colaboradorId===c.id&&r.fonte!=='Assinaturas (Clube)')));
    const avBase=(cfg.avulso||{})[c.id]!=null?cfg.avulso[c.id]:avAuto;
    const min=+((cfg.min||{})[c.id])||0,cosm=+((cfg.cosm||{})[c.id])||0,bonus=+((cfg.bonus||{})[c.id])||0;
    const dif=Number(c.poteDifPct)||0,adicPct=Number(c.adicionalPct)||0;
    const avulso=round2(avBase*pct/100),poteBase=round2(vm*min),poteV=potePct>0?round2(poteBase*(potePct+dif)/potePct):poteBase,faixaAuto=cbFaixa(cosm),faixaMan=(cfg.faixa||{})[c.id],faixa=faixaMan!=null?faixaMan:faixaAuto,produto=round2(cosm*faixa/100);
    const adicional=round2(avBase*adicPct/100); // só a cadeira (corte/barba pagos fora do plano); cosméticos não entram
    // bônus por meta: produção = serviços avulsos + pote dele + cosméticos vendidos; sem meta (0) o bônus vale sempre
    const bm=c.bonusMeta||{},meta=Number(bm.meta)||0,producao=round2(avBase+poteV+cosm),metaOk=meta>0?producao>=meta:true;
    const bCad=round2(metaOk?(avBase+poteV)*(Number(bm.cad)||0)/100:0),bProd=round2(metaOk?cosm*(Number(bm.prod)||0)/100:0),bExt=round2(metaOk?avulso*(Number(bm.ext)||0)/100:0);
    const bonusMeta=round2(bCad+bProd+bExt),temBonus=!!((Number(bm.cad)||0)||(Number(bm.prod)||0)||(Number(bm.ext)||0));
    const brutoCalc=round2(avulso+poteV+produto+adicional+bonusMeta+bonus),totMan=(cfg.total||{})[c.id],bruto=totMan!=null?totMan:brutoCalc;
    const A=acertoColab(c,ym);
    const valeAuto=A.dAd,vale=(cfg.vale||{})[c.id]!=null?cfg.vale[c.id]:valeAuto;
    const lancada=round2(S.despesas.filter(r=>r.ativo!==false&&r.colaborador===c.nome&&r.categoria==='Pessoal'&&ehComissaoDesp(r)&&(r.mesRef||(r.vencimento||r.data||'').slice(0,7))===ym).reduce((a,r)=>a+r.valor,0));
    const fec=(S.fechamentosColab||[]).find(f=>f.colaboradorId===c.id&&f.mesRef===ym)||null;
    porColab[c.id]={brutoCalc,totMan,fec,faixaAuto,faixaMan,meta,producao,metaOk,bCad,bProd,bExt,bonusMeta,temBonus,bm,pct,dif,adicPct,adicional,poteBase,avAuto,avBase,avulso,min,poteV,cosm,faixa,produto,bonus,bruto,vale,valeAuto,liquido:round2(bruto-vale),lancada,falta:round2(bruto-lancada)};
  });
  return {ym,cfg,potePct,assinAuto,assinBase,pote,minTot,vm,porColab,temMin:minTot>0};
}

function cbEditar(el){
  const f=el.dataset.cb,id=el.dataset.id;
  if(f==='mes'){if(el.value)cbIrMes(el.value);render();return}
  const num=()=>{const t=String(el.value||'').trim();if(t==='')return null;const n=parseMoney(t);return isNaN(n)?null:round2(n)};
  snap();
  const colab=S.colaboradores.find(c=>c.id===id);
  if(f==='pct'){const n=num()||0;if(colab){colab.comissaoPct=n;colab.percentualComissao=n}save();render();return}
  if(f==='dif'){if(colab)colab.poteDifPct=num()||0;save();render();return}
  if(f==='adic'){if(colab)colab.adicionalPct=num()||0;save();render();return}
  if(f==='bmeta'||f==='bcad'||f==='bprod'||f==='bext'){if(colab){colab.bonusMeta=colab.bonusMeta||{};colab.bonusMeta[{bmeta:'meta',bcad:'cad',bprod:'prod',bext:'ext'}[f]]=num()||0}save();render();return}
  if(f==='faixa'){const cf=cbCfg(cbMes(),true);cf.faixa=cf.faixa||{};const v=el.value===''?null:+el.value;if(v==null)delete cf.faixa[id];else cf.faixa[id]=v;save();render();return}
  if(f==='fxmin'||f==='fxpct'){
    const fx=cbFaixas().map(x=>x.slice()),i=+el.dataset.i,n=num();
    if(n==null)return;
    fx[i][f==='fxmin'?0:1]=Math.max(0,n);
    S.config.cbFaixas=fx.sort((a,b)=>b[0]-a[0]);save();render();return;
  }
  const ym=cbMes(),cfg=cbCfg(ym,true);
  if(f==='assin'){const n=num();if(n==null)delete cfg.assinBase;else cfg.assinBase=n}
  else if(f==='potepct'){const n=num();cfg.potePct=n==null?30:n}
  else{
    const campo={min:'min',avulso:'avulso',cosm:'cosm',vale:'vale',ajuste:'bonus',total:'total'}[f];if(!campo)return;
    cfg[campo]=cfg[campo]||{};const n=num();
    if(n==null)delete cfg[campo][id];else cfg[campo][id]=f==='min'?Math.round(n):n;
    if(f==='min'&&cfg.det)delete cfg.det[id];
  }
  save();render();
}

const NOMES_REL={comissoes:'Comissão dos barbeiros',dre:'DRE — Demonstrativo de Resultado',fluxo:'Fluxo de Caixa',indicadores:'Indicadores de Gestão',catalogo:'Catálogo de Produtos, Serviços e Bar/Cozinha'};
function imprimirRelatorio(rel){
  const alvo={dre:'dre',fluxo:'fluxocaixa',indicadores:'indicadores',comissoes:'colaboradores'}[rel]||V.tab;
  if(V.tab!==alvo){V.tab=alvo;render()}
  const app=$('#app');const velho=document.getElementById('printhead');if(velho)velho.remove();
  const ph=document.createElement('div');ph.id='printhead';ph.className='printhead';
  const d=new Date(),periodo=rel==='fluxo'?`Ano ${V.year}`:tituloPeriodoDRE();
  ph.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div>${S.config.logoDataUrl?`<img src="${S.config.logoDataUrl}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px">`:''}<b style="font-size:17pt">Barbearia Barbarossa</b><div style="font-size:11pt;margin-top:2px">${esc(NOMES_REL[rel]||'Relatório')} · ${esc(periodo)}</div></div><div style="font-size:9pt;color:#555;text-align:right">Gerado em ${fmtDate(todayISO())} às ${pad(d.getHours())}:${pad(d.getMinutes())}<br>Gramado/RS</div></div>`;

    L4.push(['Receita Bruta do período (Entradas ativas — mesma base do DRE e do Fluxo de Caixa)',receitaTotal]);
    L4.push(['Receita com produto/serviço identificado (soma de "Vendas por item")',receitaComItem]);
    L4.push(['Receita sem produto/serviço vinculado (ex.: assinatura sem campo preenchido)',receitaSemItem]);
    if(Object.keys(porGrupoImportado).length){
      L4.push([],[`Comparação com o relatório de categorias enviado (período ${fmtDate(pDe)} a ${fmtDate(pAte)})`]);
      L4.push(['Categoria','Lançado no sistema (R$)','Relatório enviado (R$)','Diferença (R$)']);
      const grupos=[...new Set([...Object.keys(porFonte),...Object.keys(porGrupoImportado)])];
      grupos.forEach(g=>{const lanc=porFonte[g]||0,rep=porGrupoImportado[g]||0;L4.push([g,lanc,rep,round2(lanc-rep)])});
    }else{
      L4.push([],['Nenhum relatório de categorias importado cobrindo este período — sem comparação disponível.']);
    }
    return [{nome:'Catálogo',linhas:L1},{nome:'Vendas por item',linhas:L2},{nome:'Receita por categoria',linhas:L3},{nome:'Conferência',linhas:L4}];
  }
  if(rel==='dre'){
    const K=calcDRE(),p=v=>K.receita>0?round2(v/K.receita*100):null;
    const L=[['DRE gerencial — Barbearia Barbarossa'],['Período',tituloPeriodoDRE()],['Gerado em',fmtDate(todayISO())],[],['Linha','Valor (R$)','% da receita']];
    L.push(['(+) Receita Bruta',K.receita,p(K.receita)],['(-) Comissões de barbeiros',-K.comissoes,p(K.comissoes)],['(-) Bonificações',-K.bonificacoes,p(K.bonificacoes)],['(-) Insumos',-K.insumos,p(K.insumos)],['(-) Taxas de cartão / maquininha',-K.taxas,p(K.taxas)],['(=) Margem de Contribuição',K.margemContribuicao,p(K.margemContribuicao)],['(-) Pessoal (salários/benefícios)',-K.pessoalFixo,p(K.pessoalFixo)]);
    K.operacionais.forEach(o=>L.push([`(-) ${o.nome}`,-o.valor,p(o.valor)]));
    L.push(['(=) Resultado Operacional',K.resultadoOperacional,p(K.resultadoOperacional)],['(-) Despesas Financeiras',-K.financeiro,p(K.financeiro)],['(-) Impostos',-K.impostos,p(K.impostos)],['(-) Pró-labore',-K.prolabore,p(K.prolabore)],['(=) LUCRO LÍQUIDO',K.lucroLiquido,p(K.lucroLiquido)]);
    if(K.gastosPessoais>0)L.push([],['Gastos Pessoais dos Sócios (fora do resultado)',K.gastosPessoais]);
    const porMes=[];for(let m=1;m<=12;m++)porMes.push(calcDRE(V.year,m));
    const nomesOp=[...new Set(porMes.flatMap(k=>k.operacionais.map(o=>o.nome)))];
    const A=[[`DRE mês a mês — ${V.year}`],[],['Linha',...MESES,'Ano']];
    const lin=(label,fn)=>{const vals=porMes.map(fn);A.push([label,...vals,round2(vals.reduce((a,b)=>a+b,0))])};
    lin('(+) Receita Bruta',k=>k.receita);lin('(-) Comissões',k=>-k.comissoes);lin('(-) Bonificações',k=>-k.bonificacoes);lin('(-) Insumos',k=>-k.insumos);lin('(-) Taxas de cartão / maquininha',k=>-k.taxas);lin('(=) Margem de Contribuição',k=>k.margemContribuicao);lin('(-) Pessoal',k=>-k.pessoalFixo);
    nomesOp.forEach(n=>lin(`(-) ${n}`,k=>{const o=k.operacionais.find(x=>x.nome===n);return o?-o.valor:0}));
    lin('(=) Resultado Operacional',k=>k.resultadoOperacional);lin('(-) Financeiro',k=>-k.financeiro);lin('(-) Impostos',k=>-k.impostos);lin('(-) Pró-labore',k=>-k.prolabore);lin('(=) LUCRO LÍQUIDO',k=>k.lucroLiquido);
    return [{nome:'DRE '+tituloPeriodoDRE().replace('/','-'),linhas:L},{nome:'DRE mensal '+V.year,linhas:A}];
  }
  if(rel==='fluxo'){
    const y=V.year,inicioAno=`${y}-01-01`;
    const saldoAntes=round2(sum(S.entradas.filter(r=>r.ativo&&r.data<inicioAno))-sum(S.despesas.filter(r=>r.ativo&&r.status==='Pago'&&r.data<inicioAno)));
    const en=Array(12).fill(0),sa=Array(12).fill(0);
    S.entradas.forEach(r=>{if(!r.ativo)return;const {y:yy,m:mm}=ym(r.mesRef);if(yy===y)en[mm-1]+=r.valor});
    S.despesas.forEach(r=>{if(!r.ativo||r.status!=='Pago')return;const {y:yy,m:mm}=ym(r.mesRef);if(yy===y)sa[mm-1]+=r.valor});
    const L=[[`Fluxo de Caixa — Barbearia Barbarossa — ${y}`],['Gerado em',fmtDate(todayISO())],['Saldo antes de '+y,saldoAntes],[],['Mês','Entradas','Saídas pagas','Resultado','Saldo acumulado']];
    let acc=saldoAntes;MESES.forEach((m,i)=>{const r=round2(en[i]-sa[i]);acc=round2(acc+r);L.push([`${m}/${y}`,round2(en[i]),round2(sa[i]),r,acc])});
    L.push(['Total',round2(en.reduce((a,b)=>a+b,0)),round2(sa.reduce((a,b)=>a+b,0)),round2(en.reduce((a,b)=>a+b,0)-sa.reduce((a,b)=>a+b,0)),acc]);
    const C=[['Conta','Tipo','Dono','Saldo atual']];S.contas.forEach(c=>C.push([c.nome,c.tipo,c.socio?'Sócio':'Empresa',saldoConta(c)]));
    const P=[['Vencimento','Descrição','Categoria','Valor','Status','Origem']];
    itensVencimentos('contaPagar',true).filter(x=>x.status==='pendente'||x.status==='atrasado').filter(x=>x.vencimento<=addDiasISO(todayISO(),90)).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).forEach(x=>P.push([fmtDate(x.vencimento),x.descricao||'',x.categoria||'',x.valor,x.status==='atrasado'?'Atrasada':'Pendente',x.origem==='conta'?'Contas a pagar':'Despesas']));
    return [{nome:'Fluxo '+y,linhas:L},{nome:'Saldos das contas',linhas:C},{nome:'A pagar (90 dias)',linhas:P}];
  }
  const I=calcIndicadores(),fo=nomeMes(I.foco);
  const L=[['Indicadores — Barbearia Barbarossa'],['Período',tituloPeriodoDRE()],['Mês de referência (churn/CAC)',fo],['Gerado em',fmtDate(todayISO())],[],['Indicador','Valor','Fórmula / base']];
  L.push(['Receita do período',I.receita,'Soma das entradas'],
    ['Ticket médio por atendimento',I.ticketAtend,I.atend?`receita operacional ÷ ${I.atend} atendimentos (${I.baseAtend})`:'sem dados de atendimentos'],
    ['Ticket médio do assinante (mensal)',I.B.ticketMensal||null,I.B.fonte?`MRR ÷ assinantes ativos (${I.B.fonte})`:'sem dados'],
    ['Assinantes ativos',I.B.ativos||null,I.B.fonte||''],
    ['Churn '+fo,I.churn.insuficiente?null:round2(I.churn.taxa*100),I.churn.insuficiente?'Dados insuficientes: '+I.churn.motivo:`% — ${I.churn.cancelados} cancelamento(s) ÷ ${I.churn.ativosIni} ativos no início${I.churn.parcial?' (mês parcial)':''}`],
    ['Permanência média (meses)',I.permanencia!=null?round2(I.permanencia):null,I.metodoPerm||'sem dados'],
    ['LTV',I.ltv,'ticket mensal do assinante × permanência'],
    ['Investimento em marketing '+fo,I.investMkt,I.fonteMkt],
    ['Novos assinantes '+fo,I.novos,'adesões na aba Clientes + contratos Celcoin iniciados no mês'],
    ['CAC',I.cac,'marketing ÷ novos assinantes'],
    ['LTV ÷ CAC',I.ltvCac,'> 3 é saudável'],
    ['Payback do CAC (meses)',I.payback,'CAC ÷ ticket mensal'],
    ['Custos fixos',I.custoFixo,'tipo de custo por categoria/lançamento'],
    ['Custos variáveis',I.custoVar,'comissões, insumos e categorias marcadas como variáveis'],
    ['Margem de contribuição (%)',I.mcPct!=null?round2(I.mcPct*100):null,'(receita − variáveis) ÷ receita'],
    ['Ponto de equilíbrio (R$)',I.pe,'custos fixos ÷ margem de contribuição %'],
    ['Cobertura do equilíbrio (%)',I.cobertura!=null?round2(I.cobertura*100):null,'receita ÷ ponto de equilíbrio'],
    ['Equilíbrio em nº de assinantes',I.peClientes,'custos fixos ÷ (MC ÷ assinantes ativos)']);
  const M=[['Item','Tipo','Qtd','Receita','Custo','Margem','Margem %']];
  I.margens.forEach(m=>M.push([m.nome,m.tipo,m.qtd,m.receita,m.custo,m.margem,m.margemPct!=null?round2(m.margemPct*100):null]));
  const CF=[['Tipo','Categoria','Valor']];['fixo','variavel'].forEach(tp=>Object.entries(I.porTipo[tp]).forEach(([k,v])=>CF.push([tp==='fixo'?'Fixo':'Variável',k,round2(v)])));
  return [{nome:'Indicadores',linhas:L},{nome:'Margem por item',linhas:M},{nome:'Custos fixo x variável',linhas:CF}];
}
function montarWorkbook(abas){
  const wb=XLSX.utils.book_new();
  abas.forEach(a=>{
    const ws=XLSX.utils.aoa_to_sheet(a.linhas.map(l=>l.map(v=>v==null?'':v)));
    const maxCols=Math.max(1,...a.linhas.map(l=>l.length));
    ws['!cols']=Array.from({length:maxCols},(_,i)=>({wch:i===0?38:16}));
    Object.keys(ws).forEach(k=>{if(k[0]!=='!'&&ws[k].t==='n')ws[k].z='#,##0.00'});
    XLSX.utils.book_append_sheet(wb,ws,a.nome.replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31));
  });
  return wb;
}
async function exportarExcel(rel){
  const abas=linhasExcel(rel);
  const sufixo=rel==='fluxo'?String(V.year):(V.range?tituloPeriodoDRE().replace(/[\/\s]+/g,'-').replace(/º/g,''):`${V.year}${V.month==='all'?'':'-'+pad(V.month)}`);
  const nome=`barbarossa-${rel}-${sufixo}.xlsx`;
  if(typeof XLSX==='undefined'){
    const cel=v=>{v=v==null?'':v;return typeof v==='number'?String(v).replace('.',','):'"'+String(v).replace(/"/g,'""')+'"'};
    const csv='﻿'+abas.map(a=>a.nome+'\n'+a.linhas.map(l=>l.map(cel).join(';')).join('\n')).join('\n\n');
    toast('Leitor de Excel indisponível (sem internet?) — gerando .csv, que também abre no Excel.');
    await baixar(nome.replace(/\.xlsx$/,'.csv'),csv);
    return 'csv';
  }
  const wb=montarWorkbook(abas);
  let dl=null;
  try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(dl){
    try{const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});await dl.save({filename:nome,data:buf});toast('Planilha gerada');return 'saved'}
    catch(e){if(e&&e.code==='declined')return 'declined';if(e&&e.code==='rate_limited'){toast('Já há um download aguardando confirmação.');return 'rate_limited'}}
  }
  try{XLSX.writeFile(wb,nome);toast('Planilha gerada');return 'writeFile'}
  catch(e){toast('Não foi possível gerar o Excel neste navegador.');return 'erro'}
}

    const box=document.getElementById('cartaocb_relatorio');if(box)box.innerHTML=relatorioCartaoBox();
    toast('Removido');
  }
  }catch(err){
    console.error('Falha ao processar a ação',a,err);
    try{registrarErroDebug(a,err)}catch(e2){}
    try{save()}catch(e2){}
    try{closeModal()}catch(e2){}
    try{render()}catch(e2){}
    toast('Algo deu errado ao salvar. Tente de novo — se persistir, feche e abra o app de novo.');
  }
});

/* ===== Reordenar contas: segurar (~0,35 s) numa conta e arrastar pra cima/baixo; ao soltar a ordem fica salva. ===== */
function reordenarContas(ids){
  const set=new Set(ids),idx=[];S.contas.forEach((c,i)=>{if(set.has(c.id))idx.push(i)});
  const porId={};S.contas.forEach(c=>{porId[c.id]=c});
  const novos=ids.map(id=>porId[id]).filter(Boolean);
  if(novos.length!==idx.length||!idx.length){render();return}
  if(!idx.some((i,k)=>S.contas[i]!==novos[k])){render();return} // não mudou
  snap();idx.forEach((i,k)=>{S.contas[i]=novos[k]});save();render();toast('Ordem das contas salva');
}
(function(){
  let timer=null,drag=null,bloqueioAte=0,ini=null,ultimoY=0;
  const SEL='.conta-bloco > .row[data-act="verextratoconta"]';
  const paiRolavel=el=>{for(let p=el.parentElement;p&&p!==document.body;p=p.parentElement){const o=getComputedStyle(p).overflowY;if((o==='auto'||o==='scroll')&&p.scrollHeight>p.clientHeight+4)return p}return null};
  function ajustar(y){
    if(!drag)return;
    const {el,grupo}=drag;
    if(!document.body.contains(el)){fim(true);return}
    ultimoY=y;
    el.style.transform='none';
    const nat=el.getBoundingClientRect().top;
    el.style.transform=`translateY(${y-drag.grab-nat}px)`;
    const centro=y-drag.grab+drag.h/2,prev=el.previousElementSibling,next=el.nextElementSibling;
    if(prev&&prev.classList.contains('conta-bloco')){const r=prev.getBoundingClientRect();if(centro<r.top+r.height/2){grupo.insertBefore(el,prev);return ajustar(y)}}
    if(next&&next.classList.contains('conta-bloco')){const r=next.getBoundingClientRect();if(centro>r.top+r.height/2){grupo.insertBefore(next,el);return ajustar(y)}}
  }
  function rolar(y){
    if(!drag)return;
    const dy=y<90?-14:(y>innerHeight-90?14:0);if(!dy)return;
    const p=paiRolavel(drag.el);(p||window).scrollBy(0,dy);
    ajustar(y);
  }
  function comecar(bloco,y){
    const r=bloco.getBoundingClientRect(),grupo=bloco.closest('.grupo-contas');
    if(!grupo||grupo.querySelectorAll('.conta-bloco').length<2)return;
    drag={el:bloco,grupo,grab:y-r.top,h:r.height};
    bloco.classList.add('arrastando');document.body.classList.add('arrastando-contas');
    try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
    ajustar(y);
  }
  function fim(cancelar){
    clearTimeout(timer);timer=null;ini=null;
    if(!drag)return;
    const {el,grupo}=drag;
    el.style.transform='';el.classList.remove('arrastando');document.body.classList.remove('arrastando-contas');
    drag=null;bloqueioAte=Date.now()+450; // o "soltar" não pode abrir o extrato da conta
    if(cancelar){render();return}
    reordenarContas([...grupo.querySelectorAll('.conta-bloco')].map(b=>b.dataset.contaId));
  }
  function armar(alvo,x,y){
    const row=alvo.closest&&alvo.closest(SEL);if(!row||alvo.closest('button'))return;
    ini={x,y,bloco:row.parentElement};
    clearTimeout(timer);timer=setTimeout(()=>{timer=null;if(ini)comecar(ini.bloco,ini.y)},350);
  }
  function mover(x,y,evento){
    if(drag){if(evento&&evento.cancelable)evento.preventDefault();ajustar(y);rolar(y);return}
    if(timer&&ini&&(Math.abs(x-ini.x)>10||Math.abs(y-ini.y)>10)){clearTimeout(timer);timer=null;ini=null} // era rolagem, não arrasto
  }
  // toque (celular)
  document.addEventListener('touchstart',e=>{const t=e.touches[0];if(t&&e.touches.length===1)armar(e.target,t.clientX,t.clientY)},{passive:true});
  document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)mover(t.clientX,t.clientY,e)},{passive:false});
  document.addEventListener('touchend',()=>{if(drag)fim(false);else{clearTimeout(timer);timer=null;ini=null}});
  document.addEventListener('touchcancel',()=>{if(drag)fim(true);else{clearTimeout(timer);timer=null;ini=null}});
  // mouse (computador): clicar e segurar
  document.addEventListener('mousedown',e=>{if(e.button===0&&!('ontouchstart' in window&&e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents))armar(e.target,e.clientX,e.clientY)});
  document.addEventListener('mousemove',e=>mover(e.clientX,e.clientY,e));
  document.addEventListener('mouseup',()=>{if(drag)fim(false);else{clearTimeout(timer);timer=null;ini=null}});
  // o clique que vem logo depois de soltar não pode abrir o extrato
  document.addEventListener('click',e=>{if(Date.now()<bloqueioAte){e.stopPropagation();e.preventDefault()}},true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.conta-bloco')&&(timer||drag))e.preventDefault()});
})();
</script>
